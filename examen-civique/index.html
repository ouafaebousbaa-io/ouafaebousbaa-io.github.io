l'épidémie de Covid-19 en 2020", "L'obligation de voter pour un parti donné"], "answer": 2, "explication": "Lors de l'état d'urgence sanitaire de mars 2020, la liberté d'aller et venir, de réunion et d'entreprendre a été limitée pour protéger la santé de tous. Une restriction doit être prévue par la loi et justifiée.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/droits-et-devoirs/obligations-et-devoirs-des-personnes-residant-en-france/la-limite-des-libertes-individuelles/"}, {"q": "Quelle est l’attitude à avoir lorsque qu'on est témoin de violences ?", "options": ["Ne rien faire, ce n'est pas son affaire", "Frapper l'agresseur", "Publier une vidéo de la scène sur les réseaux sociaux", "Se protéger, alerter (17 ou 112) et aider la victime sans se mettre en danger"], "answer": 3, "explication": "Le témoin doit d'abord se protéger, puis alerter les forces de l'ordre ou chercher de l'aide, écouter la victime et l'orienter vers les aides. Il peut aussi témoigner ou faire un signalement.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/droits-et-devoirs/obligations-et-devoirs-des-personnes-residant-en-france/le-role-des-temoins-en-cas-de-violences/"}, {"q": "Quelle est l'infraction la plus grave ?", "options": ["Le crime", "La contravention", "Le délit", "L'avertissement"], "answer": 0, "explication": "Il existe trois catégories d'infractions : contravention (la moins grave), délit, puis crime (la plus grave). Le crime est puni de 15 ans de prison à la perpétuité et jugé par la cour d'assises ou la cour criminelle.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/droits-et-devoirs/obligations-et-devoirs-des-personnes-residant-en-france/se-conformer-aux-lois-les-infractions/"}, {"q": "Quelle obligation concerne toutes les personnes résidant en France quelle que soit leur nationalité ?", "options": ["Voter à toutes les élections", "Respecter les lois et payer ses impôts", "Effectuer la Journée défense et citoyenneté", "Être juré à la cour d'assises"], "answer": 1, "explication": "Toute personne vivant en France, française ou étrangère, doit respecter la loi et payer ses impôts. Le vote, la JDC et la fonction de juré concernent uniquement les citoyens français.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/droits-et-devoirs/obligations-et-devoirs-des-personnes-residant-en-france/les-obligations-en-tant-que-resident-francais/"}, {"q": "Quelle proposition représente un exemple de crime ?", "options": ["Un excès de vitesse", "Un vol à l'étalage", "Un meurtre", "Le tapage nocturne"], "answer": 2, "explication": "Le meurtre, l'assassinat, le viol, le braquage ou le terrorisme sont des crimes. Le vol est un délit ; l'excès de vitesse et le tapage nocturne sont des contraventions.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/droits-et-devoirs/obligations-et-devoirs-des-personnes-residant-en-france/se-conformer-aux-lois-les-infractions/"}, {"q": "Quelle proposition représente un exemple de délit ?", "options": ["Un meurtre", "Le stationnement gênant", "Le tapage nocturne", "Un vol"], "answer": 3, "explication": "Le vol, la fraude fiscale ou le harcèlement sont des délits, jugés par le tribunal correctionnel (de 2 mois à 10 ans de prison). Le meurtre est un crime ; le tapage nocturne et le stationnement gênant sont des contraventions.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/droits-et-devoirs/obligations-et-devoirs-des-personnes-residant-en-france/se-conformer-aux-lois-les-infractions/"}, {"q": "Qui veille au maintien de l’ordre public ?", "options": ["La police et la gendarmerie", "Les syndicats", "Les associations de quartier", "Les entreprises de transport"], "answer": 0, "explication": "Les forces de l'ordre, police en ville et gendarmerie en zone rurale et périurbaine, sont chargées notamment du maintien de l'ordre public et de la protection des personnes et des biens.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/droits-et-devoirs/obligations-et-devoirs-des-personnes-residant-en-france/se-conformer-aux-lois-les-acteurs/"}, {"q": "S'agissant des déchets, quelle proposition est correcte ?", "options": ["On peut déposer ses vieux meubles n'importe où sur le trottoir", "Le tri des déchets est réservé aux grandes villes", "Il est interdit d'abandonner ses déchets dans l'espace public", "Jeter ses déchets dans la nature est autorisé à la campagne"], "answer": 2, "explication": "Abandonner des déchets dans l'espace public est une contravention qui peut être punie d'une amende allant jusqu'à 1 500 €. Il faut utiliser les poubelles, le tri sélectif et les déchetteries.", "source": "https://www.service-public.gouv.fr/particuliers/actualites/A18955"}]}, {"theme": "Histoire, géographie et culture", "questions": [{"q": "Quel était le surnom de Louis XIV ?", "options": ["Le Bien-Aimé", "Le Petit Caporal", "Le Roi-Soleil", "Cœur de Lion"], "answer": 2, "explication": "Louis XIV, qui incarne la monarchie absolue de droit divin, était surnommé le Roi-Soleil.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/les-regimes-politiques-depuis-1789/l-ancien-regime-jusqu-en-1789/"}, {"q": "Quel roi de France a été exécuté pendant la Révolution française ?", "options": ["Louis XIV", "Henri IV", "Louis XVI", "Louis-Philippe"], "answer": 2, "explication": "Louis XVI a été renversé le 10 août 1792 puis exécuté en 1793, pendant la Terreur.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/les-regimes-politiques-depuis-1789/la-premiere-republique-1792-1804/"}, {"q": "En quelle année Napoléon Ier est-il devenu empereur ?", "options": ["1789", "1804", "1815", "1848"], "answer": 1, "explication": "Napoléon Bonaparte est proclamé empereur le 18 mai 1804 : c'est le début du Premier Empire, qui dure jusqu'en 1815.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/les-regimes-politiques-depuis-1789/le-1er-empire-1804-1815/"}, {"q": "Lequel de ces personnages a un lien avec la République française ?", "options": ["Astérix", "Marianne", "Le Petit Prince", "Cendrillon"], "answer": 1, "explication": "Marianne est l'allégorie de la République française ; son buste est présent dans les mairies et son visage figure sur les timbres et le logo de l'État.", "source": "https://www.info.gouv.fr/actualite/la-petite-histoire-de-marianne"}, {"q": "De quand date l'appel à la résistance du général de Gaulle ?", "options": ["Du 18 juin 1940", "Du 11 novembre 1918", "Du 6 juin 1944", "Du 8 mai 1945"], "answer": 0, "explication": "Le 18 juin 1940, depuis Londres et à la radio, de Gaulle appelle les Français à refuser la défaite et à poursuivre le combat.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/zoom-sur/focus-sur-la-seconde-guerre-mondiale-la-resistance-et-la-lib%C3%A9ration/"}, {"q": "Pourquoi la Shoah est-elle étudiée à l'école ?", "options": ["Pour transmettre la mémoire de ce génocide et lutter contre le racisme et l'antisémitisme", "Pour apprendre la géographie de l'Allemagne", "Parce que c'est une tradition religieuse", "Pour célébrer la victoire de 1945"], "answer": 0, "explication": "On l'étudie par devoir de mémoire, pour comprendre où mènent la haine, le racisme et l'antisémitisme, et éviter que de tels crimes se reproduisent.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/zoom-sur/focus-sur-la-seconde-guerre-mondiale-la-shoah/"}, {"q": "Quel pays a été colonisé par la France ?", "options": ["L'Algérie", "Le Japon", "L'Argentine", "La Suède"], "answer": 0, "explication": "L'Algérie a été conquise par l'armée française à partir de 1830 et est devenue indépendante en 1962, après la guerre d'Algérie.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/zoom-sur/le-territoire-francais-dans-le-temps-1/"}, {"q": "Depuis quand les Français élisent-ils le président de la République au suffrage universel direct ?", "options": ["Depuis 1789", "Depuis 1875", "Depuis 2002", "Depuis 1962"], "answer": 3, "explication": "La réforme approuvée par référendum en 1962 instaure l'élection directe du président ; la première a eu lieu en 1965.", "source": "https://www.elysee.fr/la-presidence/l-election-des-presidents-de-la-republique-depuis-195"}, {"q": "Quelle est la première étape de la construction européenne en 1951 ?", "options": ["La création de la CECA (Communauté européenne du charbon et de l'acier)", "La mise en circulation de l'euro", "Le traité de Maastricht", "L'adhésion du Royaume-Uni"], "answer": 0, "explication": "En 1951, six pays dont la France créent la CECA pour mettre en commun le charbon et l'acier ; le traité de Rome suivra en 1957.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/les-conflits-mondiaux-et-le-nouvel-ordre-mondial/la-construction-europeenne/"}, {"q": "Durant le mandat de quel président la peine de mort a-t-elle été abolie ?", "options": ["Charles de Gaulle", "François Mitterrand", "Jacques Chirac", "Nicolas Sarkozy"], "answer": 1, "explication": "La peine de mort est abolie par la loi du 9 octobre 1981, sous la présidence de François Mitterrand, à l'initiative du garde des Sceaux Robert Badinter.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/la-cinquieme-republique/focus-sur-la-cinquieme-republique-5/"}, {"q": "Quel régime politique a été mis en place pendant la Révolution française en 1792 ?", "options": ["L'Empire", "La monarchie absolue", "La dictature militaire", "La République"], "answer": 3, "explication": "Après la chute du roi, la Première République est proclamée le 22 septembre 1792.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/les-regimes-politiques-depuis-1789/la-premiere-republique-1792-1804/"}, {"q": "Qui était une figure de la Résistance française pendant la Seconde Guerre mondiale ?", "options": ["Philippe Pétain", "Jean Moulin", "Napoléon Ier", "Louis XIV"], "answer": 1, "explication": "Jean Moulin a unifié les mouvements de résistance en créant le Conseil national de la Résistance (CNR) en 1943.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/zoom-sur/focus-sur-la-seconde-guerre-mondiale-la-resistance-et-la-lib%C3%A9ration/"}, {"q": "En 1944, qu'est-ce qui a changé pour les femmes ?", "options": ["Elles ont obtenu le droit de vote", "Elles ont obtenu le droit de travailler", "Elles ont dû faire le service militaire", "Elles ont obtenu le droit à l'avortement"], "answer": 0, "explication": "En avril 1944, le Gouvernement provisoire accorde aux femmes le droit de vote ; elles votent pour la première fois en 1945.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/les-regimes-politiques-depuis-1789/le-gouvernement-provisoire-de-la-republique-francaise-1944-1946/"}, {"q": "Quelle organisation internationale a été créée en 1945 après la Seconde Guerre mondiale ?", "options": ["L'Union européenne", "L'ONU (Organisation des Nations unies)", "L'OTAN", "La Société des Nations"], "answer": 1, "explication": "L'ONU est créée en 1945 pour maintenir la paix dans le monde ; l'OTAN date de 1949 et l'Union européenne de 1992.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/les-conflits-mondiaux-et-le-nouvel-ordre-mondial/les-conflits-mondiaux-la-seconde-guerre-mondiale-1939-1945-les-consequences/"}, {"q": "Quelle peine a été supprimée en 1981 ?", "options": ["La prison à perpétuité", "Les amendes", "La peine de mort", "Le travail d'intérêt général"], "answer": 2, "explication": "La loi du 9 octobre 1981 abolit la peine de mort ; depuis 2007, la Constitution précise que nul ne peut y être condamné.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/la-cinquieme-republique/focus-sur-la-cinquieme-republique-5/"}, {"q": "En quelle année l'euro est-elle devenue la monnaie utilisée en France ?", "options": ["2002", "1958", "1981", "2012"], "answer": 0, "explication": "Les pièces et billets en euros circulent en France depuis le 1er janvier 2002 ; l'euro existait déjà depuis 1999 comme monnaie de compte et pour les paiements électroniques.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/les-conflits-mondiaux-et-le-nouvel-ordre-mondial/la-construction-europeenne/"}, {"q": "En quelle année a commencé la Première Guerre mondiale ?", "options": ["1870", "1905", "1914", "1939"], "answer": 2, "explication": "La Première Guerre mondiale commence en 1914 (guerre déclarée en août) et se termine par l'armistice du 11 novembre 1918.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/les-conflits-mondiaux-et-le-nouvel-ordre-mondial/la-premiere-guerre-mondiale-1/"}, {"q": "Où a eu lieu le débarquement en 1944 ?", "options": ["En Bretagne", "En Alsace", "En Normandie", "En Corse"], "answer": 2, "explication": "Le 6 juin 1944, les Alliés débarquent en Normandie, ce qui ouvre la Libération de la France ; un second débarquement a lieu en Provence le 15 août 1944.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/les-conflits-mondiaux-et-le-nouvel-ordre-mondial/la-seconde-guerre-mondiale-1/"}, {"q": "Quel continent a été le plus concerné par la décolonisation française après la Seconde Guerre mondiale ?", "options": ["L'Europe", "L'Amérique du Sud", "L'Océanie", "L'Afrique"], "answer": 3, "explication": "La plupart des colonies devenues indépendantes étaient en Afrique : Afrique subsaharienne et Madagascar en 1960, Algérie en 1962.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/les-conflits-mondiaux-et-le-nouvel-ordre-mondial/la-decolonisation/"}, {"q": "Que fête-t-on le 8 mai ?", "options": ["L'armistice de 1918", "La prise de la Bastille", "La fête du Travail", "La victoire de 1945, fin de la Seconde Guerre mondiale en Europe"], "answer": 3, "explication": "Le 8 mai commémore la capitulation de l'Allemagne en 1945 ; l'armistice de 1918 est commémoré le 11 novembre.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/zoom-sur/patrimoine-francais-les-jours-feries/"}, {"q": "Quelle mer ou océan borde la France métropolitaine ?", "options": ["La mer Baltique", "La mer Noire", "L'océan Indien", "La mer Méditerranée"], "answer": 3, "explication": "La France métropolitaine est bordée par la mer du Nord, la Manche, l'océan Atlantique et la mer Méditerranée.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/atlas-de-la-france/les-frontieres-de-la-france/"}, {"q": "Quel pays a une frontière terrestre avec la France métropolitaine ?", "options": ["Le Portugal", "Les Pays-Bas", "La Belgique", "L'Autriche"], "answer": 2, "explication": "Les voisins terrestres de la France métropolitaine sont la Belgique, le Luxembourg, l'Allemagne, la Suisse, l'Italie, Monaco, l'Espagne et Andorre.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/atlas-de-la-france/les-frontieres-de-la-france/"}, {"q": "Quelle ville française est un port maritime ?", "options": ["Lyon", "Toulouse", "Dijon", "Marseille"], "answer": 3, "explication": "Marseille, sur la Méditerranée, est l'un des sept grands ports maritimes de métropole, avec Dunkerque, Le Havre, Rouen, Nantes-Saint-Nazaire, La Rochelle et Bordeaux.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/la-france-dans-leurope-et-dans-le-monde/les-ports-francais/"}, {"q": "Quelle mer se situe entre la France et l'Angleterre ?", "options": ["La Manche", "La mer Méditerranée", "La mer Baltique", "La mer Adriatique"], "answer": 0, "explication": "La Manche sépare la côte nord-ouest de la France de l'Angleterre.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/atlas-de-la-france/les-frontieres-de-la-france/"}, {"q": "Qu'est ce que la France d'outre-mer ?", "options": ["Les territoires français situés hors du continent européen", "Les pays étrangers où l'on parle français", "Les anciennes colonies devenues indépendantes", "Les régions frontalières de la France métropolitaine"], "answer": 0, "explication": "L'outre-mer regroupe les territoires français situés dans plusieurs océans : DROM (Guadeloupe, Martinique, Guyane, La Réunion, Mayotte) et collectivités d'outre-mer.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/atlas-de-la-france/le-territoire-de-la-france/"}, {"q": "Quelle chaîne de montagnes est située entre la France et l’Espagne ?", "options": ["Les Pyrénées", "Les Alpes", "Le Jura", "Les Vosges"], "answer": 0, "explication": "Les Pyrénées forment la frontière naturelle entre la France et l'Espagne, au sud.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/atlas-de-la-france/les-frontieres-de-la-france/"}, {"q": "Quelle île française se trouve dans l'océan Indien ?", "options": ["La Réunion", "La Corse", "La Martinique", "La Guadeloupe"], "answer": 0, "explication": "La Réunion est une île volcanique de l'océan Indien, à l'est de Madagascar ; la Martinique et la Guadeloupe sont dans les Caraïbes.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/les-regions-fran%C3%A7aises/la-reunion/"}, {"q": "Quelle est la population approximative de la France en 2025 ?", "options": ["Environ 38 millions d'habitants", "Environ 98 millions d'habitants", "Environ 68,6 millions d'habitants", "Environ 150 millions d'habitants"], "answer": 2, "explication": "Au 1er janvier 2025, la France compte environ 68,6 millions d'habitants, dont 66,4 millions en métropole.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/atlas-de-la-france/la-demographie-francaise/"}, {"q": "Quel fleuve traverse Paris ?", "options": ["La Seine", "La Loire", "Le Rhône", "La Garonne"], "answer": 0, "explication": "La Seine traverse Troyes, Paris, Rouen et Le Havre avant de se jeter dans la Manche.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/atlas-de-la-france/les-fleuves-fran%C3%A7ais/"}, {"q": "Lequel de ces pays partage des frontières terrestres avec la France ?", "options": ["La Suisse", "Le Danemark", "La Pologne", "Le Royaume-Uni"], "answer": 0, "explication": "La Suisse est voisine de la France à l'est ; le Royaume-Uni en est séparé par la Manche.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/atlas-de-la-france/les-frontieres-de-la-france/"}, {"q": "Quel pays a une frontière avec la France métropolitaine au nord-est ?", "options": ["L'Espagne", "Andorre", "L'Allemagne", "L'Italie"], "answer": 2, "explication": "L'Allemagne, comme la Belgique et le Luxembourg, est voisine de la France au nord-est ; l'Espagne et Andorre sont au sud, l'Italie au sud-est.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/atlas-de-la-france/les-frontieres-de-la-france/"}, {"q": "Où se trouvent les principales activités économiques en France ?", "options": ["Dans les zones de montagne", "Dans les petits villages ruraux", "Uniquement dans les ports", "Dans les grandes métropoles"], "answer": 3, "explication": "La population, les emplois, les richesses et les sièges d'entreprises se concentrent dans les métropoles : c'est la métropolisation.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/atlas-de-la-france/la-france-aire-urbaine-et-metropolisation/"}, {"q": "Parmi ces pays, lequel attire le plus de visiteurs chaque année ?", "options": ["L'Allemagne", "La France", "Le Portugal", "La Belgique"], "answer": 1, "explication": "La France est la première destination touristique au monde, avec plus de 100 millions de voyageurs en 2024.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/la-france-dans-leurope-et-dans-le-monde/une-puissance-touristique/"}, {"q": "Où habite la majorité des Français ?", "options": ["À la campagne", "En montagne", "Dans les territoires d'outre-mer", "En ville"], "answer": 3, "explication": "Environ 81 % de la population vit en ville, surtout dans les grandes aires urbaines comme Paris, Lyon ou Marseille.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/atlas-de-la-france/la-demographie-francaise/"}, {"q": "Quelle région est la plus peuplée ?", "options": ["La Corse", "L'Île-de-France", "La Bretagne", "Le Centre-Val de Loire"], "answer": 1, "explication": "Avec environ 12,4 millions d'habitants, l'Île-de-France est la région la plus peuplée de France.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/les-regions-fran%C3%A7aises/ile-de-france/"}, {"q": "Quelle ville française fait partie des 10 plus grandes métropoles du pays ?", "options": ["Limoges", "Brest", "Bordeaux", "Amiens"], "answer": 2, "explication": "Bordeaux Métropole (environ 855 000 habitants) est 5e du classement, derrière Paris, Aix-Marseille, Lyon et Lille.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/atlas-de-la-france/la-france-aire-urbaine-et-metropolisation/"}, {"q": "Lequel de ces départements de France est le plus touristique ?", "options": ["La Creuse", "Le Cantal", "La Côte-d'Or", "Paris"], "answer": 3, "explication": "Avec ses monuments et ses musées (Louvre, tour Eiffel, Orsay), Paris est le département qui attire le plus de visiteurs.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/la-france-dans-leurope-et-dans-le-monde/une-puissance-touristique/"}, {"q": "Quand peut-on visiter gratuitement des lieux culturels en France ?", "options": ["Tous les lundis", "Uniquement le 14 juillet", "Le premier dimanche du mois, dans la plupart des musées nationaux", "Jamais : l'entrée est toujours payante"], "answer": 2, "explication": "Les collections de la plupart des musées nationaux sont gratuites le premier dimanche du mois ; les Journées européennes du patrimoine, en septembre, ouvrent aussi de nombreux lieux gratuitement.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/culture/patrimoine-francais-acces-a-la-culture/"}, {"q": "Combien de personnes parlent français dans le monde ?", "options": ["Environ 70 millions", "Environ 150 millions", "Plus de 1 milliard", "Plus de 390 millions"], "answer": 3, "explication": "Selon la fiche, plus de 396 millions de personnes parlent français, sur les 5 continents.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/culture/patrimoine-francais-la-langue-francaise-dans-le-monde/"}, {"q": "Qui était Marguerite Yourcenar ?", "options": ["Une chanteuse française", "Une écrivaine française", "Une reine de France", "Une résistante fusillée en 1944"], "answer": 1, "explication": "Marguerite Yourcenar (1903-1987) est une écrivaine, autrice notamment des Mémoires d'Hadrien et de L'Œuvre au noir.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/culture/patrimoine-francais-artistes-emblematiques-parmi-les-auteurs-3/"}, {"q": "Quel peintre est français ?", "options": ["Vincent Van Gogh", "Claude Monet", "Rembrandt", "Francisco de Goya"], "answer": 1, "explication": "Claude Monet (1840-1926) est un peintre français ; l'impressionnisme tire son nom de son tableau Impression, soleil levant.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/culture/patrimoine-francais-artistes-emblematiques-parmi-les-peintres/"}, {"q": "Quel musée est situé à Paris ?", "options": ["Le musée d'Orsay", "Le musée du Prado", "Le British Museum", "Le MoMA"], "answer": 0, "explication": "Le musée d'Orsay se trouve à Paris, comme le Louvre ; le Prado est à Madrid, le British Museum à Londres et le MoMA à New York.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/culture/une-puissance-culturelle/"}, {"q": "Qui était Auguste Rodin ?", "options": ["Un président de la République", "Un sculpteur", "Un chanteur", "Un général de la Première Guerre mondiale"], "answer": 1, "explication": "Auguste Rodin (1840-1917) est un sculpteur français, auteur du Penseur et du Baiser ; un musée lui est consacré à Paris.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/culture/patrimoine-francais-artistes-emblematiques-parmi-les-sculpteurs/"}, {"q": "Quel est le classement de la langue française parmi les langues les plus parlées dans le monde ?", "options": ["1re", "4e", "12e", "20e"], "answer": 1, "explication": "Le français est la quatrième langue la plus parlée au monde selon la fiche officielle.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/culture/patrimoine-francais-la-langue-francaise-dans-le-monde/"}, {"q": "Quelle cathédrale célèbre a été en partie détruite par un incendie en 2019 ?", "options": ["La cathédrale de Chartres", "La cathédrale de Reims", "Notre-Dame de Paris", "La cathédrale de Strasbourg"], "answer": 2, "explication": "Notre-Dame de Paris a brûlé en 2019 ; plus de 840 millions d'euros de dons ont financé sa reconstruction.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/culture/patrimoine-francais-le-citoyen-acteur-et-conservateur-de-la-culture-en-france/"}, {"q": "Qui était une écrivaine française célèbre ?", "options": ["Virginia Woolf", "Simone de Beauvoir", "Agatha Christie", "Jane Austen"], "answer": 1, "explication": "Simone de Beauvoir (1908-1986) est une écrivaine française, autrice du Deuxième Sexe ; les trois autres sont britanniques.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/culture/patrimoine-francais-artistes-emblematiques-parmi-les-auteurs-3/"}, {"q": "Qui était un célèbre musicien français ?", "options": ["Wolfgang Amadeus Mozart", "Ludwig van Beethoven", "Claude Debussy", "Giuseppe Verdi"], "answer": 2, "explication": "Claude Debussy (1862-1918) est un compositeur français, auteur de Clair de lune et de La Mer.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/culture/patrimoine-francais-artistes-emblematiques-dans-univers-musique/"}, {"q": "Qui était Auguste Renoir ?", "options": ["Un écrivain du XVIIe siècle", "Un roi de France", "Un inventeur du cinéma", "Un peintre impressionniste"], "answer": 3, "explication": "Auguste Renoir (1841-1919) est un peintre impressionniste français, auteur du Bal du moulin de la Galette et du Déjeuner des canotiers.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/culture/patrimoine-francais-artistes-emblematiques-parmi-les-peintres/"}, {"q": "Quelle fête est française ?", "options": ["Thanksgiving", "La Saint-Patrick", "Le 4 juillet, fête de l'Indépendance", "Le 14 juillet, fête nationale"], "answer": 3, "explication": "Le 14 juillet est la fête nationale française, avec défilé militaire, feux d'artifice et bals ; Thanksgiving et le 4 juillet sont américains, la Saint-Patrick irlandaise.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/zoom-sur/patrimoine-francais-les-jours-feries/"}]}, {"theme": "Vivre dans la société française", "questions": [{"q": "Quel mariage est reconnu par l'État ?", "options": ["Le mariage civil célébré à la mairie", "Le mariage religieux uniquement", "Le mariage coutumier", "Toute union célébrée devant des témoins"], "answer": 0, "explication": "En France, seul le mariage civil, célébré par un officier d'état civil à la mairie, est reconnu par l'État ; il est ouvert aux couples de même sexe ou de sexe différent.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/vivre-dans-la-societe-fran%C3%A7aise/demarches-administratives/la-declaration-de-mariage/"}, {"q": "Auprès de quelle institution les parents peuvent-ils inscrire leur enfant à l'école publique ?", "options": ["La préfecture", "La mairie", "La caisse d'allocations familiales (CAF)", "Le commissariat de police"], "answer": 1, "explication": "Pour inscrire son enfant à l'école publique, il suffit de s'adresser à la mairie (ou à l'école) proche du domicile.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/vivre-dans-la-societe-fran%C3%A7aise/parentalite/la-liberte-de-choisir-l-ecole-de-son-enfant/"}, {"q": "En cas de divorce, qui exerce l'autorité parentale ?", "options": ["Toujours la mère seule", "Toujours le père seul", "En règle générale, les deux parents en commun", "Le parent qui a les revenus les plus élevés"], "answer": 2, "explication": "Le divorce ne met pas fin à l'autorité parentale partagée : elle reste en principe exercée par les deux parents ; le juge ne la confie à un seul parent que dans des circonstances particulières.", "source": "https://www.service-public.gouv.fr/particuliers/vosdroits/F3133"}, {"q": "Quelle aide permet aux personnes qui ont des difficultés financières d'avoir un avocat ?", "options": ["L'allocation de rentrée scolaire", "La prime d'activité", "L'aide personnalisée au logement (APL)", "L'aide juridictionnelle"], "answer": 3, "explication": "Avec l'aide juridictionnelle, l'État prend en charge tout ou partie des frais de justice, notamment les honoraires d'avocat, des personnes aux ressources insuffisantes.", "source": "https://www.conseil-etat.fr/CE/Fichiers/Aide%20juridictionelle%20Falc.pdf"}, {"q": "Où faut-il déclarer la naissance d'un enfant ?", "options": ["À la préfecture du domicile", "À la mairie du lieu de naissance", "Au consulat du pays d'origine des parents", "À la caisse primaire d'assurance maladie (CPAM)"], "answer": 1, "explication": "La déclaration de naissance est obligatoire et se fait à la mairie du lieu de naissance, dans les 5 jours qui suivent l'accouchement ; l'officier d'état civil établit alors l'acte de naissance.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/vivre-dans-la-societe-fran%C3%A7aise/demarches-administratives/la-declaration-de-naissance/"}, {"q": "Quelle est l'une des conditions pour passer l'examen du permis de conduire ?", "options": ["Avoir au moins 21 ans", "Être de nationalité française", "Être propriétaire d'une voiture", "Avoir au moins 17 ans"], "answer": 3, "explication": "Pour passer le permis de conduire (voiture) en France, il faut avoir au moins 17 ans et résider en France ; on peut passer par une auto-école ou en candidat libre.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/vivre-dans-la-societe-fran%C3%A7aise/demarches-administratives/les-demarches-du-quotidien-comme-le-permis-de-conduire-1/"}, {"q": "Un bail locatif est valide s'il est :", "options": ["Écrit et signé par le locataire et le propriétaire", "Simplement conclu oralement entre le locataire et le propriétaire", "Signé uniquement par le locataire", "Validé par la préfecture"], "answer": 0, "explication": "Le bail est un contrat écrit entre le bailleur et le locataire : il n'est valide que s'il est signé par les deux, et c'est le seul document qui autorise à vivre dans le logement.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/vivre-dans-la-societe-fran%C3%A7aise/demarches-administratives/les-demarches-relatives-au-logement-1/"}, {"q": "Où peut-on déposer un lave-vaisselle cassé ?", "options": ["Dans la poubelle des ordures ménagères", "Sur le trottoir, à n'importe quel moment", "À la déchetterie", "Dans le bac de tri des emballages"], "answer": 2, "explication": "Un appareil électroménager usagé ne va pas dans les poubelles ordinaires : on le dépose à la déchetterie (ou on le fait reprendre par le vendeur lors d'un nouvel achat) ; l'abandon de déchets sur la voie publique est puni d'une amende.", "source": "https://www.service-public.gouv.fr/particuliers/vosdroits/F31954"}, {"q": "Quel numéro d'urgence permet d'appeler la police ?", "options": ["Le 17", "Le 15", "Le 18", "Le 115"], "answer": 0, "explication": "Le 17 permet d'appeler la police ou la gendarmerie ; le 15 est le SAMU, le 18 les pompiers, le 112 le numéro d'urgence européen et le 115 l'aide aux personnes sans abri.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/vivre-dans-la-societe-fran%C3%A7aise/demarches-administratives/annexe-les-numeros-durgence/"}, {"q": "Concernant l'accès aux soins, quelle proposition est correcte ?", "options": ["Le médecin est imposé au patient par la mairie", "Chaque patient peut choisir librement son médecin", "L'hôpital public est réservé aux personnes de nationalité française", "Un patient peut exiger un acte contraire à l'organisation de l'hôpital pour des raisons religieuses"], "answer": 1, "explication": "Le libre choix du praticien et de l'établissement de santé est un droit du patient : aucun médecin ni hôpital ne peut lui être imposé, et le service public hospitalier est accessible à tous.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/vivre-dans-la-societe-fran%C3%A7aise/sante/sante-les-droits-du-patient/"}, {"q": "À qui est accessible la contraception ?", "options": ["Uniquement aux personnes majeures", "Uniquement aux femmes mariées", "À toutes les femmes et à tous les hommes, y compris les mineurs", "Aux mineures, seulement avec l'autorisation de leurs parents"], "answer": 2, "explication": "La contraception est accessible à tous, y compris aux mineurs, sans autorisation des parents ; elle est confidentielle et prise en charge (gratuite pour les jeunes).", "source": "https://www.prepacivique.fr/question/contraception-accessible-tous-carte-de-resident"}, {"q": "Qu’est-ce que le principe de confidentialité dans le domaine de la santé ?", "options": ["Le médecin doit informer l'employeur de l'état de santé du patient", "Le patient ne peut pas consulter son propre dossier médical", "Les informations médicales peuvent être communiquées librement à la famille", "Le médecin doit garder secrètes les informations médicales du patient"], "answer": 3, "explication": "Le secret médical oblige le professionnel de santé à garder confidentiel tout ce qu'il apprend sur le patient, même après son décès ; le violer est puni par la loi, sauf rares exceptions légales.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/vivre-dans-la-societe-fran%C3%A7aise/sante/sante-les-droits-du-patient/"}, {"q": "L'inscription à l'Assurance maladie est :", "options": ["Réservée aux personnes de nationalité française", "Obligatoire pour toute personne qui travaille ou réside en France de manière stable et régulière", "Facultative et réservée aux salariés", "Payante chaque mois auprès de la mairie"], "answer": 1, "explication": "Toute personne qui travaille ou réside en France de façon stable et régulière doit être affiliée à l'Assurance maladie (protection universelle maladie) ; l'inscription se fait auprès de la CPAM.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/vivre-dans-la-societe-fran%C3%A7aise/sante/la-prise-en-charge-les-differentes-couvertures-maladie/"}, {"q": "Qui peut demander un congé parental d'éducation ?", "options": ["Uniquement la mère", "Uniquement les parents mariés", "Uniquement les fonctionnaires", "Le père ou la mère salarié(e) ayant au moins 1 an d'ancienneté dans l'entreprise"], "answer": 3, "explication": "Le congé parental d'éducation est ouvert à tout salarié, père ou mère, qui a au moins un an d'ancienneté dans l'entreprise à la naissance ou à l'arrivée de l'enfant adopté ; les deux parents peuvent le prendre.", "source": "https://www.service-public.gouv.fr/particuliers/vosdroits/F2280"}, {"q": "Quelles sont les affaires traitées par le conseil de prud'hommes ?", "options": ["Les litiges entre un salarié et son employeur liés au contrat de travail", "Les conflits entre voisins", "Les divorces", "Les infractions au code de la route"], "answer": 0, "explication": "Le conseil de prud'hommes tranche les désaccords entre salarié et employeur sur le contrat de travail (licenciement, salaire…) ; il peut ordonner une indemnisation ou la réintégration du salarié.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/vivre-dans-la-societe-fran%C3%A7aise/emploi/le-droit-au-travail-2/"}, {"q": "Travailler sans être déclaré est :", "options": ["Autorisé si le salarié est d'accord", "Autorisé pendant la période d'essai", "Interdit par la loi", "Autorisé pour les emplois de moins de 10 heures par semaine"], "answer": 2, "explication": "Le travail non déclaré (travail dissimulé) est interdit : l'employeur risque jusqu'à 3 ans de prison et 45 000 € d'amende, et le salarié perd ses droits (chômage, retraite, Sécurité sociale, congés payés).", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/vivre-dans-la-societe-fran%C3%A7aise/emploi/le-droit-au-travail-5/"}, {"q": "Lorsqu'un employeur veut qu'un salarié travaille plus longtemps que la durée prévue dans le contrat de travail :", "options": ["Il doit payer ces heures supplémentaires ou les compenser par du repos", "Il n'a rien à payer en plus", "Il peut retenir une partie du salaire si le salarié refuse", "Il doit demander l'autorisation du maire"], "answer": 0, "explication": "Les heures travaillées au-delà de la durée légale (35 heures par semaine) sont des heures supplémentaires : l'employeur doit les payer (avec majoration) ou permettre au salarié de les récupérer.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/vivre-dans-la-societe-fran%C3%A7aise/emploi/le-droit-au-travail-1/"}, {"q": "Quelle est la mission de France Travail ?", "options": ["Délivrer les titres de séjour", "Accompagner les demandeurs d'emploi et leur verser leurs allocations", "Contrôler le respect du code du travail dans les entreprises", "Juger les conflits entre salariés et employeurs"], "answer": 1, "explication": "France Travail est l'organisme public qui accompagne les personnes à la recherche d'un emploi ou d'une formation, aide les entreprises à recruter et verse les allocations chômage.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/vivre-dans-la-societe-fran%C3%A7aise/emploi/orientation-1/"}, {"q": "Dans une entreprise, le droit syndical permet :", "options": ["À l'employeur d'obliger les salariés à adhérer à un syndicat", "À l'employeur de sancti  de moins de 2 ans", "Une école privée payante et facultative", "L'école des enfants de 6 à 11 ans", "La première étape de l'école, pour les enfants de 3 à 6 ans"], "answer": 3, "explication": "L'école maternelle accueille les enfants de 3 à 6 ans (petite, moyenne et grande sections) ; comme l'instruction est obligatoire dès 3 ans, elle fait partie du parcours obligatoire.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/vivre-dans-la-societe-fran%C3%A7aise/parentalite/le-systeme-educatif/"}, {"q": "Comment s'appelle le diplôme passé par les élèves à la fin du collège ?", "options": ["Le diplôme national du brevet (DNB)", "Le baccalauréat", "Le certificat d'aptitude professionnelle (CAP)", "La licence"], "answer": 0, "explication": "À la fin de la classe de 3e, les collégiens passent le diplôme national du brevet (brevet des collèges) ; le baccalauréat se passe à la fin du lycée.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/vivre-dans-la-societe-fran%C3%A7aise/parentalite/le-systeme-educatif/"}, {"q": "Les parents d'élève ont le droit de :", "options": ["Assister aux cours dans la classe quand ils le veulent", "Choisir les programmes enseignés", "Se présenter aux élections des représentants des parents d'élèves", "Noter eux-mêmes les élèves"], "answer": 2, "explication": "Les parents peuvent adhérer à une association de parents d'élèves et se faire élire représentants : ils participent alors aux décisions importantes sur l'organisation de l'école.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/vivre-dans-la-societe-fran%C3%A7aise/parentalite/droits-et-devoirs-des-parents-a-l-ecole/"}, {"q": "Qui peut manger à la cantine scolaire ?", "options": ["Tous les enfants qui le souhaitent", "Uniquement les enfants dont les deux parents travaillent", "Uniquement les enfants de nationalité française", "Uniquement les élèves du lycée"], "answer": 0, "explication": "La cantine est ouverte, dans toutes les écoles, à tous les enfants qui le souhaitent.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/vivre-dans-la-societe-fran%C3%A7aise/parentalite/le-systeme-educatif/"}, {"q": "À quel âge commence l'instruction obligatoire des enfants ?", "options": ["6 ans", "3 ans", "2 ans", "5 ans"], "answer": 1, "explication": "En France, l'instruction est obligatoire pour tous les enfants, français ou étrangers, de 3 à 16 ans.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/vivre-dans-la-societe-fran%C3%A7aise/parentalite/le-systeme-educatif/"}, {"q": "Quel est l'âge de la majorité ?", "options": ["16 ans", "21 ans", "18 ans", "20 ans"], "answer": 2, "explication": "À 18 ans, l'enfant devient majeur et l'autorité parentale prend fin.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/vivre-dans-la-societe-fran%C3%A7aise/parentalite/exercice-de-l-autorite-parentale-2/"}, {"q": "À l'école, il est interdit aux parents de :", "options": ["Demander un rendez-vous à l'enseignant", "Accompagner leur enfant jusqu'à l'entrée de l'école", "Adhérer à une association de parents d'élèves", "Menacer, insulter ou être violent envers les enseignants et le personnel"], "answer": 3, "explication": "Les relations entre parents et école reposent sur le respect mutuel : menacer, insulter ou agresser un enseignant ou un membre du personnel est un délit puni par la loi.", "source": "https://www.prepacivique.fr/question/respect-personnel-ecole-carte-de-resident"}, {"q": "Quel motif d'absence est accepté par l'école ?", "options": ["Un départ en vacances avant la date officielle", "La maladie de l'enfant", "Une fête d'anniversaire d'un camarade", "Un rendez-vous administratif d'un parent sans lien avec l'enfant"], "answer": 1, "explication": "Le code de l'éducation reconnaît comme motifs légitimes d'absence notamment la maladie de l'enfant, la maladie contagieuse d'un proche, une réunion solennelle de famille ou une difficulté de transport accidentelle.", "source": "https://www.letudiant.fr/college/quels-justificatifs-faut-il-fournir-en-cas-d-absence.html"}, {"q": "Des parents ne respectent pas l'obligation d'instruction pour leurs enfants. Quelle sanction maximale risquent-ils ?", "options": ["Aucune sanction, l'instruction n'est qu'une recommandation", "Une simple amende de 35 €", "10 ans de prison et 150 000 € d'amende", "6 mois de prison et 7 500 € d'amende"], "answer": 3, "explication": "Les parents qui n'inscrivent pas leur enfant dans un établissement scolaire malgré une mise en demeure, sans excuse valable, risquent jusqu'à 6 mois d'emprisonnement et 7 500 € d'amende (article 227-17-1 du code pénal).", "source": "https://www.education.gouv.fr/sites/default/files/2025-04/faits-constitutifs-d-infractions-et-sanctions-encourues---instruction-dans-la-famille-439533.pdf"}, {"q": "Quand ont lieu les vacances scolaires de Noël ?", "options": ["Fin décembre et début janvier, pendant deux semaines, aux mêmes dates dans toute la France", "Pendant tout le mois de décembre", "En février, selon la zone", "De mi-novembre à début décembre"], "answer": 0, "explication": "Les vacances de Noël durent environ deux semaines autour des fêtes de fin d'année et sont communes aux zones A, B et C (en 2026-2027 : du samedi 19 décembre 2026 au lundi 4 janvier 2027).", "source": "https://www.education.gouv.fr/calendrier-scolaire-100148"}, {"q": "À l'école, un enfant en situation de handicap :", "options": ["Ne peut pas aller à l'école publique", "Doit obligatoirement être instruit à la maison", "A le droit d'être scolarisé, avec si besoin des aménagements et un accompagnant (AESH)", "Doit payer des frais de scolarité supplémentaires"], "answer": 2, "explication": "La scolarisation d'un enfant handicapé est un droit garanti : après saisine de la MDPH, un projet personnalisé de scolarisation (PPS) peut prévoir des aménagements, du matériel adapté et un AESH.", "source": "https://mallettedesparents.education.gouv.fr/print/pdf/node/152"}]}];
const QS = [];
DATA.forEach((t, ti) => t.questions.forEach((q, qi) => QS.push({ ...q, id: ti + "-" + qi, ti, theme: t.theme })));

const KEY = "civique-cr-v1";
let store = {};
try { store = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { store = {}; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
function rec(id, ok) { store[id] = ok ? 1 : 0; save(); }

const app = document.getElementById("app");
const L = ["A", "B", "C", "D"];
let session = null, timer = null;

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function prep(q) { const order = shuffle([0, 1, 2, 3]); return { q, order, chosen: null }; }

function home() {
  clearInterval(timer); session = null;
  const seen = QS.filter(q => q.id in store).length;
  const good = QS.filter(q => store[q.id] === 1).length;
  const bad = QS.filter(q => store[q.id] === 0).length;
  const rows = DATA.map((t, ti) => {
    const qs = QS.filter(q => q.ti === ti), n = qs.length;
    const g = qs.filter(q => store[q.id] === 1).length, r = qs.filter(q => store[q.id] === 0).length;
    return `<button class="theme" data-theme-i="${ti}"><span class="name">${esc(t.theme)}</span><span class="count">${g}/${n}</span>
      <span class="bar"><i class="g" style="width:${g / n * 100}%"></i><i class="r" style="width:${r / n * 100}%"></i></span></button>`;
  }).join("");
  app.innerHTML = `
    <header style="display:flex;flex-direction:column;gap:10px">
      <div class="tricolore"><span></span><span></span><span></span></div>
      <p class="eyebrow">Examen civique · carte de résident</p>
      <h1>Les ${QS.length} questions de la liste officielle</h1>
      <p class="lede">Une seule bonne réponse sur quatre, comme le jour de l'épreuve. L'ordre des réponses change à chaque passage.</p>
    </header>
    <div class="stats">
      <div class="stat"><b>${seen}</b><span>vues sur ${QS.length}</span></div>
      <div class="stat"><b style="color:var(--ok)">${good}</b><span>réussies</span></div>
      <div class="stat"><b style="color:var(--ko)">${bad}</b><span>à revoir</span></div>
    </div>
    <div class="row">
      <button class="btn" id="exam">Examen blanc · 40 questions</button>
      <button class="btn ghost" id="errs" ${bad ? "" : "disabled"}>Revoir mes erreurs (${bad})</button>
    </div>
    <section style="display:flex;flex-direction:column;gap:10px">
      <h2>S'entraîner par thème</h2>
      <div class="themes">${rows}</div>
      <div class="legend"><span style="--c:var(--ok)">Dernière réponse juste</span><span style="--c:var(--ko)">Dernière réponse fausse</span></div>
    </section>
    <p class="note">L'examen réel comporte aussi 12 mises en situation qui ne sont pas publiques ; l'examen blanc ici tire 40 questions de connaissance au hasard. Seuil de réussite : 32/40 (80 %), en 45 minutes.</p>
    <div class="row">
      <button class="link" id="reset">Effacer ma progression</button>
    </div>
    <div id="confirmBox"></div>`;
  app.querySelectorAll("[data-theme-i]").forEach(b => b.onclick = () => start("theme", shuffle(QS.filter(q => q.ti === +b.dataset.themeI)), DATA[+b.dataset.themeI].theme));
  app.querySelector("#exam").onclick = () => start("exam", shuffle(QS).slice(0, 40), "Examen blanc");
  app.querySelector("#errs").onclick = () => start("theme", shuffle(QS.filter(q => store[q.id] === 0)), "Mes erreurs");
  app.querySelector("#reset").onclick = () => {
    app.querySelector("#confirmBox").innerHTML = `<div class="confirm"><p>Effacer toutes les réponses enregistrées sur cet appareil ?</p>
      <div class="row"><button class="btn" id="yes">Effacer</button><button class="btn ghost" id="no">Annuler</button></div></div>`;
    app.querySelector("#yes").onclick = () => { store = {}; save(); home(); };
    app.querySelector("#no").onclick = () => app.querySelector("#confirmBox").innerHTML = "";
  };
  window.scrollTo(0, 0);
}

function start(mode, list, label) {
  session = { mode, label, items: list.map(prep), i: 0, end: mode === "exam" ? Date.now() + 45 * 60000 : null };
  if (mode === "exam") { clearInterval(timer); timer = setInterval(tick, 1000); }
  show();
}

function tick() {
  const el = document.getElementById("clock"); if (!session || !el) return;
  const s = Math.max(0, Math.round((session.end - Date.now()) / 1000));
  el.textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  el.classList.toggle("warn", s < 300);
  if (s === 0) finish();
}

function show() {
  const S = session, it = S.items[S.i], q = it.q, n = S.items.length, exam = S.mode === "exam";
  const answered = it.chosen !== null;
  const opts = it.order.map((oi, k) => {
    let cls = "opt";
    if (answered && !exam) { if (oi === q.answer) cls += " good"; else if (oi === it.chosen) cls += " bad"; }
    else if (answered && exam && oi === it.chosen) cls += " chosen";
    return `<button class="${cls}" data-o="${oi}" ${answered && !exam ? "disabled" : ""}><span class="k">${L[k]}</span><span>${esc(q.options[oi])}</span></button>`;
  }).join("");
  let fb = "";
  if (answered && !exam) {
    const ok = it.chosen === q.answer;
    fb = `<div class="feedback" style="--c:var(${ok ? "--ok" : "--ko"})"><span class="verdict">${ok ? "Bonne réponse" : "Réponse : " + esc(q.options[q.answer])}</span>
      <p>${esc(q.explication)}</p>${q.source ? `<a href="${esc(q.source)}" target="_blank" rel="noopener">Source</a>` : ""}</div>`;
  }
  const last = S.i === n - 1;
  app.innerHTML = `
    <div class="top"><button class="link" id="quit">← Accueil</button>
      ${exam ? `<span class="meta" id="clock">45:00</span>` : ""}<span class="meta">${S.i + 1} / ${n}</span></div>
    <div class="progress"><i style="width:${(S.i + (answered ? 1 : 0)) / n * 100}%"></i></div>
    <article class="card">
      <p class="eyebrow">${esc(S.label === q.theme ? q.theme : q.theme)}</p>
      <h2>${esc(q.q)}</h2>
      <div class="opts">${opts}</div>
      ${fb}
    </article>
    <div class="row">
      ${S.i > 0 && exam ? `<button class="btn ghost" id="prev">Précédente</button>` : ""}
      <button class="btn" id="next" ${answered ? "" : "disabled"}>${last ? (exam ? "Terminer l'examen" : "Voir le bilan") : "Question suivante"}</button>
    </div>
    <div id="confirmBox"></div>`;
  if (exam) tick();
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    if (it.chosen !== null && !exam) return;
    it.chosen = +b.dataset.o;
    if (!exam) rec(q.id, it.chosen === q.answer);
    show();
  });
  app.querySelector("#next").onclick = () => { if (last) finish(); else { S.i++; show(); window.scrollTo(0, 0); } };
  const prev = app.querySelector("#prev"); if (prev) prev.onclick = () => { S.i--; show(); };
  app.querySelector("#quit").onclick = () => {
    app.querySelector("#confirmBox").innerHTML = `<div class="confirm"><p>Quitter cette série ? Les réponses déjà données ${exam ? "à l'examen blanc ne seront pas comptées" : "restent enregistrées"}.</p>
      <div class="row"><button class="btn" id="yes">Quitter</button><button class="btn ghost" id="no">Continuer</button></div></div>`;
    app.querySelector("#yes").onclick = home;
    app.querySelector("#no").onclick = () => app.querySelector("#confirmBox").innerHTML = "";
  };
}

function finish() {
  clearInterval(timer);
  const S = session, exam = S.mode === "exam";
  if (exam) S.items.forEach(it => { if (it.chosen !== null) rec(it.q.id, it.chosen === it.q.answer); });
  const done = S.items.filter(it => it.chosen !== null);
  const good = done.filter(it => it.chosen === it.q.answer).length, n = S.items.length;
  const pass = exam ? good >= 32 : good / Math.max(1, n) >= 0.8;
  const wrong = S.items.filter(it => it.chosen !== it.q.answer);
  const review = wrong.map(it => `<div class="ritem" style="--c:var(--ko)"><span class="q">${esc(it.q.q)}</span>
      <span class="a">${it.chosen === null ? "Sans réponse" : "Ta réponse : " + esc(it.q.options[it.chosen])}</span>
      <span class="a"><b>Bonne réponse : ${esc(it.q.options[it.q.answer])}</b></span>
      <span class="note">${esc(it.q.explication)}</span></div>`).join("");
  app.innerHTML = `
    <p class="eyebrow">${esc(S.label)}</p>
    <div style="display:flex;align-items:end;gap:14px;flex-wrap:wrap"><span class="score">${good}<small> / ${n}</small></span>
      <span class="pill" style="--c:var(${pass ? "--ok" : "--ko"});--c-soft:var(${pass ? "--ok-soft" : "--ko-soft"})">${exam ? (pass ? "Réussi (32 minimum)" : "Non réussi (32 minimum)") : (pass ? "Au-dessus de 80 %" : "Sous les 80 %")}</span></div>
    <div class="row"><button class="btn" id="home">Accueil</button>${wrong.length ? `<button class="btn ghost" id="again">Refaire les ${wrong.length} erreurs</button>` : ""}</div>
    ${wrong.length ? `<h2>À revoir</h2><div class="review">${review}</div>` : `<p class="lede">Aucune erreur sur cette série.</p>`}`;
  app.querySelector("#home").onclick = home;
  const ag = app.querySelector("#again"); if (ag) ag.onclick = () => start("theme", shuffle(wrong.map(it => it.q)), "Mes erreurs");
  window.scrollTo(0, 0);
}

home();
</script>

</body>
</html>
