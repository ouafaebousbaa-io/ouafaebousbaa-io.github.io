le"], "answer": 0, "explication": "Article 1er : « La France est une République indivisible, laïque, démocratique et sociale ».", "page": 10}, {"q": "Qu'est-ce qu'une Constitution ?", "options": ["L'acte fondateur d'un État : un ensemble de règles fondamentales qui définissent comment le pays est organisé et dirigé", "Un règlement intérieur des mairies", "Une loi qui fixe les impôts chaque année", "Un traité signé entre plusieurs pays"], "answer": 0, "explication": "La Constitution fixe les règles fondamentales d'organisation et de direction du pays.", "page": 10}, {"q": "Dans un État de droit, où se situe la Constitution dans la hiérarchie des normes ?", "options": ["Tout en haut, au-dessus de toutes les lois", "Au même niveau que les lois", "En dessous des lois", "En dessous des décisions des maires"], "answer": 0, "explication": "La Constitution est au sommet de la hiérarchie des normes, au-dessus de toutes les lois.", "page": 10}, {"q": "Que fait la Constitution en France, selon le livret ?", "options": ["Elle fixe les droits et libertés des citoyens et explique comment les pouvoirs sont partagés", "Elle fixe le montant des salaires", "Elle désigne la religion officielle", "Elle fixe la liste des candidats aux élections"], "answer": 0, "explication": "Elle fixe les droits et libertés et organise le partage des pouvoirs : gouvernement, Parlement, tribunaux.", "page": 10}, {"q": "Entre quels pouvoirs la Constitution organise-t-elle le partage, selon le livret ?", "options": ["Le gouvernement, le Parlement et les tribunaux", "Les Églises, les syndicats et les partis", "Les régions, l'Union européenne et l'ONU", "Les maires, les préfets et les entreprises"], "answer": 0, "explication": "La Constitution explique comment le gouvernement, le Parlement et les tribunaux se partagent le pouvoir.", "page": 10}]}, {"titre": "Une République indivisible", "questions": [{"q": "Que signifie le caractère indivisible de la République ?", "options": ["Tous les Français, en métropole et en outre-mer, sont soumis aux mêmes lois et ont les mêmes droits et devoirs", "Chaque région peut voter ses propres lois", "Les territoires d'outre-mer ont des droits différents", "Chaque communauté religieuse a ses propres règles"], "answer": 0, "explication": "L'indivisibilité, c'est l'unité de la République : mêmes lois, mêmes droits et devoirs partout.", "page": 10}, {"q": "Comment appelle-t-on le fait que tous les Français, partout dans le pays, aient les mêmes lois, droits et devoirs ?", "options": ["L'unité de la République", "La laïcité", "La décentralisation", "La fraternité"], "answer": 0, "explication": "C'est ce qu'on appelle l'unité de la République.", "page": 10}, {"q": "Dans une République indivisible, qui prend les décisions pour l'ensemble des Français ?", "options": ["Les représentants élus par le peuple ou le peuple lui-même lors de référendums", "Un groupe religieux", "Les représentants d'une région", "Une seule personne non élue"], "answer": 0, "explication": "Aucun individu ou groupe ne peut décider à la place de l'ensemble des Français.", "page": 10}]}, {"titre": "Une République laïque", "questions": [{"q": "Quel jour la laïcité est-elle officiellement célébrée en France ?", "options": ["Le 9 décembre", "Le 14 juillet", "Le 4 octobre", "Le 11 novembre"], "answer": 0, "explication": "La laïcité, principe de valeur constitutionnelle, est célébrée le 9 décembre.", "page": 10}, {"q": "Que garantit la liberté de conscience ?", "options": ["Chacun est libre d'avoir ou de ne pas avoir de religion, d'en changer ou de ne plus en avoir", "Chacun doit avoir une religion", "Il est interdit de changer de religion", "L'État choisit la religion des citoyens"], "answer": 0, "explication": "La laïcité garantit la liberté de conscience, y compris le droit de se convertir.", "page": 10}, {"q": "Quel article de la DDHC est cité pour la liberté de manifester ses croyances dans le respect de l'ordre public ?", "options": ["L'article 10", "L'article 1er", "L'article 4", "L'article 3"], "answer": 0, "explication": "L'article 10 de la DDHC protège la liberté de manifester ses convictions, dans les limites de l'ordre public.", "page": 10}, {"q": "Comment appelle-t-on une personne qui ne croit en aucune religion ?", "options": ["Athée", "Agnostique", "Laïque", "Prosélyte"], "answer": 0, "explication": "Une personne athée ne croit en aucune religion.", "page": 10}, {"q": "Comment appelle-t-on une personne sceptique vis-à-vis de la religion ?", "options": ["Agnostique", "Athée", "Croyante", "Blasphématrice"], "answer": 0, "explication": "Une personne agnostique est sceptique vis-à-vis de la religion.", "page": 10}, {"q": "Vrai : laquelle de ces affirmations sur la laïcité est exacte ?", "options": ["Elle garantit le libre exercice des cultes et impose la neutralité de l'État", "Elle interdit toute pratique religieuse", "Elle fait du catholicisme la religion de l'État", "Elle interdit de changer de religion"], "answer": 0, "explication": "La laïcité garantit le libre exercice des cultes, le respect de toutes les croyances et la neutralité de l'État.", "page": 10}, {"q": "Quelle loi a séparé les Églises et l'État ?", "options": ["La loi de 1905", "La loi de 2004", "La loi de 2010", "La loi de 1880"], "answer": 0, "explication": "La loi de 1905 sépare les Églises et l'État.", "page": 11}, {"q": "Selon le principe de neutralité, l'État a-t-il le droit de financer la construction d'un édifice religieux ?", "options": ["Non, il ne peut ni financer la construction d'un édifice religieux ni payer un personnel religieux", "Oui, pour toutes les religions", "Oui, mais seulement pour la religion majoritaire", "Oui, si le maire le décide"], "answer": 0, "explication": "L'État ne soutient aucune organisation religieuse : pas de financement d'édifices ni de personnel religieux (sauf exceptions).", "page": 11}, {"q": "Dans quels territoires l'État a-t-il, pour des raisons historiques, des accords spéciaux avec certaines religions ?", "options": ["En Alsace et en Moselle", "En Bretagne et en Normandie", "En Corse et en Provence", "À Paris et à Lyon"], "answer": 0, "explication": "L'Alsace et la Moselle sont une exception liée à l'Histoire.", "page": 11}, {"q": "Que peut financer l'État malgré la séparation des Églises et de l'État ?", "options": ["La restauration d'un monument religieux classé au patrimoine", "Le salaire des responsables religieux partout en France", "La construction de nouveaux lieux de culte", "L'organisation des fêtes religieuses"], "answer": 0, "explication": "L'État peut financer la restauration d'un monument religieux classé au patrimoine.", "page": 11}, {"q": "Qu'est-ce que la neutralité de l'État ?", "options": ["La garantie que tous sont traités de la même manière par l'administration et les services publics, quelles que soient leur religion ou leurs convictions", "L'interdiction pour les citoyens d'avoir une religion", "Le fait que l'État ne prend jamais position en politique étrangère", "Le fait que l'État finance toutes les religions de façon égale"], "answer": 0, "explication": "L'État, les collectivités territoriales et les services publics sont neutres envers les religions.", "page": 11}, {"q": "Qu'est-ce que le prosélytisme religieux ?", "options": ["Vouloir convaincre quelqu'un d'adopter sa religion ou ses idées religieuses", "Insulter une divinité", "Changer de religion", "Refuser toute religion"], "answer": 0, "explication": "Le prosélytisme consiste à chercher à convaincre autrui d'adopter sa religion.", "page": 11}, {"q": "Le prosélytisme est-il autorisé en France ?", "options": ["Oui, à condition de ne pas forcer quelqu'un par la violence, la menace ou la pression", "Non, il est totalement interdit", "Oui, partout, y compris dans les services publics", "Seulement à l'intérieur des lieux de culte"], "answer": 0, "explication": "Il est autorisé sans contrainte, mais interdit dans les services publics.", "page": 11}, {"q": "Où le prosélytisme est-il interdit ?", "options": ["Dans les services publics", "Dans la rue", "Dans les lieux de culte", "À la maison"], "answer": 0, "explication": "Le prosélytisme est interdit dans les services publics, en application de la neutralité de l'État.", "page": 11}, {"q": "Peut-on distribuer des tracts sur une religion dans la rue ?", "options": ["Oui, tant que cela ne trouble pas l'ordre public", "Non, c'est toujours interdit", "Oui, mais seulement le 9 décembre", "Seulement avec l'accord d'un responsable religieux"], "answer": 0, "explication": "La distribution de tracts religieux dans la rue est possible si l'ordre public n'est pas troublé.", "page": 11}, {"q": "Qu'est-ce que le blasphème ?", "options": ["Une parole ou un discours qui insulte la divinité, la religion ou ce qui est considéré comme sacré", "Le fait de changer de religion", "Le fait de convaincre quelqu'un d'adopter sa religion", "Le fait de dire des choses fausses sur quelqu'un pour lui nuire"], "answer": 0, "explication": "Le blasphème insulte la divinité, la religion ou ce qui est jugé sacré.", "page": 11}, {"q": "Vrai : laquelle de ces affirmations sur le blasphème en France est exacte ?", "options": ["Ce n'est pas un délit : chacun peut critiquer ou se moquer d'une religion, y compris par la caricature", "C'est un délit puni de prison", "Il est autorisé seulement pour les athées", "Il est interdit dans la presse"], "answer": 0, "explication": "Le blasphème n'est pas un délit en France ; c'est une expression de la liberté d'expression.", "page": 11}, {"q": "Lequel de ces éléments n'est PAS une limite à la liberté d'expression selon le livret ?", "options": ["Le blasphème", "La diffamation", "L'incitation à la haine raciale, ethnique ou religieuse", "Le négationnisme"], "answer": 0, "explication": "Les limites de la liberté d'expression ne concernent pas le blasphème.", "page": 12}, {"q": "Qu'est-ce que la diffamation ?", "options": ["Dire des choses fausses sur quelqu'un pour lui nuire", "Critiquer une religion", "Insulter une divinité", "Refuser une règle de l'école"], "answer": 0, "explication": "La diffamation, comme l'injure publique, est une limite à la liberté d'expression.", "page": 12}, {"q": "Qu'est-ce que le négationnisme, cité comme limite à la liberté d'expression ?", "options": ["Nier l'existence de la Shoah", "Critiquer une religion", "Refuser de voter", "Contester une décision de justice"], "answer": 0, "explication": "La remise en cause des crimes contre l'humanité, dont le négationnisme, est interdite.", "page": 12}, {"q": "Laquelle de ces expressions est interdite car elle dépasse les limites de la liberté d'expression ?", "options": ["Utiliser la religion pour justifier des crimes de guerre ou du terrorisme", "Faire une caricature d'une religion", "Critiquer une religion", "Dire que l'on ne croit en aucune religion"], "answer": 0, "explication": "Parmi les limites : justifier par la religion des crimes de guerre ou le terrorisme, inciter à discriminer, inciter à la haine…", "page": 12}, {"q": "Peut-on porter des signes religieux (voile, kippa, croix, turban…) dans l'espace public (rue, parc, marché, transports) ?", "options": ["Oui, toute personne a le droit de montrer sa religion dans l'espace public", "Non, c'est interdit dans tout l'espace public", "Seulement dans les transports", "Seulement avec une autorisation de la mairie"], "answer": 0, "explication": "Dans l'espace public, chacun peut montrer sa religion, dans le respect de l'ordre public.", "page": 12}, {"q": "Quelle loi interdit la dissimulation du visage dans l'espace public ?", "options": ["La loi du 11 octobre 2010", "La loi du 15 mars 2004", "La loi de 1905", "La loi du 9 décembre 1880"], "answer": 0, "explication": "La loi du 11 octobre 2010 interdit de cacher son visage dans l'espace public (cagoule, masque, voile intégral…), pour protéger l'ordre public.", "page": 12}, {"q": "Quel est l'objectif de la loi qui interdit la dissimulation du visage dans l'espace public ?", "options": ["Protéger l'ordre public", "Interdire les religions", "Protéger le commerce", "Favoriser une religion"], "answer": 0, "explication": "La loi de 2010 vise à protéger l'ordre public.", "page": 12}, {"q": "Une manifestation religieuse sur la voie publique (par exemple des prières de rue) peut-elle être interdite ?", "options": ["Oui, elle peut être soumise à autorisation, encadrée ou interdite pour éviter des troubles à l'ordre public", "Non, jamais", "Oui, toujours, car toute religion est interdite dans la rue", "Seulement si elle a lieu un dimanche"], "answer": 0, "explication": "Le respect de l'ordre public est indispensable : une manifestation religieuse peut être encadrée ou interdite.", "page": 12}, {"q": "Les personnes qui travaillent dans les services publics (hôpitaux, écoles, mairies) peuvent-elles montrer leurs croyances pendant leur travail ?", "options": ["Non, elles doivent rester neutres", "Oui, librement", "Oui, si les usagers sont d'accord", "Oui, mais seulement le vendredi"], "answer": 0, "explication": "Les agents des services publics doivent rester neutres : c'est une condition du traitement équitable des usagers.", "page": 12}, {"q": "Peut-on exposer un emblème religieux, politique ou philosophique dans les bureaux et aux guichets d'un service public ?", "options": ["Non, aucun signe de ce type ne doit y être exposé", "Oui, si l'agent le souhaite", "Oui, pendant les fêtes religieuses", "Oui, seulement les emblèmes politiques"], "answer": 0, "explication": "La neutralité s'applique aussi aux bâtiments des services publics.", "page": 12}, {"q": "Un usager d'un service public peut-il porter un signe religieux ?", "options": ["Oui, à condition de respecter les règles de fonctionnement du service", "Non, la neutralité s'impose aussi aux usagers", "Seulement s'il est fonctionnaire", "Seulement dans les hôpitaux"], "answer": 0, "explication": "La neutralité ne s'impose pas aux usagers, qui peuvent porter un signe religieux.", "page": 12}, {"q": "Vrai : laquelle de ces affirmations sur les services publics est exacte ?", "options": ["On ne peut pas exiger une adaptation du service public au nom d'une religion", "On peut exiger d'être servi par un agent de même religion", "On peut exiger des horaires adaptés à sa religion", "Les agents peuvent faire du prosélytisme"], "answer": 0, "explication": "Il n'est pas possible d'exiger que le service public s'adapte au nom d'une religion.", "page": 12}, {"q": "Un agent public peut-il porter un signe religieux ou pratiquer sa religion au travail ?", "options": ["Non, pour garantir la neutralité de l'État", "Oui, comme tous les salariés", "Oui, s'il est discret", "Oui, avec l'accord de ses collègues"], "answer": 0, "explication": "Les agents publics ne peuvent ni porter de signes religieux ni pratiquer leur religion au travail.", "page": 13}, {"q": "Les salariés des entreprises privées peuvent-ils exprimer leurs opinions religieuses au travail ?", "options": ["Oui, sauf si cela perturbe le bon fonctionnement de l'entreprise ou pour des raisons de sécurité", "Non, jamais", "Oui, sans aucune limite", "Seulement s'ils sont cadres"], "answer": 0, "explication": "Dans le privé, l'expression religieuse est permise, avec des limites liées au fonctionnement et à la sécurité.", "page": 13}, {"q": "Dans quel document l'employeur privé peut-il fixer des limites à la manifestation de l'appartenance religieuse ?", "options": ["Le règlement intérieur", "La Constitution", "Le contrat de bail", "La Charte de la laïcité à l'École"], "answer": 0, "explication": "L'employeur peut fixer ces limites dans le règlement intérieur, si elles sont justifiées par la nature des tâches.", "page": 13}, {"q": "Un salarié ou un agent public peut-il demander une autorisation d'absence pour une fête religieuse ?", "options": ["Oui, et l'employeur peut refuser si ce refus n'est pas discriminatoire", "Non, c'est interdit", "Oui, et l'employeur est obligé d'accepter", "Seulement dans les entreprises privées"], "answer": 0, "explication": "La demande est possible ; un refus peut être motivé par le règlement intérieur ou les nécessités du service.", "page": 13}, {"q": "Vrai : laquelle de ces affirmations est exacte ?", "options": ["La laïcité ne s'applique pas de la même manière aux agents publics et aux salariés du privé", "La laïcité s'applique exactement de la même manière à tous les travailleurs", "La laïcité ne concerne que les salariés du privé", "Les agents publics ont plus de liberté religieuse au travail que les salariés du privé"], "answer": 0, "explication": "Les agents publics sont tenus à la neutralité ; les salariés du privé peuvent exprimer leur religion, avec des limites.", "page": 13}, {"q": "Quel est le but de l'application de la laïcité à l'école ?", "options": ["Garantir la liberté de conscience des élèves, à l'abri des pressions et des influences", "Enseigner une religion officielle", "Interdire aux élèves d'avoir une religion", "Choisir la religion des élèves"], "answer": 0, "explication": "La laïcité à l'école permet aux élèves de penser librement et de construire leurs opinions.", "page": 13}, {"q": "Quel document liste les règles de la laïcité dans les écoles ?", "options": ["La Charte de la laïcité à l'École", "Le Code du travail", "La Déclaration des droits de l'homme et du citoyen", "Le règlement de la Sécurité sociale"], "answer": 0, "explication": "Les règles sont listées dans la Charte de la laïcité à l'École.", "page": 13}, {"q": "À qui s'adresse la Charte de la laïcité à l'École ?", "options": ["À tous les personnels de l'établissement, aux élèves et aux parents d'élèves", "Uniquement aux professeurs", "Uniquement aux élèves", "Uniquement aux directeurs d'école"], "answer": 0, "explication": "Elle concerne les personnels (professeurs, animateurs périscolaires…), les élèves et les parents.", "page": 13}, {"q": "Quelle loi interdit aux élèves de porter des signes religieux ostensibles dans les écoles publiques ?", "options": ["La loi du 15 mars 2004", "La loi du 11 octobre 2010", "La loi de 1905", "La loi de 1880"], "answer": 0, "explication": "La loi du 15 mars 2004 interdit les signes ou tenues montrant ostensiblement sa religion à l'école.", "page": 13}, {"q": "Que signifie un signe religieux « ostensible » ?", "options": ["Un signe que l'on peut voir immédiatement", "Un signe caché sous les vêtements", "Un signe de petite taille", "Un signe porté uniquement à la maison"], "answer": 0, "explication": "Ostensible veut dire visible immédiatement ; les signes discrets restent autorisés.", "page": 13}, {"q": "Un élève peut-il refuser un enseignement du programme scolaire pour des raisons religieuses ?", "options": ["Non, ce n'est pas possible", "Oui, avec un mot des parents", "Oui, pour certaines matières", "Oui, s'il a plus de 16 ans"], "answer": 0, "explication": "On ne peut pas refuser, pour une raison religieuse, une règle ou un enseignement du programme.", "page": 13}]}, {"titre": "Une République démocratique", "questions": [{"q": "En démocratie, à qui appartient la souveraineté nationale ?", "options": ["Au peuple", "Au Président de la République", "Au Parlement", "Au gouvernement"], "answer": 0, "explication": "La France est une démocratie : le pouvoir appartient au peuple français.", "page": 14}, {"q": "Complétez l'article 3 de la Constitution : « La souveraineté nationale appartient au peuple qui l'exerce… »", "options": ["… par ses représentants et par la voie du référendum", "… par le Président seul", "… par les partis politiques", "… par les tribunaux"], "answer": 0, "explication": "Article 3 de la Constitution de 1958.", "page": 14}, {"q": "Quel article de la Constitution de 1958 affirme que la souveraineté nationale appartient au peuple ?", "options": ["L'article 3", "L'article 1er", "L'article 4", "L'article 10"], "answer": 0, "explication": "C'est l'article 3 de la Constitution de la Ve République.", "page": 14}, {"q": "Comment le livret définit-il la République ?", "options": ["Un régime politique dans lequel les dirigeants sont élus et gouvernent au nom du peuple", "Un régime dirigé par un roi", "Un régime dirigé par des chefs religieux", "Un régime sans élections"], "answer": 0, "explication": "En République, les dirigeants sont élus et gouvernent au nom du peuple.", "page": 14}, {"q": "À partir de quel âge peut-on voter en France ?", "options": ["18 ans", "16 ans", "21 ans", "25 ans"], "answer": 0, "explication": "Les citoyens d'au moins 18 ans (majorité civile), ayant leurs droits civils et politiques, peuvent voter et se présenter aux élections.", "page": 14}, {"q": "Qu'est-ce que le suffrage universel direct ?", "options": ["Les citoyens votent directement pour élire leurs représentants", "Des élus choisissent à leur tour les représentants", "Le Président nomme les représentants", "Seuls les propriétaires votent"], "answer": 0, "explication": "Au suffrage direct, les citoyens élisent eux-mêmes leurs représentants.", "page": 14}, {"q": "Qu'est-ce que le suffrage universel indirect ?", "options": ["Des personnes élues par les citoyens élisent à leur tour les représentants", "Les citoyens votent directement pour leurs représentants", "Le vote par internet", "Le vote réservé aux hommes"], "answer": 0, "explication": "Au suffrage indirect, des élus choisissent à leur tour les représentants.", "page": 14}, {"q": "Quelles conditions faut-il remplir, selon le livret, pour voter et se présenter aux élections ?", "options": ["Être citoyen, avoir au moins 18 ans et disposer de ses droits civils et politiques", "Être propriétaire et avoir 21 ans", "Être un homme de plus de 25 ans", "Payer un impôt spécial"], "answer": 0, "explication": "Tous les citoyens, hommes et femmes, d'au moins 18 ans et jouissant de leurs droits civils et politiques peuvent voter.", "page": 14}]}, {"titre": "Une République sociale", "questions": [{"q": "De quel principe le caractère social de la République est-il une conséquence ?", "options": ["Le principe d'égalité", "Le principe de laïcité", "Le principe d'indivisibilité", "Le principe de souveraineté"], "answer": 0, "explication": "La République sociale découle du principe d'égalité.", "page": 14}, {"q": "Complétez l'article 1er de la DDHC : « Les hommes naissent et demeurent… »", "options": ["… libres et égaux en droits", "… frères et solidaires", "… citoyens et soldats", "… égaux devant Dieu"], "answer": 0, "explication": "Article 1er de la DDHC de 1789.", "page": 14}, {"q": "Dans le domaine de l'éducation, comment l'État favorise-t-il l'égalité des chances ?", "options": ["Par l'école gratuite", "Par le revenu de solidarité active", "Par la Sécurité sociale", "Par le logement social"], "answer": 0, "explication": "En éducation, l'État assure une école gratuite.", "page": 14}, {"q": "Quelle mesure l'État utilise-t-il dans le domaine du logement pour aider les plus démunis ?", "options": ["Une politique de logement social", "L'école gratuite", "La Sécurité sociale", "Le service militaire"], "answer": 0, "explication": "Dans le logement, l'État mène une politique de logement social.", "page": 14}, {"q": "Quelles mesures sont citées dans le domaine de l'emploi ?", "options": ["Le revenu de solidarité active et l'aide au retour à l'emploi", "L'école gratuite et la cantine", "La Sécurité sociale uniquement", "Le logement social uniquement"], "answer": 0, "explication": "Pour l'emploi : revenu de solidarité active (RSA) et aide au retour à l'emploi.", "page": 14}, {"q": "Quel dispositif est cité pour l'intervention de l'État dans le domaine de la santé ?", "options": ["La Sécurité sociale", "Le logement social", "L'école gratuite", "Le revenu de solidarité active"], "answer": 0, "explication": "Dans le domaine de la santé, l'État intervient par la Sécurité sociale.", "page": 14}, {"q": "Pourquoi l'État intervient-il dans l'éducation, le logement, l'emploi et la santé ?", "options": ["Pour que l'égalité des droits soit réelle et améliorer la condition des plus démunis ou fragiles", "Pour contrôler les religions", "Pour réduire le nombre d'électeurs", "Pour remplacer les associations"], "answer": 0, "explication": "L'État favorise l'égalité des chances et aide les plus démunis ou fragiles.", "page": 14}]}]}, {"partie": "Système institutionnel et politique", "sections": [{"titre": "Démocratie et État de droit", "questions": [{"q": "Que signifie que la France est un « État de droit » ?", "options": ["La loi doit être respectée par tous, y compris par l'État", "Seuls les citoyens doivent respecter la loi, pas l'État", "Le Président peut modifier seul les lois", "Les lois sont écrites par les juges"], "answer": 0, "explication": "Dans un État de droit, la loi s'impose à tous, y compris à l'État. C'est une condition de la démocratie, à l'opposé de l'État arbitraire.", "page": 16}, {"q": "Selon le livret, à quoi l'État de droit s'oppose-t-il ?", "options": ["À l'État fédéral", "À l'État arbitraire", "À l'État laïque", "À l'État décentralisé"], "answer": 1, "explication": "L'État de droit est une condition de la démocratie, en opposition à l'État arbitraire.", "page": 16}, {"q": "Dans quel article de la Constitution de 1958 le principe de la démocratie est-il inscrit ?", "options": ["Article 1", "Article 16", "Article 2", "Article 89"], "answer": 2, "explication": "L'article 2 de la Constitution inscrit le principe de la démocratie : « le Gouvernement du peuple, par le peuple et pour le peuple ».", "page": 16}, {"q": "Complétez le principe de la démocratie inscrit dans la Constitution : « le Gouvernement du peuple, … »", "options": ["« par les élus et pour la Nation »", "« par le peuple et pour le peuple »", "« par l'État et pour les citoyens »", "« par la loi et pour la République »"], "answer": 1, "explication": "Le principe de la République est « le Gouvernement du peuple, par le peuple et pour le peuple » (article 2 de la Constitution).", "page": 16}, {"q": "Qu'est-ce qu'un référendum ?", "options": ["Un vote des seuls députés", "Une décision du Conseil constitutionnel", "Un vote où les citoyens sont consultés directement", "Une élection des sénateurs par les élus locaux"], "answer": 2, "explication": "Un référendum est un vote où les citoyens sont consultés directement. En France, la Constitution est approuvée par référendum.", "page": 16}, {"q": "La Constitution actuelle de la France est celle de quelle République ?", "options": ["La IIIe République", "La IVe République", "La Ve République", "La VIe République"], "answer": 2, "explication": "La Constitution actuelle est celle de la Ve République, adoptée en 1958.", "page": 16}, {"q": "En quelle année la Constitution de la Ve République a-t-elle été adoptée ?", "options": ["1946", "1958", "1962", "1789"], "answer": 1, "explication": "La Constitution de la Ve République a été adoptée en 1958.", "page": 16}, {"q": "Comment peut-on modifier la Constitution ?", "options": ["Par un décret du Premier ministre", "Par une décision du Conseil constitutionnel", "Par référendum ou par le Parlement réuni en Congrès", "Par un vote des conseils régionaux"], "answer": 2, "explication": "Les modifications de la Constitution doivent être approuvées par référendum ou par le Parlement réuni en Congrès.", "page": 16}, {"q": "Quel texte de 1789, cité dans le préambule de la Constitution, les décisions de l'État doivent-elles respecter ?", "options": ["Le Code civil", "La Déclaration des droits de l'homme et du citoyen", "La Charte des droits fondamentaux de l'Union européenne", "Le traité de Rome"], "answer": 1, "explication": "Les décisions de l'État respectent la Constitution et la Déclaration des droits de l'homme et du citoyen de 1789, citée dans son préambule.", "page": 16}, {"q": "Lequel de ces éléments n'est PAS cité par le livret parmi les principes de l'État de droit ?", "options": ["La protection des libertés fondamentales", "La séparation des trois pouvoirs", "L'indépendance de la justice", "L'élection des juges par le peuple"], "answer": 3, "explication": "Les principes de l'État de droit sont la protection des libertés fondamentales, la séparation des trois pouvoirs et l'indépendance de la justice.", "page": 16}, {"q": "Quel pouvoir consiste à élaborer et voter les lois ?", "options": ["Le pouvoir exécutif", "Le pouvoir législatif", "Le pouvoir judiciaire", "Le pouvoir administratif"], "answer": 1, "explication": "Le pouvoir législatif élabore et vote les lois ; il est exercé par les députés et les sénateurs.", "page": 16}, {"q": "Qui exerce le pouvoir exécutif, c'est-à-dire définir la politique de la Nation et mettre en œuvre les lois ?", "options": ["Le gouvernement", "Les juges", "Les sénateurs", "Le Conseil constitutionnel"], "answer": 0, "explication": "Le pouvoir exécutif (définir la politique de la Nation et mettre en œuvre les lois) appartient au gouvernement.", "page": 16}, {"q": "Quel est le rôle du pouvoir judiciaire ?", "options": ["Voter les lois", "Rendre la justice", "Diriger l'administration", "Élire le Président"], "answer": 1, "explication": "Le pouvoir judiciaire consiste à rendre la justice ; il est exercé par les juges.", "page": 16}, {"q": "Vrai : laquelle de ces affirmations sur les partis politiques est exacte selon le livret ?", "options": ["Ils doivent être autorisés par le Président", "Ils se forment et exercent leur activité librement", "Il ne peut en exister que deux", "Ils sont créés par le Parlement"], "answer": 1, "explication": "En France, les partis politiques se forment et exercent leur activité librement.", "page": 16}, {"q": "Sous le contrôle de qui l'administration agit-elle ?", "options": ["Du maire", "Du juge", "Des partis politiques", "Du Parlement européen"], "answer": 1, "explication": "L'administration exerce ses missions dans le respect de la Constitution, des lois et des principes républicains, et agit sous le contrôle du juge.", "page": 16}]}, {"titre": "Les principales institutions de l'État", "questions": [{"q": "Le Président de la République est le chef de l'État et…", "options": ["… le chef du Parlement", "… le chef des armées", "… le président du Sénat", "… le chef de la justice"], "answer": 1, "explication": "Le Président de la République est chef de l'État et chef des armées.", "page": 16}, {"q": "Comment le Président de la République est-il élu ?", "options": ["Par les députés et les sénateurs", "Au suffrage universel indirect", "Au suffrage universel direct", "Par les maires"], "answer": 2, "explication": "Le Président est élu au suffrage universel direct, par tous les citoyens.", "page": 16}, {"q": "Pour combien de temps le Président de la République est-il élu ?", "options": ["4 ans", "5 ans", "6 ans", "7 ans"], "answer": 1, "explication": "Le Président est élu pour cinq ans, et son mandat est renouvelable une fois.", "page": 16}, {"q": "Combien de fois le mandat présidentiel peut-il être renouvelé ?", "options": ["Jamais", "Une fois", "Deux fois", "Sans limite"], "answer": 1, "explication": "Le mandat de cinq ans du Président est renouvelable une fois.", "page": 16}, {"q": "Combien de parrainages d'élus un candidat doit-il obtenir pour se présenter à l'élection présidentielle ?", "options": ["100", "300", "500", "1 000"], "answer": 2, "explication": "Seuls les candidats qui ont obtenu 500 parrainages d'élus peuvent se présenter à l'élection présidentielle.", "page": 16}, {"q": "Qui dirige l'action du Gouvernement ?", "options": ["Le Président du Sénat", "Le Premier ministre", "Le président de l'Assemblée nationale", "Le Conseil constitutionnel"], "answer": 1, "explication": "Le Président nomme les ministres sur proposition du Premier ministre, qui dirige l'action du Gouvernement.", "page": 16}, {"q": "De quelle majorité le Gouvernement est-il issu ?", "options": ["De la majorité aux élections législatives", "De la majorité au Sénat uniquement", "De la majorité aux élections municipales", "De la majorité au Parlement européen"], "answer": 0, "explication": "Le Gouvernement est issu de la majorité aux élections législatives.", "page": 16}, {"q": "Le Parlement est composé de…", "options": ["l'Assemblée nationale et le Conseil constitutionnel", "l'Assemblée nationale et le Sénat", "le Sénat et le Gouvernement", "le Conseil d'État et le Sénat"], "answer": 1, "explication": "Le Parlement est composé de l'Assemblée nationale et du Sénat ; il vote les lois et contrôle le Gouvernement.", "page": 16}, {"q": "Quelles sont les deux missions du Parlement citées par le livret ?", "options": ["Rendre la justice et voter le budget des communes", "Voter les lois et contrôler le Gouvernement", "Nommer le Premier ministre et les juges", "Diriger l'armée et l'administration"], "answer": 1, "explication": "Le Parlement vote les lois et contrôle le Gouvernement.", "page": 16}, {"q": "Combien y a-t-il de députés à l'Assemblée nationale ?", "options": ["348", "500", "577", "720"], "answer": 2, "explication": "Les députés sont 577 ; ils sont élus au suffrage universel direct tous les cinq ans.", "page": 16}, {"q": "Lors de quelles élections les députés sont-ils élus ?", "options": ["Les élections législatives", "Les élections sénatoriales", "Les élections municipales", "Les élections présidentielles"], "answer": 0, "explication": "Les députés sont élus au suffrage universel direct tous les cinq ans lors des élections législatives.", "page": 16}, {"q": "Combien y a-t-il de sénateurs ?", "options": ["101", "348", "577", "925"], "answer": 1, "explication": "Le Sénat compte 348 sénateurs, élus au suffrage universel indirect.", "page": 16}, {"q": "Comment et pour combien de temps les sénateurs sont-ils élus ?", "options": ["Au suffrage universel direct pour 5 ans", "Au suffrage universel indirect pour 6 ans", "Au suffrage universel direct pour 6 ans", "Ils sont nommés par le Président pour 5 ans"], "answer": 1, "explication": "Les sénateurs sont élus au suffrage universel indirect pour un mandat de six ans.", "page": 16}, {"q": "Vrai : laquelle de ces affirmations sur la justice est exacte ?", "options": ["La justice règle seulement les litiges entre particuliers", "La justice règle les litiges entre particuliers ou entreprises, et entre citoyens et administration", "La justice ne s'occupe pas des litiges avec l'administration", "La justice est rendue par les ministres"], "answer": 1, "explication": "La justice, rendue par les juges, règle les litiges entre particuliers ou entreprises, et entre les citoyens et l'administration.", "page": 17}, {"q": "Quels exemples de peines prévues par la loi le livret donne-t-il ?", "options": ["L'emprisonnement et l'amende", "L'exil et la confiscation de la nationalité", "Le travail forcé et l'amende", "La peine de mort et l'emprisonnement"], "answer": 0, "explication": "La justice sanctionne les infractions par des peines prévues par la loi, par exemple l'emprisonnement ou l'amende.", "page": 17}, {"q": "Quelle institution veille à la conformité des lois avec la Constitution ?", "options": ["Le Sénat", "Le Conseil constitutionnel", "La Cour de cassation", "Le Gouvernement"], "answer": 1, "explication": "Le Conseil constitutionnel veille à la conformité des lois avec la Constitution.", "page": 17}, {"q": "En plus de contrôler les lois, que contrôle le Conseil constitutionnel ?", "options": ["Le budget des communes", "La régularité des élections nationales", "Les décisions des préfets", "Les nominations des ministres"], "answer": 1, "explication": "Le Conseil constitutionnel contrôle aussi la régularité des élections nationales.", "page": 17}]}, {"titre": "Le droit de vote", "questions": [{"q": "Qu'est-ce que le droit de vote ?", "options": ["Le droit de se présenter à toutes les élections", "Le droit reconnu aux citoyens d'exprimer leur volonté lors d'une élection", "L'obligation de s'inscrire dans un parti", "Le droit de choisir ses juges"], "answer": 1, "explication": "Le droit de vote est le droit reconnu aux citoyens d'exprimer leur volonté à l'occasion d'une élection.", "page": 17}, {"q": "Que signifie « suffrage universel » ?", "options": ["Seuls les propriétaires votent", "Seuls les élus votent", "L'ensemble des citoyens vote", "Le vote se fait par internet"], "answer": 2, "explication": "En France, le suffrage est universel : l'ensemble des citoyens vote.", "page": 17}, {"q": "En quelle année a eu lieu le premier vote au suffrage universel en France ?", "options": ["1789", "1848", "1905", "1944"], "answer": 1, "explication": "Le premier vote au suffrage universel a eu lieu en 1848, mais il ne concernait que les hommes en âge de voter.", "page": 17}, {"q": "Qui pouvait voter lors du premier vote au suffrage universel en 1848 ?", "options": ["Tous les adultes, hommes et femmes", "Seulement les hommes en âge de voter", "Seulement les nobles", "Seulement les femmes mariées"], "answer": 1, "explication": "En 1848, le suffrage universel ne concernait que les hommes en âge de voter.", "page": 17}, {"q": "Quand les femmes françaises ont-elles obtenu le droit de vote ?", "options": ["En avril 1944", "En 1848", "En avril 1945", "En 1958"], "answer": 0, "explication": "Les femmes ont obtenu le droit de vote en avril 1944 et ont voté pour la première fois un an plus tard.", "page": 17}, {"q": "Quand les femmes françaises ont-elles voté pour la première fois ?", "options": ["En avril 1944", "En avril 1945", "En 1946", "En 1958"], "answer": 1, "explication": "Les femmes ont voté pour la première fois en avril 1945, un an après avoir obtenu le droit de vote.", "page": 17}, {"q": "Quel âge minimum faut-il avoir pour voter en France ?", "options": ["16 ans", "18 ans", "20 ans", "21 ans"], "answer": 1, "explication": "Pour voter, il faut être majeur, c'est-à-dire avoir au moins 18 ans.", "page": 17}, {"q": "Un ressortissant d'un autre État de l'Union européenne vivant en France peut voter à quelles élections ?", "options": ["Aux élections présidentielles et législatives", "Aux élections municipales et du Parlement européen", "À toutes les élections françaises", "À aucune élection"], "answer": 1, "explication": "Les ressortissants de l'UE peuvent voter en France aux élections municipales et aux élections du Parlement européen.", "page": 17}, {"q": "Laquelle de ces conditions n'est PAS demandée pour voter en France ?", "options": ["Être inscrit sur les listes électorales", "Ne pas avoir été privé de ses droits civiques", "Être majeur", "Être propriétaire de son logement"], "answer": 3, "explication": "Il faut être français (ou européen pour certaines élections), majeur, ne pas être privé de ses droits civiques et être inscrit sur les listes électorales.", "page": 17}, {"q": "Où peut-on s'inscrire sur les listes électorales ?", "options": ["Uniquement à la préfecture", "Sur internet ou à la mairie de son lieu de résidence", "Uniquement au bureau de vote le jour du scrutin", "Au tribunal"], "answer": 1, "explication": "On peut s'inscrire sur les listes électorales sur internet ou à la mairie de son lieu de résidence.", "page": 17}, {"q": "Que se passe-t-il si une personne ne remplit pas l'une des conditions pour voter ?", "options": ["Elle peut voter avec une amende", "Elle ne pourra pas voter", "Elle vote par procuration", "Elle vote seulement aux élections locales"], "answer": 1, "explication": "Si l'une des conditions n'est pas remplie, la personne ne pourra pas voter.", "page": 17}, {"q": "Qu'est-ce que la privation des droits civiques ?", "options": ["Une sanction pour des infractions graves, qui retire certains droits fondamentaux comme le droit de vote", "Une amende pour ne pas avoir voté", "Une interdiction de quitter la France", "La perte automatique de la nationalité"], "answer": 0, "explication": "La privation des droits civiques sanctionne des infractions graves ; elle retire par exemple le droit de vote ou de se présenter à une élection.", "page": 17}, {"q": "Quelles sont les deux caractéristiques du vote selon le livret ?", "options": ["Public et obligatoire", "Personnel et secret", "Collectif et public", "Familial et secret"], "answer": 1, "explication": "Le vote est personnel et secret.", "page": 17}, {"q": "Dans le bureau de vote, où l'électeur met-il son bulletin dans l'enveloppe ?", "options": ["Dans l'urne", "Dans l'isoloir", "À la mairie, la veille", "Devant le président du bureau de vote"], "answer": 1, "explication": "L'électeur passe par un isoloir pour mettre son bulletin dans une enveloppe, ensuite déposée dans une urne.", "page": 17}, {"q": "Où est déposée l'enveloppe contenant le bulletin de vote ?", "options": ["Dans une urne", "Dans une boîte aux lettres", "Dans l'isoloir", "Au guichet de la préfecture"], "answer": 0, "explication": "L'enveloppe contenant le bulletin est déposée dans une urne.", "page": 17}, {"q": "Vrai : laquelle de ces affirmations sur l'isoloir est exacte ?", "options": ["On peut y entrer en famille", "Il est interdit d'y entrer à plusieurs et de communiquer avec une personne d'un autre isoloir", "On peut y parler avec son voisin d'isoloir", "Il est facultatif"], "answer": 1, "explication": "Il est interdit d'entrer à plusieurs dans un isoloir et de communiquer avec une personne située dans un autre isoloir.", "page": 17}, {"q": "À quoi servent les panneaux d'affichage électoral installés dans chaque commune ?", "options": ["À afficher les résultats officiels", "À présenter les candidats pour informer les citoyens", "À afficher les listes électorales", "À la publicité commerciale"], "answer": 1, "explication": "Les panneaux d'affichage électoral présentent les candidats afin d'informer les citoyens ; aucune dégradation n'y est tolérée.", "page": 17}, {"q": "Quel document les Français ou ressortissants de l'UE doivent-ils présenter en arrivant au bureau de vote ?", "options": ["Un justificatif de domicile", "Une pièce d'identité", "Un avis d'imposition", "Un acte de naissance"], "answer": 1, "explication": "Il faut présenter une pièce d'identité au bureau de vote.", "page": 17}, {"q": "Dans quelles communes la pièce d'identité n'est-elle pas obligatoire pour voter ?", "options": ["Les communes de moins de 1 000 habitants", "Les communes de moins de 10 000 habitants", "Les communes d'outre-mer", "Les grandes villes"], "answer": 0, "explication": "La pièce d'identité n'est pas obligatoire dans les communes de moins de 1 000 habitants, mais le président du bureau de vote peut demander de prouver son identité en cas de doute.", "page": 17}, {"q": "Dans une petite commune, en cas de doute, qui peut demander à un électeur de prouver son identité par tout moyen ?", "options": ["Le préfet", "Le président du bureau de vote", "Un candidat", "Le gendarme"], "answer": 1, "explication": "En cas de doute, le président du bureau de vote peut demander de prouver son identité par tout moyen.", "page": 17}]}, {"titre": "Les principales élections", "questions": [{"q": "Selon le schéma des élections, qui sont les citoyens électeurs ?", "options": ["Les Français de plus de 18 ans non privés du droit de vote par une décision de justice", "Tous les habitants de France sans condition", "Les Français de plus de 21 ans", "Les seuls contribuables"], "answer": 0, "explication": "Les électeurs sont les Françaises et Français de plus de 18 ans qui n'ont pas été privés du droit de vote par une décision de justice.", "page": 18}, {"q": "Pour combien de temps sont élus les conseillers régionaux ?", "options": ["4 ans", "5 ans", "6 ans", "9 ans"], "answer": 2, "explication": "Les conseillers régionaux sont élus pour 6 ans.", "page": 18}, {"q": "Pour combien de temps sont élus les conseillers départementaux ?", "options": ["3 ans", "5 ans", "6 ans", "7 ans"], "answer": 2, "explication": "Les conseillers départementaux sont élus pour 6 ans.", "page": 18}, {"q": "Pour combien de temps sont élus le maire et les conseillers municipaux ?", "options": ["5 ans", "6 ans", "4 ans", "7 ans"], "answer": 1, "explication": "Le maire et les conseillers municipaux sont élus pour 6 ans.", "page": 18}, {"q": "D'après le schéma, qui élit les sénateurs ?", "options": ["Directement tous les citoyens", "Le Président de la République", "Les élus des régions, des départements et des communes", "Les députés"], "answer": 2, "explication": "Les élus régionaux, départementaux et municipaux élisent les sénateurs : c'est un suffrage indirect.", "page": 18}, {"q": "D'après le schéma, qui nomme le Premier ministre ?", "options": ["L'Assemblée nationale", "Le Président de la République", "Le Sénat", "Les citoyens"], "answer": 1, "explication": "Le Président de la République nomme le Premier ministre.", "page": 18}, {"q": "D'après le schéma, quel est le rôle du Gouvernement ?", "options": ["Voter les lois au nom du peuple", "Déterminer et conduire la politique de la Nation", "Élire les sénateurs", "Contrôler le Parlement"], "answer": 1, "explication": "Le Gouvernement détermine et conduit la politique de la Nation ; il est contrôlé par le Parlement.", "page": 18}, {"q": "D'après le schéma, quelle institution contrôle le Gouvernement ?", "options": ["Le Parlement", "Les conseils régionaux", "Les maires", "Les citoyens directement"], "answer": 0, "explication": "Le Parlement, qui vote les lois au nom du peuple, contrôle le Gouvernement.", "page": 18}, {"q": "D'après le schéma, quelle chambre du Parlement les citoyens élisent-ils directement ?", "options": ["Le Sénat", "L'Assemblée nationale", "Le Conseil constitutionnel", "Le Conseil d'État"], "answer": 1, "explication": "Les citoyens élisent directement les députés de l'Assemblée nationale ; les sénateurs sont élus par les élus locaux.", "page": 18}]}, {"titre": "Décentralisation et représentants de l'État", "questions": [{"q": "Comment appelle-t-on le fait que l'État transfère des compétences et des moyens à des collectivités territoriales ?", "options": ["La centralisation", "La décentralisation", "La nationalisation", "La séparation des pouvoirs"], "answer": 1, "explication": "Dans le cadre de la décentralisation, l'État transfère des compétences et des moyens aux collectivités territoriales.", "page": 19}, {"q": "Lequel de ces niveaux n'est PAS une collectivité cées", "Des collèges", "Des écoles maternelles et élémentaires", "Des universités"], "answer": 2, "explication": "Les communes sont responsables des écoles primaires publiques (maternelles et élémentaires).", "page": 19}, {"q": "Laquelle de ces missions relève de la commune ?", "options": ["L'entretien des routes communales et les activités sportives et culturelles", "La construction des lycées", "La protection de l'enfance", "La formation professionnelle"], "answer": 0, "explication": "Les communes s'occupent notamment des écoles primaires, des activités sportives et culturelles et de l'entretien des routes communales.", "page": 19}, {"q": "Que signifie que la commune tient les registres de l'état civil ?", "options": ["Elle enregistre les naissances, les mariages et les décès", "Elle enregistre les impôts", "Elle enregistre les votes", "Elle enregistre les entreprises"], "answer": 0, "explication": "Les communes tiennent l'état civil : elles enregistrent les naissances, les mariages et les décès.", "page": 19}, {"q": "Comment s'appellent les regroupements de communes (communautés de communes, métropoles…) ?", "options": ["Les intercommunalités", "Les départements", "Les cantons", "Les régions"], "answer": 0, "explication": "Les communes sont regroupées en intercommunalités, comme les communautés de communes ou les métropoles.", "page": 19}, {"q": "Quels services publics les intercommunalités gèrent-elles, selon le livret ?", "options": ["La justice et la police", "L'eau, l'assainissement, les déchets, les transports urbains", "Les lycées et la formation professionnelle", "L'armée et la diplomatie"], "answer": 1, "explication": "Les intercommunalités gèrent des services publics comme l'eau, l'assainissement, les déchets et les transports urbains.", "page": 19}]}, {"titre": "Les départements", "questions": [{"q": "Par quelle assemblée les départements sont-ils administrés ?", "options": ["Le conseil municipal", "Le conseil départemental", "Le conseil régional", "Le ndatrice de la coopération européenne ?", "options": ["1945", "1950", "1951", "1957"], "answer": 1, "explication": "La déclaration de Robert Schuman date du 9 mai 1950 ; elle est considérée comme l'acte de naissance de l'Union européenne.", "page": 23}]}, {"titre": "Les étapes clés de la construction européenne", "questions": [{"q": "En quelle année a été créée la Communauté européenne du charbon et de l'acier (CECA) ?", "options": ["1950", "1951", "1957", "1958"], "answer": 1, "explication": "La CECA a été créée en 1951.", "page": 23}, {"q": "La création de la Communauté économique européenne (CEE) en 1957 correspond à la mise en place…", "options": ["… de l'euro", "… du marché commun", "… de la citoyenneté européenne", "… de la Banque centrale européenne"], "answer": 1, "explication": "En 1957, la CEE est créée avec le marché commun.", "page": 23}, {"q": "En quelle année a été créée la Commission européenne, selon la frise ?", "options": ["1951", "1957", "1958", "1992"], "answer": 2, "explication": "La frise indique la création de la Commission européenne en 1958.", "page": 23}, {"q": "Quel est le rôle de la Commission européenne selon le livret ?", "options": ["Organe exécutif de l'Union européenne", "Tribunal de l'Union européenne", "Banque de l'Union européenne", "Assemblée élue par les citoyens"], "answer": 0, "explication": "La Commission européenne est l'organe exécutif de l'Union européenne.", "page": 23}, {"q": "Où se trouve la Commission européenne ?", "options": ["À Strasbourg (France)", "À Bruxelles (Belgique)", "À Francfort (Allemagne)", "À Rome (Italie)"], "answer": 1, "explication": "La Commission européenne est située à Bruxelles, en Belgique.", "page": 23}, {"q": "Laquelle de ces étapes N'a PAS eu lieu en 1992 selon la frise ?", "options": ["La création de l'Union européenne", "La création de la citoyenneté européenne", "La création de la Banque centrale européenne", "La mise en circulation des billets en euros"], "answer": 3, "explication": "En 1992 : création de l'UE, de la citoyenneté européenne et de la BCE. Les billets en euros n'ont circulé qu'en 2002.", "page": 23}, {"q": "Dans quelle ville se trouve la Banque centrale européenne (BCE) ?", "options": ["Bruxelles", "Strasbourg", "Francfort", "Luxembourg"], "answer": 2, "explication": "La BCE a été mise en place à Francfort, en Allemagne.", "page": 23}, {"q": "Quand la Banque centrale européenne a-t-elle été mise en place ?", "options": ["Le 1er janvier 2002", "Le 1er juin 1998", "Le 9 mai 1950", "Le 1er janvier 1992"], "answer": 1, "explication": "Créée en 1992, la BCE a été mise en place le 1er juin 1998 à Francfort pour préparer la monnaie unique.", "page": 23}, {"q": "Dans combien de pays de l'Union les pièces et billets en euros ont-ils été mis en circulation en 2002 ?", "options": ["6", "12", "15", "21"], "answer": 1, "explication": "En 2002, l'euro a été mis en circulation dans 12 pays ; il y en a 21 aujourd'hui.", "page": 23}, {"q": "Combien de pays de l'Union utilisent l'euro aujourd'hui, selon la frise ?", "options": ["12", "19", "21", "27"], "answer": 2, "explication": "L'euro, lancé dans 12 pays en 2002, est aujourd'hui utilisé dans 21 pays de l'Union.", "page": 23}]}]}, {"partie": "Droits fondamentaux", "sections": [{"titre": "Plan de la partie et introduction aux droits", "questions": [{"q": "Dans le livret du citoyen, la partie « Droits et devoirs des citoyens » est divisée en deux grands chapitres. Lesquels ?", "options": ["Les droits fondamentaux, et les obligations et devoirs des citoyens", "Les institutions nationales, et les institutions européennes", "L'histoire de France, et la géographie de la France", "Les symboles de la République, et la laïcité"], "answer": 0, "explication": "La partie 3 traite d'abord des droits fondamentaux (I), puis des obligations et devoirs des citoyens (II).", "page": 24}, {"q": "Dans le livret, les droits fondamentaux sont classés en cinq familles. Laquelle de ces familles n'en fait PAS partie ?", "options": ["Les droits économiques et boursiers", "Les droits liés à la liberté individuelle", "Les droits liés à la sûreté et à la justice", "Les droits environnementaux"], "answer": 0, "explication": "Les cinq familles sont : liberté individuelle, dignité, sûreté et justice, droits politiques, droits environnementaux.", "page": 24}, {"q": "Selon le livret, que signifie « être citoyen d'un État » ?", "options": ["Avoir la nationalité de cet État", "Habiter dans cet État depuis plus de cinq ans", "Payer des impôts dans cet État", "Être né sur le territoire de cet État"], "answer": 0, "explication": "Être citoyen d'un État, c'est avoir sa nationalité, et donc avoir des droits et des devoirs.", "page": 25}, {"q": "Selon le livret, que garantissent les droits et les devoirs dans notre vie en société ?", "options": ["Un équilibre entre les libertés individuelles et le bien commun", "La supériorité de l'intérêt individuel sur l'intérêt général", "La richesse de chaque citoyen", "Le pouvoir absolu de l'État sur les personnes"], "answer": 0, "explication": "Droits et devoirs conditionnent la vie en société et assurent un équilibre entre libertés individuelles et bien commun.", "page": 25}, {"q": "Lequel de ces droits ou devoirs est réservé aux citoyens français ?", "options": ["Le droit de vote", "La liberté d'expression", "Le respect de la loi", "La liberté de religion"], "answer": 0, "explication": "Le droit de vote, la participation à la défense nationale et au jury d'assises sont propres aux citoyens français ; la plupart des autres droits et devoirs concernent toutes les personnes résidant en France.", "page": 25}, {"q": "Laquelle de ces participations est, selon le livret, spécifique aux citoyens français ?", "options": ["La participation au jury d'assises", "La participation à une association", "La participation à une manifestation déclarée", "La participation à une réunion pacifique"], "answer": 0, "explication": "Le jury d'assises et la défense nationale, comme le vote, sont réservés aux citoyens français.", "page": 25}, {"q": "Vrai : laquelle de ces affirmations est exacte ?", "options": ["La loi et les règlements s'appliquent à toutes les personnes résidant en France, quelle que soit leur nationalité", "La loi française s'applique seulement aux citoyens français", "Les étrangers en France ne sont soumis qu'aux lois de leur pays d'origine", "Les règlements ne s'appliquent qu'aux fonctionnaires"], "answer": 0, "explication": "La plupart des droits et devoirs, et en particulier la loi et les règlements, s'appliquent à tous, quels que soient la nationalité ou le statut.", "page": 25}, {"q": "Que définit le Code civil ?", "options": ["Les règles essentielles applicables entre les personnes", "Les infractions et les peines", "Le fonctionnement de l'armée", "Les règles de circulation routière"], "answer": 0, "explication": "Le Code civil fixe les règles essentielles entre les personnes ; c'est le Code pénal qui définit les infractions et les peines.", "page": 25}, {"q": "Que définit le Code pénal ?", "options": ["Les infractions et les peines qui les sanctionnent", "Les règles du mariage et de l'héritage", "Les droits des salariés", "Les règles de l'Union européenne"], "answer": 0, "explication": "Le Code pénal définit les infractions et précise les peines correspondantes.", "page": 25}, {"q": "En quelle année et par qui le Code civil a-t-il été promulgué ?", "options": ["En 1804, par Napoléon Bonaparte", "En 1789, par Louis XVI", "En 1848, par Louis-Napoléon Bonaparte", "En 1905, par Aristide Briand"], "answer": 0, "explication": "Le Code civil a été promulgué en 1804 par Napoléon Bonaparte.", "page": 25}, {"q": "Lequel de ces textes fait partie des textes qui garantissent principalement les droits fondamentaux en France ?", "options": ["La Déclaration des droits de l'homme et du citoyen de 1789", "Le Code de la route", "Le traité de Versailles de 1919", "L'édit de Nantes de 1598"], "answer": 0, "explication": "Les droits fondamentaux sont garantis notamment par la Constitution de la Ve République, la DDHC de 1789, le préambule de 1946, la Charte de l'environnement de 2004 et les textes internationaux ratifiés.", "page": 25}, {"q": "Quelle partie de la Constitution de 1946 garantit encore aujourd'hui des droits fondamentaux en France ?", "options": ["Son préambule", "Son article sur le Président de la République", "Son titre sur l'Union française", "Aucune partie, elle a été totalement abandonnée"], "answer": 0, "explication": "Le préambule de la Constitution de 1946 fait partie des textes qui garantissent les droits fondamentaux.", "page": 25}, {"q": "De quelle année date la Charte de l'environnement ?", "options": ["2004", "1958", "1992", "2015"], "answer": 0, "explication": "La Charte de l'environnement de 2004 fait partie des textes qui garantissent les droits fondamentaux.", "page": 25}, {"q": "Que signifie le sigle CEDH dans le livret ?", "options": ["Convention européenne des droits de l'homme", "Commission européenne de défense humanitaire", "Charte d'égalité des droits humains", "Conseil européen des hommes d'État"], "answer": 0, "explication": "La CEDH, ou Convention européenne de sauvegarde des droits de l'homme et des libertés fondamentales, est un texte international ratifié par la France.", "page": 25}, {"q": "Sur quel site internet peut-on consulter toutes les lois, souvent regroupées en codes ?", "options": ["www.legifrance.gouv.fr", "www.service-public.fr", "www.elysee.fr", "www.assemblee-nationale.fr"], "answer": 0, "explication": "Toutes les lois sont disponibles sur Légifrance (www.legifrance.gouv.fr).", "page": 25}, {"q": "Quel site présente les principales règles et le fonctionnement des institutions, selon le livret ?", "options": ["www.vie-publique.fr", "www.legifrance.gouv.fr", "www.impots.gouv.fr", "www.ameli.fr"], "answer": 0, "explication": "Le site vie-publique.fr explique les principales règles et le fonctionnement des institutions.", "page": 25}]}, {"titre": "La liberté de choix", "questions": [{"q": "Qu'est-ce que la liberté de choix, selon le livret ?", "options": ["La liberté de décider de son mode de vie, de ses relations et de ses projets, dans les limites de la loi", "La liberté de faire tout ce que l'on veut, sans aucune limite", "La liberté de choisir les lois que l'on respecte", "La liberté de choisir son juge en cas de procès"], "answer": 0, "explication": "La liberté de choix est une liberté personnelle qui permet de décider de sa vie, toujours dans les limites de la loi.", "page": 26}, {"q": "Complétez l'article 4 de la Déclaration de 1789 : « La liberté consiste à pouvoir faire tout ce qui… »", "options": ["… ne nuit pas à autrui »", "… plaît à chacun »", "… est autorisé par le roi »", "… sert l'intérêt de l'État »"], "answer": 0, "explication": "L'article 4 de la DDHC, cité par le préambule de la Constitution de 1958, définit la liberté comme le pouvoir de faire tout ce qui ne nuit pas à autrui.", "page": 26}, {"q": "Quel article de la Déclaration des droits de l'homme et du citoyen définit la liberté comme « pouvoir faire tout ce qui ne nuit pas à autrui » ?", "options": ["L'article 4", "L'article 1er", "L'article 10", "L'article 11"], "answer": 0, "explication": "C'est l'article 4 de la DDHC de 1789.", "page": 26}, {"q": "Qui a peint « La Liberté guidant le peuple », et en quelle année ?", "options": ["Eugène Delacroix, en 1830", "Jacques-Louis David, en 1789", "Claude Monet, en 1872", "Gustave Courbet, en 1848"], "answer": 0, "explication": "« La Liberté guidant le peuple » a été peinte par Eugène Delacroix en 1830.", "page": 26}]}, {"titre": "La liberté de pensée, de conscience et de religion", "questions": [{"q": "Quel article de la Déclaration de 1789 protège la liberté d'opinion, même religieuse ?", "options": ["L'article 10", "L'article 4", "L'article 11", "L'article 17"], "answer": 0, "explication": "L'article 10 de la DDHC dit que nul ne doit être inquiété pour ses opinions, même religieuses, si leur manifestation ne trouble pas l'ordre public.", "page": 26}, {"q": "Complétez l'article 10 de la DDHC : « Nul ne doit être inquiété pour ses opinions, même religieuses, pourvu que leur manifestation ne trouble pas… »", "options": ["… l'ordre public établi par la loi »", "… la tranquillité du voisinage »", "… les intérêts du gouvernement »", "… la morale de l'Église »"], "answer": 0, "explication": "La seule limite posée est que l'expression des opinions ne trouble pas l'ordre public établi par la loi.", "page": 26}, {"q": "Selon le livret, la liberté de pensée est :", "options": ["Totale", "Limitée aux opinions politiques", "Réservée aux citoyens français", "Soumise à une autorisation du maire"], "answer": 0, "explication": "La liberté de pensée et de conscience permet de croire, réfléchir et douter sans contrainte ; elle est totale.", "page": 26}, {"q": "Vrai : laquelle de ces affirmations sur la religion est exacte ?", "options": ["On peut croire en un ou plusieurs dieux, ou n'avoir aucune religion", "Chaque personne doit déclarer sa religion à la mairie", "Il est obligatoire de pratiquer une religion reconnue par l'État", "On ne peut pas changer de religion en France"], "answer": 0, "explication": "Chacun est libre de choisir sa religion et de la pratiquer, mais aussi de ne pas croire.", "page": 26}, {"q": "Une personne emprisonnée conserve-t-elle la liberté de culte ?", "options": ["Oui, elle conserve la liberté de culte pendant sa détention", "Non, elle la perd pendant toute sa peine", "Seulement si elle est condamnée à moins d'un an", "Seulement après autorisation du ministre de l'Intérieur"], "answer": 0, "explication": "Les personnes emprisonnées conservent la liberté de culte pendant leur détention.", "page": 26}, {"q": "À quelle condition peut-on adhérer à un parti politique en France ?", "options": ["Sans condition : tout individu est libre d'adhérer à un parti politique", "Il faut avoir plus de 25 ans", "Il faut avoir l'accord du préfet", "Il faut être fonctionnaire"], "answer": 0, "explication": "Le livret précise que tout individu est libre d'adhérer à un parti politique sans condition.", "page": 26}]}, {"titre": "La liberté d'expression et la liberté de la presse", "questions": [{"q": "Vrai : laquelle de ces affirmations sur la liberté d'expression est exacte ?", "options": ["Elle s'exerce dans les limites fixées par la loi", "Elle n'a aucune limite", "Elle est réservée aux journalistes", "Elle ne s'applique pas sur internet"], "answer": 0, "explication": "Chacun est libre d'exprimer ses idées, mais dans les limites fixées par la loi.", "page": 26}, {"q": "Pour quelle raison l'État peut-il limiter la liberté d'expression, selon le livret ?", "options": ["Pour éviter la diffusion de propos discriminatoires", "Pour empêcher toute critique du gouvernement", "Pour interdire les opinions religieuses", "Pour protéger les entreprises de la concurrence"], "answer": 0, "explication": "L'État peut limiter la liberté d'expression, notamment pour éviter des propos discriminatoires ; les appels à la violence sont interdits.", "page": 26}, {"q": "Sur les réseaux sociaux en France, quels contenus sont interdits ?", "options": ["Les contenus qui incitent à la haine ou à la violence", "Les contenus qui critiquent une religion", "Tous les contenus politiques", "Les contenus écrits dans une langue étrangère"], "answer": 0, "explication": "La liberté d'expression est protégée sur les réseaux sociaux, mais l'incitation à la haine ou à la violence est interdite.", "page": 26}, {"q": "Quel article de la Déclaration des droits de l'homme et du citoyen protège la « libre communication des pensées et des opinions » ?", "options": ["L'article 11", "L'article 4", "L'article 10", "L'article 1er"], "answer": 0, "explication": "L'article 11 de la DDHC fait de la libre communication des pensées et des opinions un principe fondamental ; c'est la base de la liberté de la presse.", "page": 27}, {"q": "En France, les journalistes peuvent-ils diffuser des informations concernant des croyances religieuses ?", "options": ["Oui, la presse est libre, y compris lorsqu'il s'agit d'institutions, de personnalités ou de croyances religieuses", "Non, les religions ne peuvent jamais être évoquées dans la presse", "Seulement avec l'accord des autorités religieuses", "Seulement dans la presse religieuse"], "answer": 0, "explication": "La presse est libre et peut informer et donner son opinion, y compris sur les institutions, les personnalités et les croyances religieuses.", "page": 27}, {"q": "Lequel de ces actes est interdit aux journalistes et peut entraîner des poursuites judiciaires ?", "options": ["Contester des crimes contre l'humanité", "Critiquer une décision du gouvernement", "Donner leur opinion sur un événement", "Informer sur ce qui se passe à l'étranger"], "answer": 0, "explication": "La liberté de la presse est encadrée : diffamation, incitation à commettre des crimes ou délits et contestation de crimes contre l'humanité sont interdites.", "page": 27}, {"q": "Avez-vous le droit de tout dire publiquement ? Selon le livret :", "options": ["Non : il est interdit de diffuser des injures, des propos diffamatoires, des provocations à la haine ou de faire l'apologie de crimes contre l'humanité", "Oui : la liberté d'expression n'a aucune limite", "Oui, mais seulement dans un lieu privé", "Non : toute opinion doit d'abord être autorisée par l'administration"], "answer": 0, "explication": "La liberté d'expression est un droit fondamental, mais elle a des limites pour respecter les droits des autres.", "page": 27}]}, {"titre": "La liberté d'aller et venir", "questions": [{"q": "Quel autre nom donne-t-on à la liberté d'aller et venir ?", "options": ["La liberté de circulation", "La liberté de réunion", "La liberté de choix", "La liberté de manifester"], "answer": 0, "explication": "La liberté d'aller et venir est aussi appelée liberté de circulation.", "page": 27}, {"q": "Où un citoyen français est-il libre de circuler, selon le livret ?", "options": ["Sur le territoire français et dans l'Union européenne", "Seulement dans sa région de résidence", "Seulement en France métropolitaine", "Dans tous les pays du monde sans aucune condition"], "answer": 0, "explication": "Tout citoyen peut circuler librement en France et dans l'Union européenne, et entrer ou sortir librement du territoire.", "page": 27}, {"q": "Que doit obtenir un mineur qui voyage hors de France sans ses parents ?", "options": ["Une autorisation de sortie du territoire", "Un visa Schengen", "Un permis de séjour", "Une carte électorale"], "answer": 0, "explication": "Les mineurs qui voyagent sans leurs parents doivent avoir une autorisation de sortie du territoire.", "page": 27}, {"q": "Les déplacements des citoyens français à l'intérieur du territoire national font-ils l'objet de contrôles ?", "options": ["En principe non : la circulation y est libre", "Oui, il faut toujours une autorisation pour changer de département", "Oui, chaque déplacement doit être déclaré à la mairie", "Seulement pour les déplacements de plus de 100 km"], "answer": 0, "explication": "En principe, les déplacements des citoyens français sur le territoire national ne font l'objet d'aucun contrôle.", "page": 27}, {"q": "Qu'est-ce que l'espace Schengen ?", "options": ["Une zone de libre circulation des personnes sans contrôle aux frontières intérieures", "Une zone où l'euro est la monnaie commune", "Une alliance militaire européenne", "Une zone de libre-échange entre la France et l'Afrique"], "answer": 0, "explication": "L'espace Schengen permet de circuler librement sans contrôle aux frontières intérieures.", "page": 27}, {"q": "Lequel de ces pays est un État associé à l'espace Schengen sans être membre de l'Union européenne ?", "options": ["La Suisse", "Le Royaume-Uni", "La Turquie", "Le Maroc"], "answer": 0, "explication": "Les 4 États associés à Schengen sont la Norvège, l'Islande, la Suisse et le Liechtenstein.", "page": 27}, {"q": "Combien d'États non membres de l'Union européenne sont associés à l'espace Schengen, selon le livret ?", "options": ["4", "2", "6", "10"], "answer": 0, "explication": "Quatre États associés : Norvège, Islande, Suisse et Liechtenstein.", "page": 27}, {"q": "Laquelle de ces situations est une exception à la liberté de circulation ?", "options": ["Une personne en prison pendant sa peine", "Un salarié en vacances", "Un étudiant qui change de ville", "Un retraité qui voyage en Europe"], "answer": 0, "explication": "Les prisonniers sont privés de leur liberté de circulation le temps de leur peine.", "page": 27}, {"q": "Comment les États limitent-ils l'entrée des étrangers non européens sur leur territoire ?", "options": ["Par des conditions d'entrée, avec les visas", "Par une interdiction totale d'entrée", "Par un tirage au sort", "Ils ne peuvent poser aucune condition"], "answer": 0, "explication": "Par leur souveraineté, les États posent des conditions d'entrée pour les étrangers non européens, notamment les visas.", "page": 27}, {"q": "Dans quel cas l'État peut-il restreindre la liberté d'aller et venir de tous ?", "options": ["En cas de « crise exceptionnelle et temporaire », comme un état d'urgence", "Pendant les vacances scolaires", "Pendant les élections", "Chaque fois qu'un maire le souhaite, sans raison"], "answer": 0, "explication": "En cas de crise exceptionnelle et temporaire, comme un état d'urgence, l'État peut restreindre cette liberté.", "page": 27}, {"q": "Pour un étranger non ressortissant de l'Union européenne, que faut-il détenir à l'expiration de son visa (non renouvelé) pour rester en France ?", "options": ["Un titre de séjour", "Une carte d'électeur", "Un passeport européen", "Une simple attestation d'hébergement"], "answer": 0, "explication": "À l'expiration du visa, il est obligatoire de détenir un titre de séjour.", "page": 27}]}, {"titre": "Le droit au respect de la vie privée", "questions": [{"q": "Quel texte garantit le droit au respect de la vie privée, selon le livret ?", "options": ["La Constitution", "Le Code de la route", "Le règlement intérieur des entreprises", "Le Code du sport"], "answer": 0, "explication": "Le droit au respect de la vie privée est garanti par la Constitution.", "page": 28}, {"q": "Lequel de ces éléments fait partie du droit au respect de la vie privée ?", "options": ["Le secret médical", "Le droit de vote", "La liberté de manifester", "Le droit de grève"], "answer": 0, "explication": "La vie privée inclut le respect de l'intimité, du secret médical et du droit à l'image, ainsi que des limites à la surveillance.", "page": 28}, {"q": "Quel exemple de pratique de surveillance le livret cite-t-il comme devant être limitée pour protéger la vie privée ?", "options": ["Les écoutes téléphoniques", "Les contrôles de vitesse sur la route", "Les examens scolaires", "Les recensements de population"], "answer": 0, "explication": "La vie privée impose des limites aux pratiques de surveillance et d'enquête, comme les écoutes téléphoniques ; des règles limitent aussi les risques liés aux outils numériques.", "page": 28}, {"q": "Quel juge veille au respect du droit à la vie privée ?", "options": ["Le juge judiciaire", "Le juge administratif", "Le Conseil constitutionnel", "La Cour des comptes"], "answer": 0, "explication": "C'est le juge judiciaire qui veille au respect du droit à la vie privée.", "page": 28}, {"q": "Un médecin peut-il révéler le dossier médical d'un patient ?", "options": ["Non, pas sans le consentement du patient", "Oui, à tout membre de la famille qui le demande", "Oui, à l'employeur du patient", "Oui, s'il en informe la mairie"], "answer": 0, "explication": "Le secret professionnel et médical interdit au médecin de révéler le dossier médical sans le consentement de la personne.", "page": 28}, {"q": "Vrai : laquelle de ces affirmations sur le droit à l'image est exacte ?", "options": ["Il est interdit de photographier ou filmer une personne sans son autorisation dans un lieu privé", "On  "Toute personne a droit à un logement gratuit", "Chacun doit avoir le même salaire", "Toute personne a le droit de voter"], "answer": 0, "explication": "La dignité humaine implique qu'une personne ne soit jamais traitée comme un objet ou un moyen.", "page": 28}, {"q": "Dans quel texte le principe de dignité de la personne humaine est-il inscrit, selon le livret ?", "options": ["Le préambule de la Constitution de 1946", "La Charte de l'environnement de 2004", "La loi du 1er juillet 1901", "Le Code civil de 1804"], "answer": 0, "explication": "Le principe de dignité est inscrit dans le préambule de la Constitution de 1946.", "page": 28}, {"q": "Combien de droits essentiels liés au respect de la personne humaine la Charte des droits fondamentaux de l'Union européenne identifie-t-elle, selon le livret ?", "options": ["5", "3", "7", "10"], "answer": 0, "explication": "Cinq droits : dignité humaine, droit à la vie, intégrité de la personne, interdiction de la torture et des traitements inhumains ou dégradants, interdiction de l'esclavage et du travail forcé.", "page": 28}, {"q": "Lequel de ces droits fait partie des droits liés au respect de la personne humaine dans la Charte des droits fondamentaux de l'UE ?", "options": ["L'interdiction de l'esclavage et du travail forcé", "Le droit de posséder une voiture", "Le droit de voter aux élections nationales", "Le droit de ne pas payer d'impôts"], "answer": 0, "explication": "L'interdiction de l'esclavage et du travail forcé fait partie des cinq droits essentiels cités.", "page": 28}, {"q": "Que protège le droit à l'intégrité de la personne ?", "options": ["Le corps et l'esprit d'une personne", "Les biens et l'argent d'une personne", "Le nom de famille d'une personne", "La nationalité d'une personne"], "answer": 0, "explication": "Le droit à l'intégrité de la personne protège son corps et son esprit.", "page": 28}, {"q": "Selon le livret, quel exemple constitue une atteinte à la dignité ?", "options": ["Une personne employée mnés", "Un service de police spécialisé", "Une indemnité versée aux juges"], "answer": 0, "explication": "L'aide juridictionnelle aide financièrement les personnes ayant peu de moyens à être accompagnées par un avocat lors d'un procès.", "page": 30}, {"q": "En quelle année le Défenseur des droits a-t-il été créé ?", "options": ["2011", "1958", "1981", "2004"], "answer": 0, "explication": "Le Défenseur des droits est une autorité administrative indépendante créée en 2011.", "page": 30}, {"q": "Qu'est-ce que le Défenseur des droits ?", "options": ["Une autorité administrative indépendante", "Un avocat payé par chaque citoyen", "Un service du ministère de l'Intérieur", "Un juge de la Cour de cassation"], "answer": 0, "explication": "C'est une autorité administrative indépendante qui intervient en cas de litige avec une administration, de discrimination ou d'atteinte aux droits.", "page": 30}, {"q": "Dans quelle situation peut-on faire appel au Défenseur des droits ?", "options": ["En cas de discrimination ou de litige avec une administration", "Pour obtenir un permis de construire", "Pour contester une note scolaire", "Pour demander une augmentation de salaire"], "answer": 0, "explication": "Il intervient en cas de litige avec une administration, de discrimination ou d'atteinte aux droits, et défend les usagers des services publics ; on peut rencontrer un délégué localement.", "page": 30}, {"q": "Quel est le rôle des maisons de justice et du droit ?", "options": ["Orienter et conseiller les personnes dans leurs démarches juridiques", "Juger les délits", "Enregistrer les mariages", "Délivrer les titres de séjour"], "answer": 0, "explication": "Elles orientent et conseillent, avec des permanences gratuites assurées par des associations spécialisées.", "page": 30}, {"q": "Sous la coordination de quel organisme les maisons de justice et du droit assurent-elles leurs permanences gratuites ?", "options": ["Les conseils départementaux d'accès au droit (CDAD)", "Le Conseil constitutionnel", "Les chambres de commerce", "Le Conseil d'État"], "answer": 0, "explication": "Les permanences gratuites sont coordonnées par les conseils départementaux d'accès au droit (CDAD).", "page": 30}]}, {"titre": "Les droits politiques", "questions": [{"q": "Selon le livret, que constituent le droit de vote et le droit de se porter candidat aux élections ?", "options": ["Les fondements de la démocratie représentative", "Des droits réservés aux élus", "Des obligations sanctionnées par une amende", "Des droits environnementaux"], "answer": 0, "explication": "Le droit de vote et le droit d'être candidat sont les fondements de la démocratie représentative.", "page": 30}, {"q": "Que permet la liberté de réunion ?", "options": ["Se rassembler pacifiquement pour exprimer des opinions, débattre ou défendre des intérêts communs", "Se rassembler armé pour défendre ses idées", "Occuper un bâtiment public sans autorisation", "Se réunir uniquement dans un lieu religieux"], "answer": 0, "explication": "La liberté de réunion permet de se rassembler pacifiquement ; elle est importante pour la démocratie.", "page": 30}, {"q": "Qui peut restreindre la liberté de réunion en cas de risque de trouble à l'ordre public ?", "options": ["L'autorité administrative (maire, préfet…), sous le contrôle du juge", "N'importe quel citoyen", "Les organisateurs eux-mêmes uniquement", "Personne, cette liberté est absolue"], "answer": 0, "explication": "En cas de risque de violences ou d'émeutes, le maire ou le préfet peut restreindre cette liberté, sous le contrôle du juge.", "page": 30}, {"q": "Selon le livret, que doit-on faire avant d'organiser une manifestation ?", "options": ["La déclarer auprès de l'administration", "Obtenir l'accord du Président de la République", "Payer une taxe", "Prévenir uniquement la presse"], "answer": 0, "explication": "Pour éviter les troubles à l'ordre public, une manifestation doit être déclarée à l'administration.", "page": 31}, {"q": "Que précise notamment l
