enne et la Charte de l'ONU", "Le Concordat de 1801 et la loi de 1905"], "answer": 0, "explication": "Les annexes contiennent la Déclaration des droits de l'homme et du citoyen de 1789, la Charte des droits et devoirs du citoyen français et une liste de ressources.", "page": 77}, {"q": "Complétez l'article 1er de la DDHC : « Les hommes naissent et demeurent … en droits. »", "options": ["libres et égaux", "frères et solidaires", "citoyens et souverains", "libres et propriétaires"], "answer": 0, "explication": "Art. 1er : « Les hommes naissent et demeurent libres et égaux en droits. »", "page": 78}, {"q": "Selon l'article 1er de la DDHC, sur quoi seulement les distinctions sociales peuvent-elles être fondées ?", "options": ["Sur l'utilité commune", "Sur la naissance", "Sur la richesse", "Sur la religion"], "answer": 0, "explication": "« Les distinctions sociales ne peuvent être fondées que sur l'utilité commune. »", "page": 78}, {"q": "Selon l'article 2 de la DDHC, quels sont les droits naturels et imprescriptibles de l'Homme ?", "options": ["La liberté, la propriété, la sûreté et la résistance à l'oppression", "La liberté, l'égalité, la fraternité et la laïcité", "Le travail, le logement, la santé et l'éducation", "Le vote, l'impôt, la défense et la justice"], "answer": 0, "explication": "Art. 2 : ces droits sont « la liberté, la propriété, la sûreté, et la résistance à l'oppression ».", "page": 78}, {"q": "Selon l'article 2 de la DDHC, quel est le but de toute association politique ?", "options": ["La conservation des droits naturels et imprescriptibles de l'Homme", "La conquête de nouveaux territoires", "L'enrichissement de l'État", "La défense de la religion"], "answer": 0, "explication": "Art. 2 : le but de toute association politique est de conserver les droits naturels et imprescriptibles de l'Homme.", "page": 78}, {"q": "Selon l'article 3 de la DDHC, où réside le principe de toute souveraineté ?", "options": ["Dans la Nation", "Dans le Roi", "Dans l'Église", "Dans l'armée"], "answer": 0, "explication": "Art. 3 : « Le principe de toute Souveraineté réside essentiellement dans la Nation. » Nul ne peut exercer une autorité qui n'en émane expressément.", "page": 78}, {"q": "Complétez l'article 4 de la DDHC : « La liberté consiste à pouvoir faire tout ce qui … »", "options": ["ne nuit pas à autrui", "est autorisé par le Roi", "plaît à chacun", "rapporte à la Nation"], "answer": 0, "explication": "Art. 4 : « La liberté consiste à pouvoir faire tout ce qui ne nuit pas à autrui. »", "page": 78}, {"q": "Selon l'article 4 de la DDHC, qui peut seul fixer les bornes (limites) de l'exercice des droits naturels ?", "options": ["La Loi", "Le juge", "Le gouvernement", "Chaque citoyen"], "answer": 0, "explication": "Art. 4 : les bornes des droits naturels « ne peuvent être déterminées que par la Loi ».", "page": 78}, {"q": "Selon l'article 5 de la DDHC, que peut seulement défendre (interdire) la Loi ?", "options": ["Les actions nuisibles à la Société", "Toutes les actions qui déplaisent au gouvernement", "Les opinions religieuses", "Les actions des étrangers"], "answer": 0, "explication": "Art. 5 : « La Loi n'a le droit de défendre que les actions nuisibles à la Société. »", "page": 78}, {"q": "Complétez l'article 5 de la DDHC : « Tout ce qui n'est pas défendu par la Loi ne peut être empêché, et nul ne peut être contraint à faire ce qu'elle … »", "options": ["n'ordonne pas", "interdit", "permet", "recommande"], "answer": 0, "explication": "Art. 5 : ce qui n'est pas interdit par la loi est permis, et personne ne peut être obligé de faire ce que la loi n'ordonne pas.", "page": 78}, {"q": "Complétez l'article 6 de la DDHC : « La Loi est l'expression de … »", "options": ["la volonté générale", "la volonté du Roi", "la raison d'État", "la volonté de la majorité des juges"], "answer": 0, "explication": "Art. 6 : « La Loi est l'expression de la volonté générale. » Tous les citoyens peuvent concourir à sa formation, personnellement ou par leurs représentants.", "page": 78}, {"q": "Selon l'article 6 de la DDHC, la Loi doit être la même pour tous…", "options": ["soit qu'elle protège, soit qu'elle punisse", "sauf pour les nobles", "sauf en temps de guerre", "seulement pour les citoyens majeurs"], "answer": 0, "explication": "Art. 6 : la Loi « doit être la même pour tous, soit qu'elle protège, soit qu'elle punisse ».", "page": 78}, {"q": "Selon l'article 6 de la DDHC, l'accès aux dignités, places et emplois publics se fait…", "options": ["Selon la capacité, sans autre distinction que les vertus et les talents", "Selon la naissance", "Selon la fortune", "Par tirage au sort"], "answer": 0, "explication": "Art. 6 : tous les citoyens sont également admissibles aux emplois publics selon leur capacité, leurs vertus et leurs talents.", "page": 78}, {"q": "Selon l'article 7 de la DDHC, dans quels cas un homme peut-il être accusé, arrêté ou détenu ?", "options": ["Seulement dans les cas déterminés par la Loi et selon les formes qu'elle a prescrites", "Chaque fois que la police le décide", "Sur simple ordre d'un élu", "Jamais"], "answer": 0, "explication": "Art. 7 : nul ne peut être accusé, arrêté ni détenu que dans les cas et formes prévus par la Loi ; les ordres arbitraires doivent être punis.", "page": 78}, {"q": "Vrai : selon l'article 7 de la DDHC, que doit faire un citoyen appelé ou saisi en vertu de la Loi ?", "options": ["Obéir à l'instant : il se rend coupable par la résistance", "Résister s'il n'est pas d'accord", "Demander d'abord l'avis d'un élu", "Quitter le territoire"], "answer": 0, "explication": "Art. 7 : tout citoyen appelé ou saisi en vertu de la Loi doit obéir immédiatement ; résister le rend coupable.", "page": 78}, {"q": "Selon l'article 8 de la DDHC, quelles peines la Loi doit-elle établir ?", "options": ["Seulement des peines strictement et évidemment nécessaires", "Les peines les plus sévères possibles", "Des peines choisies librement par chaque juge", "Uniquement des amendes"], "answer": 0, "explication": "Art. 8 : « La Loi ne doit établir que des peines strictement et évidemment nécessaires. »", "page": 78}, {"q": "Selon l'article 8 de la DDHC, une personne peut être punie seulement en vertu d'une loi…", "options": ["Établie et promulguée antérieurement au délit, et légalement appliquée", "Votée après le délit", "Décidée par le juge le jour du procès", "Écrite par la victime"], "answer": 0, "explication": "Art. 8 : la loi pénale doit exister avant les faits (non-rétroactivité).", "page": 78}, {"q": "Quel principe est affirmé par l'article 9 de la DDHC ?", "options": ["La présomption d'innocence", "La séparation des pouvoirs", "La laïcité", "Le droit de propriété"], "answer": 0, "explication": "Art. 9 : tout homme est présumé innocent jusqu'à ce qu'il ait été déclaré coupable ; toute rigueur inutile lors d'une arrestation doit être réprimée.", "page": 78}, {"q": "Complétez l'article 10 de la DDHC : « Nul ne doit être inquiété pour ses opinions, même … »", "options": ["religieuses", "politiques", "fausses", "secrètes"], "answer": 0, "explication": "Art. 10 : « Nul ne doit être inquiété pour ses opinions, même religieuses, pourvu que leur manifestation ne trouble pas l'ordre public établi par la Loi. »", "page": 78}, {"q": "Selon l'article 10 de la DDHC, à quelle condition la manifestation des opinions est-elle protégée ?", "options": ["Si elle ne trouble pas l'ordre public établi par la Loi", "Si elle est approuvée par le gouvernement", "Si elle est partagée par la majorité", "Si elle est exprimée en privé uniquement"], "answer": 0, "explication": "Art. 10 : la liberté d'opinion vaut tant que sa manifestation ne trouble pas l'ordre public.", "page": 78}, {"q": "Selon l'article 11 de la DDHC, quel est « un des droits les plus précieux de l'Homme » ?", "options": ["La libre communication des pensées et des opinions", "Le droit de propriété", "Le droit de vote", "Le droit de porter une arme"], "answer": 0, "explication": "Art. 11 : tout citoyen peut parler, écrire, imprimer librement, sauf à répondre de l'abus de cette liberté dans les cas prévus par la Loi.", "page": 78}, {"q": "Complétez l'article 11 de la DDHC : « tout Citoyen peut donc parler, écrire, imprimer librement, sauf à répondre de … de cette liberté dans les cas déterminés par la Loi. »", "options": ["l'abus", "l'usage", "la perte", "l'absence"], "answer": 0, "explication": "La liberté d'expression a des limites : chacun répond des abus prévus par la loi.", "page": 78}, {"q": "Selon l'article 12 de la DDHC, pour l'avantage de qui la force publique est-elle instituée ?", "options": ["Pour l'avantage de tous, et non pour l'utilité particulière de ceux à qui elle est confiée", "Pour l'avantage du gouvernement", "Pour la protection des seuls élus", "Pour l'utilité des militaires"], "answer": 0, "explication": "Art. 12 : la garantie des droits nécessite une force publique, instituée pour l'avantage de tous.", "page": 78}, {"q": "Selon l'article 13 de la DDHC, comment la contribution commune doit-elle être répartie entre les citoyens ?", "options": ["Également entre tous, en raison de leurs facultés (selon leurs moyens)", "La même somme pour chacun", "Uniquement sur les plus riches", "Uniquement sur les étrangers"], "answer": 0, "explication": "Art. 13 : la contribution commune « doit être également répartie entre tous les citoyens, en raison de leurs facultés ».", "page": 78}, {"q": "Selon l'article 14 de la DDHC, quel droit ont les citoyens concernant la contribution publique (l'impôt) ?", "options": ["Constater sa nécessité, la consentir librement, suivre son emploi et en déterminer la quotité, l'assiette, le recouvrement et la durée", "Refuser de la payer s'ils ne sont pas d'accord", "La fixer chacun individuellement", "Aucun droit : seul le Roi décide"], "answer": 0, "explication": "Art. 14 : les citoyens, par eux-mêmes ou leurs représentants, consentent librement à l'impôt et en suivent l'emploi.", "page": 78}, {"q": "Selon l'article 15 de la DDHC, à qui la use", "impériale"], "answer": 0, "explication": "La France est une République indivisible, laïque, démocratique et sociale, dont les principes sont fixés par la Constitution du 4 octobre 1958.", "page": 79}, {"q": "Quelle Constitution fixe les principes de la République, selon la Charte ?", "options": ["La Constitution du 4 octobre 1958", "La Constitution du 27 octobre 1946", "La Constitution de 1791", "La Constitution du 26 août 1789"], "answer": 0, "explication": "Les principes de la République sont fixés par la Constitution du 4 octobre 1958 (Ve République).", "page": 79}, {"q": "Selon la Charte, que signifie « République indivisible » ?", "options": ["La souveraineté nationale appartient au peuple, qui l'exerce par ses représentants élus et par référendum ; aucune partie du peuple ni aucun individu ne peut se l'attribuer", "La France ne peut pas avoir de régions", "Les religions et l'État sont séparés", "La Nation assure à chacun les conditions de son développement"], "answer": 0, "explication": "Indivisible : la souveraineté appartient au peuple tout entier, exercée par ses élus et par référendum.", "page": 79}, {"q": "Selon la Charte, que signifie « République laïque » ?", "options": ["La République assure la liberté de conscience et garantit le libre exercice des cultes, mais n'en reconnaît, n'en salarie ni n'en subventionne aucun", "La République interdit toutes les religions", "La République finance toutes les religions de manière égale", "La République a une religion officielle"], "answer": 0, "explication": "Laïque : chacun est libre de croire, de ne pas croire ou de changer de religion ; l'État et les religions sont séparés.", "page": 79}, {"q": "Vrai : selon la Charte, laquelle de ces affirmations sur la laïcité est exacte ?", "options": ["Chacun est libre de croire, de ne pas croire, de changer de religion", "Il est interdit de changer de religion", "L'État salarie les ministres des cultes", "Seules certaines croyances sont respectées"], "answer": 0, " ": ["Le droit au respect de sa vie privée", "Le droit de ne pas respecter les lois injustes", "Le droit à un emploi public garanti", "Le droit de ne pas être scolarisé"], "answer": 0, "explication": "La Charte affirme : « Chacun a droit au respect de sa vie privée. »", "page": 80}, {"q": "Selon la Charte, quelles libertés collectives chacun a-t-il ?", "options": ["Créer une association ou y participer, adhérer à un parti et défendre ses droits par l'action syndicale", "Créer sa propre police", "Refuser de payer ses impôts collectivement", "Former un tribunal privé"], "answer": 0, "explication": "Chacun peut créer une association, adhérer librement à un parti et défendre ses intérêts par l'action syndicale.", "page": 80}, {"q": "Selon la Charte, à quelles conditions un citoyen français est-il électeur ?", "options": ["Avoir dix-huit ans et jouir de ses droits civiques", "Avoir vingt-et-un ans", "Payer des impôts", "Être né en France"], "answer": 0, "explication": "Tout citoyen français âgé de 18 ans et jouissant de ses droits civiques est électeur et peut être candidat dans les conditions prévues par la loi.", "page": 80}, {"q": "Complétez la Charte : « Voter est un droit, c'est aussi … »", "options": ["un devoir civique", "une obligation sous peine d'amende", "un privilège réservé aux élus", "une option sans importance"], "answer": 0, "explication": "Selon la Charte, voter est un droit et aussi un devoir civique.", "page": 80}, {"q": "Selon la Charte (partie « Égalité »), tous les citoyens sont égaux devant la loi sans distinction de…", "options": ["Sexe, d'origine, de race ou de religion", "Fortune uniquement", "Diplôme uniquement", "Région uniquement"], "answer": 0, "explication": "Tous les citoyens sont égaux devant la loi, sans distinction de sexe, d'origine, de race ou de religion.", "page": 80}, {"q": "Vrai : selon la Charte, laquelle de ces affirmations sur l'égalité femmes-hommes est exacte ?", "options": ["L'homme et la femme ont dans tous les domaines les s", "Au financement des cultes", "À la rédaction des lois"], "answer": 0, "explication": "Tout citoyen français concourt à la défense et à la cohésion de la Nation.", "page": 80}, {"q": "Selon la Charte, dans quels cas une personne qui a acquis la nationalité française peut-elle en être déchue ?", "options": ["Si elle s'est soustraite à ses obligations de défense ou s'est livrée à des actes contraires aux intérêts fondamentaux de la France", "Si elle ne vote pas à une élection", "Si elle déménage dans une autre région", "Si elle change de religion"], "answer": 0, "explication": "La déchéance de nationalité est possible pour une personne naturalisée qui se soustrait à ses obligations de défense ou agit contre les intérêts fondamentaux de la France.", "page": 80}, {"q": "Selon la Charte, comment chacun contribue-t-il aux dépenses de la Nation ?", "options": ["Par le paiement d'impôts et de cotisations sociales, selon ses capacités financières", "Par un don volontaire", "Uniquement par le travail bénévole", "Par un montant identique pour tous"], "answer": 0, "explication": "Chacun doit contribuer aux dépenses de la Nation, selon ses capacités financières, par les impôts et les cotisations sociales.", "page": 80}, {"q": "Selon la Charte, que garantit la Nation à tous ?", "options": ["La protection de la santé, la sécurité matérielle et le droit à des congés", "Un emploi à vie", "Une maison individuelle", "Un salaire identique pour tous"], "answer": 0, "explication": "La Nation garantit à tous la protection de la santé, la sécurité matérielle et le droit aux congés.", "page": 80}, {"q": "Selon la Charte, quel droit a une personne incapable de travailler en raison de son âge, de son état physique ou mental ou de la situation économique ?", "options": ["Obtenir de la collectivité des moyens convenables d'existence", "Être dispensée de respecter les lois", "Obtenir automatiquement un emploi public", "Aucun droit particulier"], "answer": 0, "explication": "Elle a le droit d' e période de l'histoire de France va de 1492 à 1789 ?", "options": ["Le Moyen Âge", "L'Ancien Régime", "Le Premier Empire", "La Restauration"], "answer": 1, "explication": "L'Ancien Régime s'étend de 1492 à 1789, jusqu'au début de la Révolution française.", "page": 38}, {"q": "Selon la frise, quelle période se situe entre 1789 et 1792 ?", "options": ["La Révolution française et la période révolutionnaire", "La Deuxième République", "Le Second Empire", "La Monarchie de Juillet"], "answer": 0, "explication": "De 1789 à 1792 : Révolution française et période révolutionnaire, avec une monarchie constitutionnelle.", "page": 38}, {"q": "Quel document important est placé en 1789 sur la frise du livret ?", "options": ["Le Code civil", "La DDHC (Déclaration des droits de l'homme et du citoyen)", "La Constitution de la Ve République", "L'édit de Nantes"], "answer": 1, "explication": "La frise associe 1789 à la Déclaration des droits de l'homme et du citoyen (DDHC).", "page": 38}, {"q": "Quel texte la frise associe-t-elle au début du Premier Empire (1804) ?", "options": ["La Charte constitutionnelle", "La loi Taubira", "Le Code civil", "Le traité de Versailles"], "answer": 2, "explication": "Le Code civil est associé au Premier Empire de Napoléon Bonaparte.", "page": 38}, {"q": "Dans quel ordre se succèdent ces régimes au XIXe siècle ?", "options": ["Restauration, Monarchie de Juillet, Deuxième République, Second Empire", "Monarchie de Juillet, Restauration, Second Empire, Deuxième République", "Second Empire, Restauration, Deuxième République, Monarchie de Juillet", "Deuxième République, Restauration, Monarchie de Juillet, Second Empire"], "answer": 0, "explication": "Après le Premier Empire viennent la Restauration (jusqu'en 1830), la Monarchie de Juillet (1830-1848), la Deuxième République (1848-1852) puis le Second Empire (1852-1870).", "page": 38}, {"q": "Selon la frise, quelle période va de 1870 à 1940 ?", "options": ["La Quatrième République", "La Troisième République", 39}, {"q": "Quel roi a promulgué l'édit de Nantes ?", "options": ["Louis XIV", "Henri IV", "Louis XVI", "Charles X"], "answer": 1, "explication": "Henri IV (1553-1610) promulgue l'édit de Nantes.", "page": 39}, {"q": "En quelle année l'édit de Nantes a-t-il été promulgué ?", "options": ["1515", "1598", "1643", "1685"], "answer": 1, "explication": "L'édit de Nantes date de 1598.", "page": 39}, {"q": "À quoi l'édit de Nantes a-t-il mis fin ?", "options": ["À la guerre de Cent Ans", "Aux guerres de religion entre catholiques et protestants", "À la monarchie absolue", "À l'esclavage"], "answer": 1, "explication": "L'édit de Nantes met fin aux guerres de religion entre catholiques et protestants.", "page": 39}, {"q": "Qui était Molière ?", "options": ["Un philosophe des Lumières", "Un dramaturge et comédien du XVIIe siècle", "Un peintre de la cour de Louis XIV", "Un ministre d'Henri IV"], "answer": 1, "explication": "Molière, auteur de théâtre et comédien, a vécu au XVIIe siècle, sous le règne de Louis XIV.", "page": 39}, {"q": "Laquelle de ces œuvres est une comédie de Molière ?", "options": ["« Les Misérables »", "« L'Avare »", "« Alcools »", "« La Vie devant soi »"], "answer": 1, "explication": "Molière est connu pour ses comédies comme « L'Avare » et « Le Bourgeois gentilhomme ».", "page": 39}, {"q": "Quel roi était surnommé le « Roi-Soleil » ?", "options": ["Henri IV", "Louis XVI", "Louis XIV", "Louis-Philippe"], "answer": 2, "explication": "Louis XIV, le « Roi-Soleil », est un roi emblématique de France.", "page": 39}, {"q": "De quelle année à quelle année Louis XIV a-t-il régné ?", "options": ["1589-1610", "1643-1715", "1715-1774", "1774-1792"], "answer": 1, "explication": "Louis XIV règne de 1643 à 1715.", "page": 39}, {"q": "Quel château Louis XIV a-t-il fait construire près de Paris ?", "options": ["Le château de Chambord", "Le château de Fontainebleau", "Le château de Versailles", "Le château de Vincennes"], "answer": 2, "explication": "Louis XIV fait construire le château de Versailles, joyau de l'architecture classique.", "page": 39}, {"q": "Lequel de ces noms n'est PAS cité parmi les philosophes des Lumières dans le livret ?", "options": ["Voltaire", "Rousseau", "Montesquieu", "Molière"], "answer": 3, "explication": "Les philosophes des Lumières cités sont Rousseau, Voltaire, Diderot, Montesquieu, Condorcet, d'Alembert. Molière est un dramaturge du XVIIe siècle.", "page": 39}, {"q": "Pour quoi les philosophes des Lumières se sont-ils battus à travers leurs œuvres ?", "options": ["Pour le renforcement du pouvoir du roi", "Pour la tolérance, la liberté de pensée et le refus de l'arbitraire", "Pour le retour de l'empire", "Pour l'unité religieuse du royaume"], "answer": 1, "explication": "Ils défendent la tolérance, la liberté de pensée et le refus de l'arbitraire ; leur pensée a influencé les idéaux de la Révolution.", "page": 39}, {"q": "Quel philosophe des Lumières a notamment dénoncé l'esclavage selon le livret ?", "options": ["Diderot", "Montesquieu", "Condorcet", "d'Alembert"], "answer": 1, "explication": "Le livret souligne que Montesquieu dénonce l'esclavage.", "page": 39}, {"q": "Quels idéaux de la Révolution française la pensée des Lumières a-t-elle influencés ?", "options": ["Ordre, autorité, tradition", "Liberté, égalité, fraternité", "Travail, famille, patrie", "Unité, foi, roi"], "answer": 1, "explication": "La pensée des Lumières a influencé les idéaux révolutionnaires de liberté, d'égalité et de fraternité.", "page": 39}]}, {"titre": "La Révolution française", "questions": [{"q": "Que s'est-il passé le 14 juillet 1789 ?", "options": ["L'exécution de Louis XVI", "La prise de la Bastille par les Parisiens", "La proclamation de la République", "Le couronnement de Napoléon"], "answer": 1, "explication": "Le 14 juillet 1789, les Parisiens s'emparent de la Bastille : c'est le début de la Révolution française.", "page": 40}, {"q": "Que symbolisait la Bastille ?", "options": ["La puissance de l'Église", "Le pouvoir monarchique arbitraire", "La richesse de la bourgeoisie", "La victoire militaire"], "answer": 1, "explication": "Cette prison royale était le symbole du pouvoir monarchique arbitraire.", "page": 40}, {"q": "Quelle était la fonction de la Bastille en 1789 ?", "options": ["Un palais royal", "Une prison royale", "Une caserne", "Une cathédrale"], "answer": 1, "explication": "La Bastille était une prison royale.", "page": 40}, {"q": "Quel texte, adopté en 1789, est à l'origine de nos valeurs républicaines ?", "options": ["Le Code civil", "La Déclaration des droits de l'homme et du citoyen", "L'édit de Nantes", "La Charte constitutionnelle"], "answer": 1, "explication": "La Déclaration des droits de l'homme et du citoyen de 1789 est à l'origine des valeurs républicaines.", "page": 40}, {"q": "Quel personnage a notamment contribué à l'écriture de la Déclaration des droits de l'homme et du citoyen ?", "options": ["Robespierre", "Le marquis de La Fayette", "Napoléon Bonaparte", "Victor Schoelcher"], "answer": 1, "explication": "Le marquis de La Fayette a contribué à l'écriture de la DDHC.", "page": 40}, {"q": "En quelle année une monarchie constitutionnelle est-elle mise en place, limitant les pouvoirs de Louis XVI ?", "options": ["1789", "1791", "1793", "1804"], "answer": 1, "explication": "En 1791, une monarchie constitutionnelle limite les pouvoirs du roi Louis XVI.", "page": 40}, {"q": "Qu'est-ce qui a dressé le peuple contre Louis XVI ?", "options": ["Sa victoire à Waterloo", "Sa tentative de fuite vers l'étranger et les tensions sociales", "La signature de l'édit de Nantes", "La construction de Versailles"], "answer": 1, "explication": "La tentative de fuite du roi vers l'étranger et les tensions sociales dressent le peuple contre lui.", "page": 40}, {"q": "À quelle date Louis XVI est-il renversé ?", "options": ["Le 14 juillet 1789", "Le 10 août 1792", "Le 21 septembre 1804", "Le 4 octobre 1793"], "answer": 1, "explication": "Louis XVI est renversé le 10 août 1792, puis jugé.", "page": 40}, {"q": "Où et quand Louis XVI a-t-il été guillotiné ?", "options": ["Place de la Bastille, en 1789", "Place de la Concorde, en 1793", "À Versailles, en 1792", "À Reims, en 1791"], "answer": 1, "explication": "Louis XVI est guillotiné sur la place de la Concorde en 1793.", "page": 40}]}, {"titre": "La Première République", "questions": [{"q": "Quand débute la Première République ?", "options": ["1789", "1792", "1799", "1804"], "answer": 1, "explication": "La Première République débute en 1792, à la fin de la monarchie constitutionnelle ; elle est l'héritière de la Révolution.", "page": 40}, {"q": "Quelles menaces la France affronte-t-elle sous la Première République ?", "options": ["Une crise économique mondiale", "Des révoltes à l'intérieur et des guerres avec d'autres pays", "Une épidémie de peste", "Une guerre coloniale en Algérie"], "answer": 1, "explication": "La France fait face à des révoltes intérieures et à des guerres extérieures.", "page": 40}, {"q": "Comment s'appelle le régime mis en place pour surveiller les ennemis de la Révolution, où les suspects de trahison sont guillotinés ?", "options": ["La Restauration", "La Terreur", "Le Directoire", "Le Consulat"], "answer": 1, "explication": "Le gouvernement met en place la Terreur : les personnes soupçonnées d'être des traîtres sont guillotinées.", "page": 40}, {"q": "Quel homme de la Révolution défend l'égalité et la République mais dirige aussi la Terreur ?", "options": ["La Fayette", "Maximilien Robespierre", "Condorcet", "Louis-Philippe"], "answer": 1, "explication": "Maximilien Robespierre défend l'égalité et la République, mais dirige aussi la Terreur.", "page": 40}, {"q": "En quelle année Napoléon Bonaparte prend-il le pouvoir ?", "options": ["1792", "1799", "1804", "1815"], "answer": 1, "explication": "Napoléon Bonaparte prend le pouvoir en 1799, puis met fin à la Première République en 1804.", "page": 40}]}, {"titre": "Le Premier Empire", "questions": [{"q": "En quelle année Napoléon Bonaparte devient-il empereur ?", "options": ["1799", "1802", "1804", "1815"], "answer": 2, "explication": "Napoléon devient empereur en 1804 et proclame le Premier Empire.", "page": 41}, {"q": "Pendant environ combien de temps Napoléon gouverne-t-il la France ?", "options": ["5 ans", "15 ans", "25 ans", "40 ans"], "answer": 1, "explication": "Napoléon gouverne la France pendant environ 15 ans.", "page": 41}, {"q": "Laquelle de ces créations est due à Napoléon Bonaparte ?", "options": ["La Sécurité sociale", "Le Code civil", "La Société des Nations", "L'école gratuite et obligatoire"], "answer": 1, "explication": "Napoléon est à l'origine du Code civil, de la Banque de France et de la création des préfets.", "page": 41}, {"q": "Vrai : laquelle de ces affirmations sur Napoléon est exacte d'après le livret ?", "options": ["Il a créé les préfets et la Banque de France", "Il a aboli la peine de mort", "Il a promulgué l'édit de Nantes", "Il a fait construire Versailles"], "answer": 0, "explication": "Ses réformes (Code civil, Banque de France, préfets) structurent l'État tel qu'on le connaît aujourd'hui.", "page": 41}, {"q": "Comment Napoléon centralise-t-il le pouvoir ?", "options": ["En organisant des référendums réguliers", "En contrôlant la presse et les opposants", "En donnant plus de pouvoir au Parlement", "En créant des syndicats"], "answer": 1, "explication": "Il centralise le pouvoir en contrôlant la presse et les opposants, et mène de nombreuses guerres en Europe.", "page": 41}, {"q": "Que fait Napoléon en 1802 concernant l'esclavage ?", "options": ["Il l'abolit définitivement", "Il le rétablit", "Il le reconnaît comme crime contre l'humanité", "Il crée une journée de commémoration"], "answer": 1, "explication": "Napoléon rétablit l'esclavage en 1802, puis abolit la traite des Noirs en 1815.", "page": 41}, {"q": "En quelle année Napoléon abolit-il la traite des Noirs ?", "options": ["1802", "1815", "1848", "2001"], "answer": 1, "explication": "La traite des Noirs est abolie par Napoléon en 1815 (l'esclavage lui-même sera aboli en 1848).", "page": 41}, {"q": "Après quelle bataille Napoléon abdique-t-il définitivement en 1815 ?", "options": ["Austerlitz", "Waterloo", "Verdun", "Valmy"], "answer": 1, "explication": "Affaibli par ses défaites, Napoléon abdique définitivement en 1815 après la bataille de Waterloo.", "page": 41}]}, {"titre": "La Restauration et la Monarchie de Juillet", "questions": [{"q": "Avec quel roi la Restauration de la monarchie commence-t-elle en 1815 ?", "options": ["Louis XVI", "Louis XVIII", "Charles X", "Louis-Philippe"], "answer": 1, "explication": "La Restauration commence en 1815 avec le retour de Louis XVIII.", "page": 41}, {"q": "Quel texte Louis XVIII conserve-t-il, qui protège des libertés comme la presse ou l'élection du Parlement ?", "options": ["Le Code civil", "La Charte constitutionnelle", "L'édit de Nantes", "La Constitution de 1958"], "answer": 1, "explication": "Louis XVIII conserve la Charte constitutionnelle, mais adopte aussi des mesures conservatrices (rôle de l'Église renforcé, surveillance des opposants).", "page": 41}, {"q": "Quel roi succède à Louis XVIII en 1824 ?", "options": ["Louis-Philippe", "Charles X", "Napoléon III", "Henri IV"], "answer": 1, "explication": "Charles X succède à Louis XVIII en 1824.", "page": 41}, {"q": "Pourquoi la population de Paris se révolte-t-elle en 1830 ?", "options": ["À cause de la défaite contre la Prusse", "À cause des limitations trop importantes des libertés", "À cause de la mort du roi", "À cause de la guerre d'Algérie"], "answer": 1, "explication": "En 1830, les Parisiens se révoltent contre les limitations trop importantes des libertés ; la Restauration prend fin.", "page": 41}, {"q": "Comment s'appelle la monarchie plus libérale qui commence en 1830 ?", "options": ["La Restauration", "La Monarchie de Juillet", "La monarchie absolue", "Le Second Empire"], "answer": 1, "explication": "La Monarchie de Juillet (1830-1848) commence avec l'arrivée au pouvoir du roi Louis-Philippe.", "page": 41}, {"q": "Quel roi arrive au pouvoir en 1830 ?", "options": ["Charles X", "Louis XVIII", "Louis-Philippe", "Louis XVI"], "answer": 2, "explication": "Louis-Philippe, « roi des Français », règne sous la Monarchie de Juillet.", "page": 41}, {"q": "Sur quel groupe social le pouvoir de la Monarchie de Juillet s'appuie-t-il surtout ?", "options": ["La noblesse", "Le clergé", "La bourgeoisie", "Les ouvriers"], "answer": 2, "explication": "Le pouvoir s'appuie surtout sur la bourgeoisie ; le droit de vote reste limité aux plus riches.", "page": 41}, {"q": "Qu'est-ce qui provoque la révolution de 1848 qui met fin à la Monarchie de Juillet ?", "options": ["La défaite de Waterloo", "La hausse des inégalités et le refus d'élargir le droit de vote", "La séparation des Églises et de l'État", "L'invasion allemande"], "answer": 1, "explication": "Les inégalités sociales augmentent et le refus d'élargir le droit de vote provoque des tensions : la révolution de 1848 met fin au régime.", "page": 41}]}, {"titre": "La Deuxième République et l'esclavage", "questions": [{"q": "Quelles sont les dates de la Deuxième République ?", "options": ["1830-1848", "1848-1852", "1852-1870", "1870-1940"], "answer": 1, "explication": "La Deuxième République dure de 1848 à 1852, après la Restauration et la Monarchie de Juillet.", "page": 42}, {"q": "Quel grand événement marque particulièrement la Deuxième République ?", "options": ["L'abolition de la peine de mort", "L'abolition de l'esclavage en 1848", "Le droit de vote des femmes", "La création du Code civil"], "answer": 1, "explication": "La Deuxième République est particulièrement marquée par l'abolition de l'esclavage en 1848.", "page": 42}, {"q": "Qui a rédigé le décret de 1848 qui met fin à l'esclavage ?", "options": ["Victor Hugo", "Victor Schoelcher", "Jules Ferry", "Léon Gambetta"], "answer": 1, "explication": "Victor Schoelcher, sous-secrétaire d'État chargé des colonies, rédige le décret d'abolition.", "page": 42}, {"q": "Quelle fonction occupait Victor Schoelcher en 1848 ?", "options": ["Ministre de la Justice", "Sous-secrétaire d'État chargé des colonies", "Président de la République", "Président du Conseil"], "answer": 1, "explication": "Victor Schoelcher était sous-secrétaire d'État chargé des colonies.", "page": 42}, {"q": "Selon le livret, combien d'Africains ont été déportés de force vers les colonies françaises par la traite ?", "options": ["120 000", "1,2 million", "12 millions", "500 000"], "answer": 1, "explication": "La traite a impliqué la déportation forcée d'1,2 million d'Africains vers les colonies.", "page": 42}, {"q": "À partir de quel siècle l'esclavage s'est-il développé autour de la traite transatlantique, selon le livret ?", "options": ["XVe siècle", "XVIIe siècle", "XIXe siècle", "XIIe siècle"], "answer": 1, "explication": "L'esclavage s'est développé à partir du XVIIe siècle, autour de la traite transatlantique et de l'esclavage colonial.", "page": 42}, {"q": "Lequel de ces territoires n'est PAS cité parmi les colonies où des Africains ont été déportés ?", "options": ["Saint-Domingue", "La Réunion", "La Guyane", "La Corse"], "answer": 3, "explication": "Les colonies citées sont les Antilles (Saint-Domingue, Martinique, Guadeloupe), la Réunion et la Guyane.", "page": 42}, {"q": "Dans quels lieux les personnes réduites en esclavage travaillaient-elles principalement ?", "options": ["Dans les mines de charbon", "Dans les plantations (canne à sucre, café…)", "Dans les usines textiles", "Dans les ports de commerce"], "answer": 1, "explication": "Elles travaillaient surtout dans les plantations, dans des conditions extrêmement difficiles.", "page": 42}, {"q": "Quel était le principal port français impliqué dans la traite transatlantique ?", "options": ["Marseille", "Le Havre", "Nantes", "Brest"], "answer": 2, "explication": "Nantes était le principal port français de la traite transatlantique.", "page": 42}, {"q": "Quelle loi de 2001 reconnaît la traite et l'esclavage comme un crime contre l'humanité ?", "options": ["La loi Veil", "La loi Taubira", "La loi Neuwirth", "La loi Ferry"], "answer": 1, "explication": "La loi Taubira de 2001 reconnaît la traite et l'esclavage comme un crime contre l'humanité.", "page": 42}, {"q": "Quel jour est commémorée chaque année la journée nationale des mémoires de la traite, de l'esclavage et de leurs abolitions ?", "options": ["Le 8 mai", "Le 10 mai", "Le 14 juillet", "Le 11 novembre"], "answer": 1, "explication": "Cette journée nationale est commémorée chaque année le 10 mai.", "page": 42}, {"q": "Victor Hugo (1802-1885) s'est engagé contre…", "options": ["la République et la laïcité", "les inégalités sociales et la peine de mort", "la liberté de la presse", "l'abolition de l'esclavage"], "answer": 1, "explication": "Victor Hugo, l'un des plus grands écrivains français, s'est engagé contre les inégalités sociales et la peine de mort.", "page": 42}, {"q": "Lequel de ces livres a été écrit par Victor Hugo ?", "options": ["« Les Misérables »", "« Le Bourgeois gentilhomme »", "« Mémoires d'Hadrien »", "« Les Racines du ciel »"], "answer": 0, "explication": "Victor Hugo a écrit « Les Misérables » et « Notre-Dame de Paris ».", "page": 42}]}, {"titre": "Le Second Empire", "questions": [{"q": "Quel lien de parenté unit Louis-Napoléon Bonaparte à Napoléon Ier ?", "options": ["Il est son fils", "Il est son neveu", "Il est son frère", "Il est son petit-fils"], "answer": 1, "explication": "Louis-Napoléon Bonaparte est le neveu de Napoléon Ier.", "page": 42}, {"q": "Comment Louis-Napoléon Bonaparte, président élu, devient-il empereur ?", "options": ["Par un référendum en 1848", "Par un coup d'État en décembre 1851", "Après la bataille de Waterloo", "Par l'abdication de Louis-Philippe"], "answer": 1, "explication": "Il organise un coup d'État en décembre 1851 et devient empereur en 1852.", "page": 42}, {"q": "Sous quel nom Louis-Napoléon Bonaparte devient-il empereur en 1852 ?", "options": ["Napoléon II", "Napoléon III", "Louis XVIII", "Charles X"], "answer": 1, "explication": "Il devient empereur sous le nom de Napoléon III en 1852.", "page": 42}, {"q": "Comment le Second Empire évolue-t-il dans les années 1860 ?", "options": ["Il devient une monarchie absolue", "La population obtient plus de libertés et le Parlement plus de pouvoirs", "Il supprime le Parlement", "Il rétablit l'esclavage"], "answer": 1, "explication": "Autoritaire au début, le régime évolue dans les années 1860 ; l'économie se modernise et la France s'ouvre à l'Europe.", "page": 42}, {"q": "Comment le Second Empire prend-il fin en 1870 ?", "options": ["Par une révolution à Paris", "Après la défaite de l'armée française contre la Prusse", "Par la mort de l'empereur", "Après la bataille de Waterloo"], "answer": 1, "explication": "Le Second Empire (1852-1870) prend fin après la défaite contre la Prusse.", "page": 42}]}, {"titre": "La Troisième République", "questions": [{"q": "Quelles sont les dates de la Troisième République ?", "options": ["1848-1852", "1870-1940", "1946-1958", "1852-1870"], "answer": 1, "explication": "La Troisième République (1870-1940) installe dans la durée le régime républicain.", "page": 43}, {"q": "Grâce à quel ministre l'école publique est-elle devenue gratuite, laïque et obligatoire ?", "options": ["Jules Ferry", "Léon Gambetta", "Georges Clemenceau", "Victor Schoelcher"], "answer": 0, "explication": "Ce sont les lois de Jules Ferry, ministre de l'Instruction publique.", "page": 43}, {"q": "En quelle année l'école publique gratuite est-elle généralisée ?", "options": ["1871", "1881", "1882", "1905"], "answer": 1, "explication": "L'école publique gratuite est généralisée en 1881, puis laïque et obligatoire en 1882.", "page": 43}, {"q": "En quelle année l'école devient-elle laïque et obligatoire ?", "options": ["1881", "1882", "1901", "1905"], "answer": 1, "explication": "En 1882, l'école devient laïque et obligatoire grâce aux lois de Jules Ferry.", "page": 43}, {"q": "Quelle loi date du 29 juillet 1881 ?", "options": ["La loi sur la liberté d'association", "La loi sur la liberté de la presse", "La loi sur les syndicats", "La loi sur la laïcité"], "answer": 1, "explication": "La loi du 29 juillet 1881 porte sur la liberté de la presse.", "page": 43}, {"q": "Quelle loi du 21 mars 1884 est adoptée sous la Troisième République ?", "options": ["Elle autorise la création des syndicats", "Elle établit l'école obligatoire", "Elle sépare les Églises et l'État", "Elle abolit la peine de mort"], "answer": 0, "explication": "La loi du 21 mars 1884 autorise la création des syndicats.", "page": 43}, {"q": "De quelle date est la loi sur la liberté d'association ?", "options": ["29 juillet 1881", "21 mars 1884", "1er juillet 1901", "9 décembre 1905"], "answer": 2, "explication": "La loi sur la liberté d'association date du 1er juillet 1901.", "page": 43}, {"q": "Complétez : la loi du 9 décembre 1905 porte sur…", "options": ["la liberté de la presse", "la séparation des Églises et de l'État", "la création des syndicats", "le droit de vote des femmes"], "answer": 1, "explication": "La loi du 9 décembre 1905 sépare les Églises et l'État : c'est la loi sur la laïcité.", "page": 43}]}, {"titre": "La Première Guerre mondiale", "questions": [{"q": "Comment appelle-t-on aussi la Première Guerre mondiale (1914-1918) ?", "options": ["La guerre de Cent Ans", "La Grande Guerre", "La guerre froide", "La drôle de guerre"], "answer": 1, "explication": "La Première Guerre mondiale est aussi appelée « la Grande Guerre ».", "page": 43}, {"q": "Quand la Première Guerre mondiale débute-t-elle ?", "options": ["En juillet 1914", "En septembre 1939", "En août 1870", "En novembre 1918"], "answer": 0, "explication": "Elle débute en juillet 1914 et s'achève avec l'armistice du 11 novembre 1918.", "page": 43}, {"q": "Quelle date marque l'armistice de la Première Guerre mondiale ?", "options": ["8 mai 1945", "11 novembre 1918", "28 juin 1919", "14 juillet 1918"], "answer": 1, "explication": "L'armistice du 11 novembre 1918 met fin aux combats ; ce jour est férié chaque année.", "page": 43}, {"q": "Qui dirigeait la France, comme président du Conseil, lors de la victoire de 1918 ?", "options": ["Charles de Gaulle", "Georges Clemenceau", "Jules Ferry", "Philippe Pétain"], "answer": 1, "explication": "La France est alors dirigée par le président du Conseil Georges Clemenceau.", "page": 43}, {"q": "Lequel de ces pays était un allié de la France pendant la Première Guerre mondiale selon le livret ?", "options": ["L'empire ottoman", "L'empire austro-hongrois", "L'Italie", "L'empire allemand"], "answer": 2, "explication": "Les alliés de la France : Grande-Bretagne, Italie et États-Unis ; en face : l'empire allemand, l'empire austro-hongrois et l'empire ottoman.", "page": 43}, {"q": "Combien de morts la Première Guerre mondiale a-t-elle causé au total, et combien pour la France ?", "options": ["10 millions, dont 1,45 million pour la France", "50 millions, dont 600 000 pour la France", "1,45 million, dont 10 000 pour la France", "20 millions, dont 5 millions pour la France"], "answer": 0, "explication": "La guerre a causé 10 millions de morts, dont 1,45 million de Français.", "page": 43}, {"q": "Laquelle de ces conséquences de la Première Guerre mondiale est citée par le livret ?", "options": ["La création de l'Union européenne", "La révolution bolchévique en Russie, qui devient l'URSS", "La décolonisation de l'Algérie", "La chute du Second Empire"], "answer": 1, "explication": "L'Europe sort affaiblie : frontières modifiées, nouveaux pays, révolution bolchévique (URSS) et montée en puissance des États-Unis.", "page": 43}, {"q": "Quel traité, signé le 28 juin 1919, met fin à la Première Guerre mondiale ?", "options": ["Le traité de Versailles", "Le traité de Paris", "Le traité de Rome", "L'édit de Nantes"], "answer": 0, "explication": "Le traité de Versailles du 28 juin 1919 met fin à la guerre.", "page": ire", "Une assurance obligatoire pour les propriétaires"], "answer": 0, "explication": "L'accession sociale à la propriété aide les foyers à revenus modestes à acheter leur résidence principale.", "page": 62}]}, {"titre": "Se loger : être locataire", "questions": [{"q": "Quelle part de la population française est locataire de son logement ?", "options": ["40 %", "20 %", "60 %", "75 %"], "answer": 0, "explication": "En France, 40 % de la population est locataire de son logement.", "page": 62}, {"q": "Parmi les logements loués en France, quelle part est constituée de logements publics (sociaux) ?", "options": ["Un peu moins de la moitié", "Environ 10 %", "Plus des trois quarts", "La totalité"], "answer": 0, "explication": "Un peu moins de la moitié des logements loués sont des logements publics (sociaux).", "page": 62}, {"q": "Comment s'appelle le contrat de location signé entre le propriétaire et le locataire ?", "options": ["Le bail", "L'acte notarié", "Le permis de construire", "La carte grise"], "answer": 0, "explication": "Le contrat de location s'appelle le bail ; il fixe par exemple le prix du loyer convenu entre propriétaire et locataire.", "page": 62}, {"q": "Un locataire veut repeindre les murs de son appartement. Que dit la règle ?", "options": ["Il peut le faire, ce sont des travaux décoratifs", "Il doit obtenir un permis de construire", "Il doit demander l'autorisation de la mairie", "C'est interdit à tout locataire"], "answer": 0, "explication": "Le locataire peut faire des travaux décoratifs comme peindre les murs ; pour d'autres travaux, il doit demander la permission au propriétaire.", "page": 62}, {"q": "Un locataire veut faire des travaux autres que décoratifs (par exemple abattre une cloison). Que doit-il faire ?", "options": ["Demander la permission au propriétaire", "Prévenir seulement ses voisins", "Rien, il est libre", "Demander l'accord du notaire"], "answer": 0, "explication": "Selon l'article 7 de la loi du 6 juillet 1989, les travaux autres let session = null, timer = null;

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function prep(q) { return { q, order: shuffle([0, 1, 2, 3]), chosen: null }; }
function tally(qs) {
  return { n: qs.length, g: qs.filter(q => store[q.id] === 1).length, r: qs.filter(q => store[q.id] === 0).length };
}
function row(attrs, name, t, sub) {
  return `<button class="theme" ${attrs}><span class="name">${esc(name)}${sub ? `<small>${esc(sub)}</small>` : ""}</span><span class="count">${t.g}/${t.n}</span>
    <span class="bar"><i class="g" style="width:${t.g / t.n * 100}%"></i><i class="r" style="width:${t.r / t.n * 100}%"></i></span></button>`;
}
function setTab(t) { tab = t; try { localStorage.setItem(KEY + "-tab", t); } catch (e) {} home(); }
function confirmBox(msg, yesLabel, noLabel, onYes) {
  const box = app.querySelector("#confirmBox");
  box.innerHTML = `<div class="confirm"><p>${msg}</p><div class="row"><button class="btn" id="yes">${yesLabel}</button><button class="btn ghost" id="no">${noLabel}</button></div></div>`;
  box.querySelector("#yes").onclick = onYes;
  box.querySelector("#no").onclick = () => box.innerHTML = "";
}

function home() {
  clearInterval(timer); session = null;
  const bankQs = QS.filter(q => q.bank === tab);
  const t = tally(bankQs), seen = bankQs.filter(q => q.id in store).length;
  const official = tab === "o";
  const groups = official
    ? DATA.official.map((th, i) => row(`data-g="${i}"`, th.theme, tally(bankQs.filter(q => q.group === i))))
    : DATA.livret.map((p, i) => row(`data-g="${i}"`, p.partie, tally(bankQs.filter(q => q.group === i)), p.sections.length + " chapitres"));
  app.innerHTML = `
    <header style="display:flex;flex-direction:column;gap:10px">
      <div class="tricolore"><span></span><span></span><span></span></div>
      <p class="eyebrow">Examen civique · carte de résident</p>
      <h1>${official ? `Les ${bankQs.length} questions de la liste officielle` : `${bankQs.length} questions sur tout le livret du citoyen`}</h1>
      <p class="lede">${official
        ? "Les questions de connaissance publiées par le ministère. Une seule bonne réponse sur quatre ; l'ordre des réponses change à chaque passage."
        : "Chaque date, chiffre, nom et règle du Livret du citoyen 2026, chapitre par chapitre. Chaque correction renvoie à la page du livret."}</p>
    </header>
    <nav class="tabs" role="tablist">
      <button role="tab" aria-selected="${official}" data-tab="o">Liste officielle</button>
      <button role="tab" aria-selected="${!official}" data-tab="l">Livret du citoyen</button>
    </nav>
    <div class="stats">
      <div class="stat"><b>${seen}</b><span>vues sur ${bankQs.length}</span></div>
      <div class="stat"><b style="color:var(--ok)">${t.g}</b><span>réussies</span></div>
      <div class="stat"><b style="color:var(--ko)">${t.r}</b><span>à revoir</span></div>
    </div>
    <div class="row">
      <button class="btn" id="exam">${official ? "Examen blanc · 40 questions" : "Série mélangée · 40 questions"}</button>
      <button class="btn ghost" id="errs" ${t.r ? "" : "disabled"}>Revoir mes erreurs (${t.r})</button>
    </div>
    <div class="row"><button class="btn ghost" id="unseen" ${seen < bankQs.length ? "" : "disabled"}>Questions jamais vues (${bankQs.length - seen})</button></div>
    <section style="display:flex;flex-direction:column;gap:10px">
      <h2>${official ? "S'entraîner par thème" : "S'entraîner par partie du livret"}</h2>
      <div class="themes">${groups.join("")}</div>
      <div class="legend"><span style="--c:var(--ok)">Dernière réponse juste</span><span style="--c:var(--ko)">Dernière réponse fausse</span></div>
    </section>
    <p class="note">${official
      ? "L'examen réel comporte aussi 12 mises en situation qui ne sont pas publiques ; l'examen blanc tire 40 questions de connaissance au hasard. Seuil de réussite : 32/40 (80 %), en 45 minutes."
      : "Questions rédigées à partir du Livret du citoyen 2026 (édition mai 2026) pour réviser tout son contenu. Elles ne sont pas des questions officielles d'examen."}</p>
    <div class="row"><button class="link" id="reset">Effacer ma progression</button></div>
    <div id="confirmBox"></div>`;
  app.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => setTab(b.dataset.tab));
  app.querySelectorAll("[data-g]").forEach(b => b.onclick = () => {
    const g = +b.dataset.g;
    if (official) start("theme", shuffle(bankQs.filter(q => q.group === g)), DATA.official[g].theme);
    else part(g);
  });
  app.querySelector("#exam").onclick = () => official
    ? start("exam", shuffle(bankQs).slice(0, 40), "Examen blanc")
    : start("theme", shuffle(bankQs).slice(0, 40), "Série mélangée · livret");
  app.querySelector("#errs").onclick = () => start("theme", shuffle(bankQs.filter(q => store[q.id] === 0)), "Mes erreurs");
  app.querySelector("#unseen").onclick = () => start("theme", shuffle(bankQs.filter(q => !(q.id in store))).slice(0, 40), "Jamais vues");
  app.querySelector("#reset").onclick = () => confirmBox("Effacer toutes les réponses enregistrées sur cet appareil (les deux onglets) ?", "Effacer", "Annuler", () => { store = {}; save(); home(); });
  window.scrollTo(0, 0);
}

function part(pi) {
  const p = DATA.livret[pi];
  const qs = QS.filter(q => q.bank === "l" && q.group === pi);
  const t = tally(qs);
  const pages = qs.map(q => q.page).filter(Boolean);
  const rows = p.sections.map((s, si) => row(`data-s="${si}"`, s.titre, tally(qs.filter(q => q.sec === si))));
  app.innerHTML = `
    <div class="top"><button class="link" id="back">← Accueil</button><span class="meta">${pages.length ? "p. " + Math.min(...pages) + "–" + Math.max(...pages) : ""}</span></div>
    <header style="display:flex;flex-direction:column;gap:8px">
      <p class="eyebrow">Livret du citoyen</p>
      <h1>${esc(p.partie)}</h1>
      <p class="lede">${t.n} questions · ${t.g} réussies · ${t.r} à revoir</p>
    </header>
    <div class="row">
      <button class="btn" id="all">Toute la partie, dans l'ordre du livret</button>
      <button class="btn ghost" id="mix">Toute la partie, mélangée</button>
    </div>
    <section style="display:flex;flex-direction:column;gap:10px">
      <h2>Chapitres</h2>
      <div class="themes">${rows.join("")}</div>
    </section>`;
  app.querySelector("#back").onclick = home;
  app.querySelector("#all").onclick = () => start("theme", qs, p.partie);
  app.querySelector("#mix").onclick = () => start("theme", shuffle(qs), p.partie);
  app.querySelectorAll("[data-s]").forEach(b => b.onclick = () => {
    const si = +b.dataset.s; start("theme", qs.filter(q => q.sec === si), p.sections[si].titre);
  });
  window.scrollTo(0, 0);
}

function start(mode, list, label) {
  if (!list.length) return;
  session = { mode, label, items: list.map(prep), i: 0, end: mode === "exam" ? Date.now() + 45 * 60000 : null };
  clearInterval(timer);
  if (mode === "exam") timer = setInterval(tick, 1000);
  show();
}

function tick() {
  const el = document.getElementById("clock"); if (!session || !el) return;
  const s = Math.max(0, Math.round((session.end - Date.now()) / 1000));
  el.textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  el.classList.toggle("warn", s < 300);
  if (s === 0) finish();
}

function show() {
  const S = session, it = S.items[S.i], q = it.q, n = S.items.length, exam = S.mode === "exam";
  const answered = it.chosen !== null;
  const opts = it.order.map((oi, k) => {
    let cls = "opt";
    if (answered && !exam) { if (oi === q.answer) cls += " good"; else if (oi === it.chosen) cls += " bad"; }
    else if (answered && exam && oi === it.chosen) cls += " chosen";
    return `<button class="${cls}" data-o="${oi}" ${answered && !exam ? "disabled" : ""}><span class="k">${L[k]}</span><span>${esc(q.options[oi])}</span></button>`;
  }).join("");
  let fb = "";
  if (answered && !exam) {
    const ok = it.chosen === q.answer;
    const src = !q.source ? "" : /^https?:/.test(q.source)
      ? `<a href="${esc(q.source)}" target="_blank" rel="noopener">Source</a>`
      : `<span class="note">Source : ${esc(q.source)}</span>`;
    fb = `<div class="feedback" style="--c:var(${ok ? "--ok" : "--ko"})"><span class="verdict">${ok ? "Bonne réponse" : "Réponse : " + esc(q.options[q.answer])}</span>
      <p>${esc(q.explication)}</p>${src}</div>`;
  }
  const last = S.i === n - 1;
  const done = S.items.filter(x => x.chosen !== null).length;
  app.innerHTML = `
    <div class="top"><button class="link" id="quit">← Accueil</button>
      ${exam ? `<span class="meta" id="clock">45:00</span>` : ""}<span class="meta">${S.i + 1} / ${n}</span></div>
    <div class="progress"><i style="width:${(S.i + (answered ? 1 : 0)) / n * 100}%"></i></div>
    <article class="card">
      <p class="eyebrow">${esc(q.sub ? q.label + " · " + q.sub : q.label)}</p>
      <h2>${esc(q.q)}</h2>
      <div class="opts">${opts}</div>
      ${fb}
    </article>
    <div class="row">
      ${S.i > 0 && exam ? `<button class="btn ghost" id="prev">Précédente</button>` : ""}
      <button class="btn" id="next" ${answered ? "" : "disabled"}>${last ? (exam ? "Terminer l'examen" : "Voir le bilan") : "Question suivante"}</button>
    </div>
    ${!exam && !last && done ? `<div class="row"><button class="link" id="stop">Arrêter ici et voir le bilan (${done} répondues)</button></div>` : ""}
    <div id="confirmBox"></div>`;
  if (exam) tick();
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    if (it.chosen !== null && !exam) return;
    it.chosen = +b.dataset.o;
    if (!exam) rec(q.id, it.chosen === q.answer);
    show();
  });
  app.querySelector("#next").onclick = () => { if (last) finish(); else { S.i++; show(); window.scrollTo(0, 0); } };
  const prev = app.querySelector("#prev"); if (prev) prev.onclick = () => { S.i--; show(); };
  const stop = app.querySelector("#stop"); if (stop) stop.onclick = () => finish(true);
  app.querySelector("#quit").onclick = () => confirmBox(
    `Quitter cette série ? Les réponses déjà données ${exam ? "à l'examen blanc ne seront pas comptées" : "restent enregistrées"}.`,
    "Quitter", "Continuer", home);
}

function finish(partial) {
  clearInterval(timer);
  const S = session, exam = S.mode === "exam";
  if (exam) S.items.forEach(it => { if (it.chosen !== null) rec(it.q.id, it.chosen === it.q.answer); });
  const items = partial ? S.items.filter(it => it.chosen !== null) : S.items;
  const good = items.filter(it => it.chosen === it.q.answer).length, n = items.length;
  const pass = exam ? good >= 32 : good / Math.max(1, n) >= 0.8;
  const wrong = items.filter(it => it.chosen !== it.q.answer);
  const review = wrong.map(it => `<div class="ritem" style="--c:var(--ko)"><span class="q">${esc(it.q.q)}</span>
      <span class="a">${it.chosen === null ? "Sans réponse" : "Ta réponse : " + esc(it.q.options[it.chosen])}</span>
      <span class="a"><b>Bonne réponse : ${esc(it.q.options[it.q.answer])}</b></span>
      <span class="note">${esc(it.q.explication)}${it.q.page ? " (livret p. " + it.q.page + ")" : ""}</span></div>`).join("");
  app.innerHTML = `
    <p class="eyebrow">${esc(S.label)}</p>
    <div style="display:flex;align-items:end;gap:14px;flex-wrap:wrap"><span class="score">${good}<small> / ${n}</small></span>
      <span class="pill" style="--c:var(${pass ? "--ok" : "--ko"});--c-soft:var(${pass ? "--ok-soft" : "--ko-soft"})">${exam ? (pass ? "Réussi (32 minimum)" : "Non réussi (32 minimum)") : (pass ? "Au-dessus de 80 %" : "Sous les 80 %")}</span></div>
    <div class="row"><button class="btn" id="home">Accueil</button>${wrong.length ? `<button class="btn ghost" id="again">Refaire les ${wrong.length} erreurs</button>` : ""}</div>
    ${wrong.length ? `<h2>À revoir</h2><div class="review">${review}</div>` : `<p class="lede">Aucune erreur sur cette série.</p>`}`;
  app.querySelector("#home").onclick = home;
  const ag = app.querySelector("#again"); if (ag) ag.onclick = () => start("theme", shuffle(wrong.map(it => it.q)), "Mes erreurs");
  window.scrollTo(0, 0);
}

home();

</script>

</body>
</html>
