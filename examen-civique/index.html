0"}, {"q": "Quelle chaîne de montagnes est située entre la France et l’Espagne ?", "options": ["Les Pyrénées", "Les Alpes", "Le Jura", "Les Vosges"], "answer": 0, "explication": "Les Pyrénées se situent entre la France et l'Espagne.", "source": "Livret du citoyen 2026, p. 51"}, {"q": "Quelle île française se trouve dans l'océan Indien ?", "options": ["La Réunion", "La Corse", "La Martinique", "La Guadeloupe"], "answer": 0, "explication": "La Réunion est une île volcanique de l'océan Indien, à l'est de Madagascar ; la Martinique et la Guadeloupe sont dans les Caraïbes.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/les-regions-fran%C3%A7aises/la-reunion/"}, {"q": "Quelle est la population approximative de la France en 2025 ?", "options": ["Environ 38 millions d'habitants", "Environ 98 millions d'habitants", "Environ 68,6 millions d'habitants", "Environ 150 millions d'habitants"], "answer": 2, "explication": "En 2025, la France compte 68,6 millions d'habitants, en métropole et outre-mer.", "source": "Livret du citoyen 2026, p. 49"}, {"q": "Quel fleuve traverse Paris ?", "options": ["La Seine", "La Loire", "Le Rhône", "La Garonne"], "answer": 0, "explication": "La Seine traverse Paris, la capitale de la France.", "source": "Livret du citoyen 2026, p. 51"}, {"q": "Lequel de ces pays partage des frontières terrestres avec la France ?", "options": ["La Suisse", "Le Danemark", "La Pologne", "Le Royaume-Uni"], "answer": 0, "explication": "La Suisse fait partie des 8 pays qui partagent une frontière terrestre avec la France métropolitaine ; le Royaume-Uni en est séparé par la Manche.", "source": "Livret du citoyen 2026, p. 49"}, {"q": "Quel pays a une frontière avec la France métropolitaine au nord-est ?", "options": ["L'Espagne", "Andorre", "L'Allemagne", "L'Italie"], "answer": 2, "explication": "L'Allemagne, comme la Belgique et le Luxembourg, est voisine de la France au nord-est ; l'Espagne et Andorre sont au sud, l'Italie au sud-est.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/atlas-de-la-france/les-frontieres-de-la-france/"}, {"q": "Où se trouvent les principales activités économiques en France ?", "options": ["Dans les zones de montagne", "Dans les petits villages ruraux", "Uniquement dans les ports", "Dans les grandes métropoles"], "answer": 3, "explication": "La population, les emplois, les richesses et les sièges d'entreprises se concentrent dans les métropoles : c'est la métropolisation.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/atlas-de-la-france/la-france-aire-urbaine-et-metropolisation/"}, {"q": "Parmi ces pays, lequel attire le plus de visiteurs chaque année ?", "options": ["L'Allemagne", "La France", "Le Portugal", "La Belgique"], "answer": 1, "explication": "Grâce à sa culture et à son patrimoine, la France est la première destination touristique au monde.", "source": "Livret du citoyen 2026, p. 53"}, {"q": "Où habite la majorité des Français ?", "options": ["À la campagne", "En montagne", "Dans les territoires d'outre-mer", "En ville"], "answer": 3, "explication": "Environ 81 % de la population vit en ville, surtout dans les grandes aires urbaines comme Paris, Lyon ou Marseille.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/atlas-de-la-france/la-demographie-francaise/"}, {"q": "Quelle région est la plus peuplée ?", "options": ["La Corse", "L'Île-de-France", "La Bretagne", "Le Centre-Val de Loire"], "answer": 1, "explication": "Avec environ 12,4 millions d'habitants, l'Île-de-France est la région la plus peuplée de France.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/les-regions-fran%C3%A7aises/ile-de-france/"}, {"q": "Quelle ville française fait partie des 10 plus grandes métropoles du pays ?", "options": ["Limoges", "Brest", "Bordeaux", "Amiens"], "answer": 2, "explication": "Au 1er janvier 2025, Bordeaux figure parmi les plus grandes villes de France, avec Paris, Lyon, Lille, Marseille, Toulouse, Nantes, Nice et Strasbourg.", "source": "Livret du citoyen 2026, p. 49"}, {"q": "Lequel de ces départements de France est le plus touristique ?", "options": ["La Creuse", "Le Cantal", "La Côte-d'Or", "Paris"], "answer": 3, "explication": "Avec ses monuments et ses musées (Louvre, tour Eiffel, Orsay), Paris est le département qui attire le plus de visiteurs.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/la-france-dans-leurope-et-dans-le-monde/une-puissance-touristique/"}, {"q": "Quand peut-on visiter gratuitement des lieux culturels en France ?", "options": ["Tous les lundis", "Uniquement le 14 juillet", "Lors de journées gratuites organisées par les musées publics", "Jamais : l'entrée est toujours payante"], "answer": 2, "explication": "Les musées publics organisent des journées gratuites ou proposent des tarifs réduits pour rendre les œuvres accessibles à tous ; en septembre, les Journées du patrimoine ouvrent aussi de nombreux lieux habituellement fermés.", "source": "Livret du citoyen 2026, p. 53"}, {"q": "Combien de personnes parlent français dans le monde ?", "options": ["Environ 70 millions", "Environ 150 millions", "Plus de 1 milliard", "Plus de 300 millions"], "answer": 3, "explication": "Selon l'OIF, le français est parlé par plus de 300 millions de personnes, réparties sur les 5 continents.", "source": "Livret du citoyen 2026, p. 57"}, {"q": "Qui était Marguerite Yourcenar ?", "options": ["Une chanteuse française", "Une écrivaine française", "Une reine de France", "Une résistante fusillée en 1944"], "answer": 1, "explication": "Marguerite Yourcenar (1903-1987), née à Bruxelles, est une écrivaine française, célèbre pour « Mémoires d'Hadrien » et première femme élue à l'Académie française.", "source": "Livret du citoyen 2026, p. 48"}, {"q": "Quel peintre est français ?", "options": ["Vincent Van Gogh", "Claude Monet", "Rembrandt", "Francisco de Goya"], "answer": 1, "explication": "Claude Monet (1840-1926) est un peintre français, l'un des fondateurs de l'impressionnisme (« Impression, soleil levant », « Les Nymphéas »).", "source": "Livret du citoyen 2026, p. 55"}, {"q": "Quel musée est situé à Paris ?", "options": ["Le musée d'Orsay", "Le musée du Prado", "Le British Museum", "Le MoMA"], "answer": 0, "explication": "Le musée d'Orsay est situé à Paris, au bord de la Seine ; le Prado est à Madrid, le British Museum à Londres et le MoMA à New York.", "source": "Livret du citoyen 2026, p. 54"}, {"q": "Qui était Auguste Rodin ?", "options": ["Un président de la République", "Un sculpteur", "Un chanteur", "Un général de la Première Guerre mondiale"], "answer": 1, "explication": "Auguste Rodin (1840-1917) est l'un des plus grands sculpteurs du XIXe siècle, connu pour « L'Âge d'airain » et « Le Penseur ».", "source": "Livret du citoyen 2026, p. 55"}, {"q": "Quel est le classement de la langue française parmi les langues les plus parlées dans le monde ?", "options": ["1re", "4e", "12e", "20e"], "answer": 1, "explication": "Selon l'OIF, le français est la 4e langue la plus parlée au monde.", "source": "Livret du citoyen 2026, p. 57"}, {"q": "Quelle cathédrale célèbre a été en partie détruite par un incendie en 2019 ?", "options": ["La cathédrale de Chartres", "La cathédrale de Reims", "Notre-Dame de Paris", "La cathédrale de Strasbourg"], "answer": 2, "explication": "Notre-Dame de Paris a brûlé en 2019 ; plus de 840 millions d'euros de dons ont financé sa reconstruction.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/culture/patrimoine-francais-le-citoyen-acteur-et-conservateur-de-la-culture-en-france/"}, {"q": "Qui était une écrivaine française célèbre ?", "options": ["Virginia Woolf", "Simone de Beauvoir", "Agatha Christie", "Jane Austen"], "answer": 1, "explication": "Simone de Beauvoir (1908-1986) est une écrivaine française, considérée comme précurseure du mouvement féministe ; les trois autres sont britanniques.", "source": "Livret du citoyen 2026, p. 55"}, {"q": "Qui était un célèbre musicien français ?", "options": ["Wolfgang Amadeus Mozart", "Ludwig van Beethoven", "Claude Debussy", "Giuseppe Verdi"], "answer": 2, "explication": "Claude Debussy (1862-1918) est un compositeur français, l'un des plus grands musiciens français du début du XXe siècle.", "source": "Livret du citoyen 2026, p. 55"}, {"q": "Qui était Auguste Renoir ?", "options": ["Un écrivain du XVIIe siècle", "Un roi de France", "Un inventeur du cinéma", "Un peintre impressionniste"], "answer": 3, "explication": "Auguste Renoir (1841-1919) est un peintre impressionniste français, connu pour ses représentations de figures humaines.", "source": "Livret du citoyen 2026, p. 55"}, {"q": "Quelle fête est française ?", "options": ["Thanksgiving", "La Saint-Patrick", "Le 4 juillet, fête de l'Indépendance", "Le 14 juillet, fête nationale"], "answer": 3, "explication": "Le 14 juillet est la fête nationale française, avec un défilé militaire sur les Champs-Élysées, des bals et des feux d'artifice ; Thanksgiving et le 4 juillet sont américains, la Saint-Patrick irlandaise.", "source": "Livret du citoyen 2026, p. 57"}]}, {"theme": "Vivre dans la société française", "questions": [{"q": "Quel mariage est reconnu par l'État ?", "options": ["Le mariage civil célébré à la mairie", "Le mariage religieux uniquement", "Le mariage coutumier", "Toute union célébrée devant des témoins"], "answer": 0, "explication": "En France, seul le mariage civil célébré en mairie, par le maire ou un adjoint, est reconnu par la loi ; il est ouvert aux couples de même sexe depuis 2013.", "source": "Livret du citoyen 2026, p. 73"}, {"q": "Auprès de quelle institution les parents peuvent-ils inscrire leur enfant à l'école publique ?", "options": ["La préfecture", "La mairie", "La caisse d'allocations familiales (CAF)", "Le commissariat de police"], "answer": 1, "explication": "Ce sont les mairies qui gèrent les inscriptions des enfants à l'école publique.", "source": "Livret du citoyen 2026, p. 75"}, {"q": "En cas de divorce, qui exerce l'autorité parentale ?", "options": ["Toujours la mère seule", "Toujours le père seul", "En règle générale, les deux parents en commun", "Le parent qui a les revenus les plus élevés"], "answer": 2, "explication": "Après un divorce, l'autorité parentale continue d'être exercée par les deux parents, sauf décision de justice contraire.", "source": "Livret du citoyen 2026, p. 73"}, {"q": "Quelle aide permet aux personnes qui ont des difficultés financières d'avoir un avocat ?", "options": ["L'allocation de rentrée scolaire", "La prime d'activité", "L'aide personnalisée au logement (APL)", "L'aide juridictionnelle"], "answer": 3, "explication": "L'aide juridictionnelle est une aide financière de l'État pour les personnes ayant peu de moyens qui ont besoin d'être accompagnées par un avocat lors d'un procès.", "source": "Livret du citoyen 2026, p. 30"}, {"q": "Où faut-il déclarer la naissance d'un enfant ?", "options": ["À la préfecture du domicile", "À la mairie du lieu de naissance", "Au consulat du pays d'origine des parents", "À la caisse primaire d'assurance maladie (CPAM)"], "answer": 1, "explication": "La déclaration de naissance est obligatoire dans les 5 jours qui suivent la naissance ; elle se fait auprès du service d'état civil de la commune, c'est-à-dire à la mairie du lieu de naissance.", "source": "Livret du citoyen 2026, p. 73"}, {"q": "Quelle est l'une des conditions pour passer l'examen du permis de conduire ?", "options": ["Avoir au moins 21 ans", "Être de nationalité française", "Être propriétaire d'une voiture", "Avoir au moins 17 ans"], "answer": 3, "explication": "Pour passer le permis de conduire (voiture) en France, il faut avoir au moins 17 ans et résider en France ; on peut passer par une auto-école ou en candidat libre.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/vivre-dans-la-societe-fran%C3%A7aise/demarches-administratives/les-demarches-du-quotidien-comme-le-permis-de-conduire-1/"}, {"q": "Un bail locatif est valide s'il est :", "options": ["Écrit et signé par le locataire et le propriétaire", "Simplement conclu oralement entre le locataire et le propriétaire", "Signé uniquement par le locataire", "Validé par la préfecture"], "answer": 0, "explication": "Le bail est un contrat écrit entre le bailleur et le locataire : il n'est valide que s'il est signé par les deux, et c'est le seul document qui autorise à vivre dans le logement.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/vivre-dans-la-societe-fran%C3%A7aise/demarches-administratives/les-demarches-relatives-au-logement-1/"}, {"q": "Où peut-on déposer un lave-vaisselle cassé ?", "options": ["Dans la poubelle des ordures ménagères", "Sur le trottoir, à n'importe quel moment", "À la déchetterie", "Dans le bac de tri des emballages"], "answer": 2, "explication": "Des déchèteries sont présentes dans chaque territoire pour y déposer les appareils électroménagers, les encombrants et les déchets verts ; les dépôts sauvages sont interdits et punis d'une amende.", "source": "Livret du citoyen 2026, p. 66"}, {"q": "Quel numéro d'urgence permet d'appeler la police ?", "options": ["Le 17", "Le 15", "Le 18", "Le 115"], "answer": 0, "explication": "Le 17 permet d'appeler Police secours ; le 15 est le SAMU, le 18 les sapeurs-pompiers, le 112 le numéro d'appel d'urgence européen et le 115 l'hébergement d'urgence. Ces appels sont gratuits.", "source": "Livret du citoyen 2026, p. 69"}, {"q": "Concernant l'accès aux soins, quelle proposition est correcte ?", "options": ["Le médecin est imposé au patient par la mairie", "Chaque patient peut choisir librement son médecin", "L'hôpital public est réservé aux personnes de nationalité française", "Un patient peut exiger un acte contraire à l'organisation de l'hôpital pour des raisons religieuses"], "answer": 1, "explication": "Le libre choix du praticien et de l'établissement de santé est un droit du patient : aucun médecin ni hôpital ne peut lui être imposé, et le service public hospitalier est accessible à tous.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/vivre-dans-la-societe-fran%C3%A7aise/sante/sante-les-droits-du-patient/"}, {"q": "À qui est accessible la contraception ?", "options": ["Uniquement aux personnes majeures", "Uniquement aux femmes mariées", "À toutes les femmes et à tous les hommes, y compris les mineurs", "Aux mineures, seulement avec l'autorisation de leurs parents"], "answer": 2, "explication": "Le droit à la contraception, c'est-à-dire pouvoir choisir de ne pas devenir parent, est garanti à tous, y compris aux mineurs.", "source": "Livret du citoyen 2026, p. 29"}, {"q": "Qu’est-ce que le principe de confidentialité dans le domaine de la santé ?", "options": ["Le médecin doit informer l'employeur de l'état de santé du patient", "Le patient ne peut pas consulter son propre dossier médical", "Les informations médicales peuvent être communiquées librement à la famille", "Le médecin doit garder secrètes les informations médicales du patient"], "answer": 3, "explication": "Les personnels de santé ont l'obligation de garder secrètes les informations médicales d'un patient : c'est le principe de confidentialité dans le domaine de la santé.", "source": "Livret du citoyen 2026, p. 68"}, {"q": "L'inscription à l'Assurance maladie est :", "options": ["Réservée aux personnes de nationalité française", "Obligatoire pour toute personne qui travaille ou réside en France de manière stable et régulière", "Facultative et réservée aux salariés", "Payante chaque mois auprès de la mairie"], "answer": 1, "explication": "Tous les résidents en France ont l'obligation d'être inscrits à l'Assurance maladie, selon leur situation et dans les conditions fixées par la loi ; chaque assuré reçoit une carte Vitale.", "source": "Livret du citoyen 2026, p. 68"}, {"q": "Qui peut demander un congé parental d'éducation ?", "options": ["Uniquement la mère", "Uniquement les parents mariés", "Uniquement les fonctionnaires", "Tout(e) salarié(e), père ou mère, après la naissance ou l'adoption d'un enfant"], "answer": 3, "explication": "Après la naissance ou l'adoption d'un enfant de moins de 16 ans, tout(e) salarié(e), père ou mère, peut bénéficier d'un congé parental d'éducation pour interrompre ou réduire son activité afin d'élever l'enfant.", "source": "Livret du citoyen 2026, p. 73"}, {"q": "Quelles sont les affaires traitées par le conseil de prud'hommes ?", "options": ["Les litiges entre un salarié et son employeur liés au contrat de travail", "Les conflits entre voisins", "Les divorces", "Les infractions au code de la route"], "answer": 0, "explication": "En cas de litige entre un employeur et son salarié, c'est le conseil de prud'hommes qui est compétent pour juger.", "source": "Livret du citoyen 2026, p. 70"}, {"q": "Travailler sans être déclaré est :", "options": ["Autorisé si le salarié est d'accord", "Autorisé pendant la période d'essai", "Interdit par la loi", "Autorisé pour les emplois de moins de 10 heures par semaine"], "answer": 2, "explication": "Le travail non déclaré (travail dissimulé) est interdit : l'employeur risque jusqu'à 3 ans de prison et 45 000 € d'amende, et le salarié perd ses droits (chômage, retraite, Sécurité sociale, congés payés).", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/vivre-dans-la-societe-fran%C3%A7aise/emploi/le-droit-au-travail-5/"}, {"q": "Lorsqu'un employeur veut qu'un salarié travaille plus longtemps que la durée prévue dans le contrat de travail :", "options": ["Il doit payer ces heures supplémentaires ou les compenser par du repos", "Il n'a rien à payer en plus", "Il peut retenir une partie du salaire si le salarié refuse", "Il doit demander l'autorisation du maire"], "answer": 0, "explication": "Les heures travaillées au-delà de la durée légale (35 heures par semaine) sont des heures supplémentaires : l'employeur doit les payer (avec majoration) ou permettre au salarié de les récupérer.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/vivre-dans-la-societe-fran%C3%A7aise/emploi/le-droit-au-travail-1/"}, {"q": "Quelle est la mission de France Travail ?", "options": ["Délivrer les titres de séjour", "Accompagner les demandeurs d'emploi et leur verser leurs allocations", "Contrôler le respect du code du travail dans les entreprises", "Juger les conflits entre salariés et employeurs"], "answer": 1, "explication": "France Travail est l'organisme public qui accompagne les personnes dans leur recherche d'emploi, peut proposer des formations et verse, si les conditions sont remplies, l'allocation d'aide au retour à l'emploi (ARE).", "source": "Livret du citoyen 2026, p. 71"}, {"q": "Dans une entreprise, le droit syndical permet :", "options": ["À l'employeur d'obliger les salariés à adhérer à un syndicat", "À l'employeur de sanctionner un salarié syndiqué", "De créer un syndicat, d'y adhérer ou d'y participer librement", "De ne plus respecter le règlement intérieur"], "answer": 2, "explication": "Chaque travailleur, sans condition, a le droit de rejoindre une organisation syndicale pour le représenter au travail ; chacun peut défendre ses droits par l'action syndicale.", "source": "Livret du citoyen 2026, p. 70"}, {"q": "Dans une entreprise, le droit de grève autorise :", "options": ["Les salariés à être payés normalement pendant la grève", "Les salariés à dégrader le matériel de l'entreprise", "L'employeur à licencier les salariés grévistes", "Les salariés à arrêter collectivement le travail pour soutenir des revendications professionnelles"], "answer": 3, "explication": "La grève est un arrêt collectif et concerté du travail pour appuyer des revendications professionnelles ; le salaire est retenu pour la durée de l'arrêt, mais le gréviste ne peut pas être sanctionné ni licencié (sauf faute lourde).", "source": "https://www.service-public.gouv.fr/particuliers/vosdroits/F117"}, {"q": "Quelles sont les conditions pour toucher les allocations chômage ?", "options": ["Avoir démissionné sans motif et être inscrit à la mairie", "Avoir perdu son emploi sans l'avoir quitté volontairement, avoir travaillé suffisamment longtemps et être inscrit à France Travail", "Avoir simplement travaillé un jour dans sa vie, sans inscription", "Être de nationalité française et avoir plus de 25 ans"], "answer": 1, "explication": "Pour être indemnisé, il faut s'inscrire à France Travail ; l'allocation d'aide au retour à l'emploi (ARE) est versée si les conditions sont remplies : avoir travaillé suffisamment longtemps et ne pas avoir quitté son travail de manière volontaire.", "source": "Livret du citoyen 2026, p. 71"}, {"q": "Qu'est-ce que l'école maternelle ?", "options": ["Une crèche réservée aux bébés de moins de 2 ans", "Une école privée payante et facultative", "L'école des enfants de 6 à 11 ans", "La première étape de l'école, pour les enfants de 3 à 6 ans"], "answer": 3, "explication": "L'école maternelle accueille les enfants au début de l'instruction obligatoire, qui débute à 3 ans ; l'école élémentaire prend le relais de 6 à 11 ans.", "source": "Livret du citoyen 2026, p. 75"}, {"q": "Comment s'appelle le diplôme passé par les élèves à la fin du collège ?", "options": ["Le diplôme national du brevet (DNB)", "Le baccalauréat", "Le certificat d'aptitude professionnelle (CAP)", "La licence"], "answer": 0, "explication": "À la fin de la classe de 3e, les collégiens passent le diplôme national du brevet (brevet des collèges) ; le baccalauréat se passe à la fin du lycée.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/vivre-dans-la-societe-fran%C3%A7aise/parentalite/le-systeme-educatif/"}, {"q": "Les parents d'élève ont le droit de :", "options": ["Assister aux cours dans la classe quand ils le veulent", "Choisir les programmes enseignés", "Se présenter aux élections des représentants des parents d'élèves", "Noter eux-mêmes les élèves"], "answer": 2, "explication": "Les parents peuvent participer activement à la vie de l'école en se portant candidats aux élections de représentants de parents d'élèves ou en rejoignant une association de parents.", "source": "Livret du citoyen 2026, p. 75"}, {"q": "Qui peut manger à la cantine scolaire ?", "options": ["Tous les enfants qui le souhaitent", "Uniquement les enfants dont les deux parents travaillent", "Uniquement les enfants de nationalité française", "Uniquement les élèves du lycée"], "answer": 0, "explication": "La cantine est ouverte, dans toutes les écoles, à tous les enfants qui le souhaitent.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/vivre-dans-la-societe-fran%C3%A7aise/parentalite/le-systeme-educatif/"}, {"q": "À quel âge commence l'instruction obligatoire des enfants ?", "options": ["6 ans", "3 ans", "2 ans", "5 ans"], "answer": 1, "explication": "L'école (l'instruction) est obligatoire pour les enfants de 3 à 16 ans.", "source": "Livret du citoyen 2026, p. 75"}, {"q": "Quel est l'âge de la majorité ?", "options": ["16 ans", "21 ans", "18 ans", "20 ans"], "answer": 2, "explication": "La majorité civile est fixée à 18 ans (depuis 1974) ; l'autorité parentale prend fin quand l'enfant devient majeur (ou émancipé).", "source": "Livret du citoyen 2026, p. 14"}, {"q": "À l'école, il est interdit aux parents de :", "options": ["Demander un rendez-vous à l'enseignant", "Accompagner leur enfant jusqu'à l'entrée de l'école", "Adhérer à une association de parents d'élèves", "Menacer, insulter ou être violent envers les enseignants et le personnel"], "answer": 3, "explication": "Les enseignants sont chargés d'une mission de service public : le Code pénal prévoit des sanctions aggravées en cas d'atteinte contre eux, et l'outrage envers eux est puni (article 433-5).", "source": "Livret du citoyen 2026, p. 33"}, {"q": "Quel motif d'absence est accepté par l'école ?", "options": ["Un départ en vacances avant la date officielle", "La maladie de l'enfant", "Une fête d'anniversaire d'un camarade", "Un rendez-vous administratif d'un parent sans lien avec l'enfant"], "answer": 1, "explication": "Seules les absences pour raisons de santé ou pour raisons familiales (mariage, enterrement…) sont acceptées par les établissements scolaires.", "source": "Livret du citoyen 2026, p. 75"}, {"q": "Des parents ne respectent pas l'obligation d'instruction pour leurs enfants. Quelle sanction maximale risquent-ils ?", "options": ["Aucune sanction, l'instruction n'est qu'une recommandation", "Une simple amende de 35 €", "Un simple rappel à l'ordre par l'école, sans sanction pénale", "Une amende ainsi qu'une peine de prison"], "answer": 3, "explication": "Les parents qui ne respectent pas l'obligation d'instruction peuvent être sanctionnés par une amende ainsi qu'une peine de prison (jusqu'à 6 mois et 7 500 € selon l'article 227-17-1 du code pénal).", "source": "Livret du citoyen 2026, p. 75"}, {"q": "Quand ont lieu les vacances scolaires de Noël ?", "options": ["Fin décembre et début janvier, pendant deux semaines, aux mêmes dates dans toute la France", "Pendant tout le mois de décembre", "En février, selon la zone", "De mi-novembre à début décembre"], "answer": 0, "explication": "Les vacances de Noël durent environ deux semaines autour des fêtes de fin d'année et sont communes aux zones A, B et C (en 2026-2027 : du samedi 19 décembre 2026 au lundi 4 janvier 2027).", "source": "https://www.education.gouv.fr/calendrier-scolaire-100148"}, {"q": "À l'école, un enfant en situation de handicap :", "options": ["Ne peut pas aller à l'école publique", "Doit obligatoirement être instruit à la maison", "A le droit d'être scolarisé, avec si besoin des aménagements et un accompagnant (AESH)", "Doit payer des frais de scolarité supplémentaires"], "answer": 2, "explication": "Les enfants en situation de handicap ont droit à la même vie que les autres, y compris à l'école, où ils peuvent bénéficier d'aménagements comme un emploi du temps adapté pour suivre leurs soins.", "source": "Livret du citoyen 2026, p. 75"}]}], "livret": [{"partie": "Principes et valeurs de la République", "sections": [{"titre": "La devise de la République", "questions": [{"q": "Quelle est la devise de la République française ?", "options": ["Liberté, égalité, fraternité", "Travail, famille, patrie", "Unité, justice, progrès", "Liberté, sécurité, solidarité"], "answer": 0, "explication": "La devise « liberté, égalité, fraternité » exprime les valeurs fondatrices de la République, repères communs pour vivre ensemble.", "page": 6}, {"q": "Où la devise de la République est-elle inscrite ?", "options": ["Sur le fronton des bâtiments publics comme les préfectures et les mairies", "Uniquement sur les pièces de monnaie", "Uniquement sur le drapeau tricolore", "Sur la porte de toutes les églises"], "answer": 0, "explication": "La devise est gravée sur le fronton des bâtiments publics (préfectures, mairies…).", "page": 6}, {"q": "Selon le livret, que représente la devise « liberté, égalité, fraternité » ?", "options": ["Les valeurs fondatrices de la République, repères communs pour le vivre ensemble", "Le titre de l'hymne national", "Les trois pouvoirs de l'État", "Les trois couleurs du drapeau"], "answer": 0, "explication": "La devise consacre les valeurs fondatrices de la République française.", "page": 6}]}, {"titre": "Liberté", "questions": [{"q": "Dans quel texte de 1789 la liberté est-elle inscrite comme valeur fondamentale ?", "options": ["La Déclaration des droits de l'homme et du citoyen (DDHC)", "La Constitution de la Ve République", "Le Code civil", "La loi sur la laïcité"], "answer": 0, "explication": "La liberté est inscrite dans la Déclaration des droits de l'homme et du citoyen de 1789.", "page": 6}, {"q": "Complétez l'article 4 de la DDHC : « La liberté consiste à pouvoir faire tout ce qui… »", "options": ["… ne nuit pas à autrui", "… est autorisé par le maire", "… plaît à chacun", "… est conforme à sa religion"], "answer": 0, "explication": "Article 4 de la DDHC : on peut faire tout ce qui ne gêne pas les autres, dans le cadre défini par la loi.", "page": 6}, {"q": "Quel article de la DDHC définit la liberté comme le pouvoir de faire tout ce qui ne nuit pas à autrui ?", "options": ["L'article 4", "L'article 1er", "L'article 10", "L'article 3"], "answer": 0, "explication": "C'est l'article 4 de la Déclaration de 1789.", "page": 6}, {"q": "Vrai : laquelle de ces affirmations sur la liberté est exacte ?", "options": ["Les libertés sont les mêmes pour tous les citoyens, dans le respect des lois", "Les libertés dépendent de l'origine de chaque citoyen", "La liberté permet de faire tout ce que l'on veut, même si cela gêne les autres", "Les libertés sont réservées aux personnes nées en France"], "answer": 0, "explication": "Les libertés sont identiques pour tous les citoyens, dans le respect des lois.", "page": 6}, {"q": "Selon le livret, en quoi les femmes et les hommes sont-ils libres ?", "options": ["Dans leurs choix, leurs opinions et leur manière de penser, de s'exprimer et de vivre", "Uniquement dans le choix de leur métier", "Uniquement dans le choix de leur religion", "Seulement à partir de 21 ans"], "answer": 0, "explication": "Chacun est libre de ses choix, de ses opinions et de sa façon de penser, de s'exprimer et de vivre.", "page": 6}]}, {"titre": "Égalité et lutte contre les discriminations", "questions": [{"q": "Quel article de la Constitution de 1958 fait de l'égalité un principe fondamental de la République ?", "options": ["L'article 1er", "L'article 3", "L'article 10", "L'article 89"], "answer": 0, "explication": "L'égalité est un principe fondamental inscrit à l'article 1er de la Constitution de 1958.", "page": 6}, {"q": "Selon l'article 1er de la DDHC, les citoyens ont les mêmes droits quel que soit…", "options": ["… leur sexe, leur origine, leur religion, leurs opinions ou leur orientation sexuelle", "… leur fortune uniquement", "… leur lieu de naissance uniquement, à condition d'être nés en France", "… leur métier, sauf pour les fonctionnaires"], "answer": 0, "explication": "Tous les citoyens ont les mêmes droits, sans distinction de sexe, d'origine, de religion, d'opinion ou d'orientation sexuelle.", "page": 6}, {"q": "Depuis quelle année l'égalité entre les femmes et les hommes est-elle inscrite dans le préambule de la Constitution ?", "options": ["1946", "1789", "1958", "1905"], "answer": 0, "explication": "L'égalité femmes-hommes figure dans le préambule de la Constitution depuis 1946.", "page": 6}, {"q": "Dans quels domaines s'applique l'égalité entre les femmes et les hommes ?", "options": ["Dans tous les domaines : travail, santé, éducation…", "Seulement dans le domaine du vote", "Seulement dans la fonction publique", "Seulement dans le mariage"], "answer": 0, "explication": "L'égalité femmes-hommes s'applique dans tous les domaines.", "page": 6}, {"q": "Qu'est-ce qu'une discrimination ?", "options": ["Traiter différemment une personne par rapport à une autre, dans une situation comparable, en raison de son origine, son sexe, son âge, sa religion…", "Refuser un candidat qui n'a pas les diplômes demandés pour un poste", "Donner son opinion politique en public", "Critiquer une religion"], "answer": 0, "explication": "La discrimination est un traitement différent, dans une situation comparable (logement, travail, loisirs…), fondé sur un critère comme l'origine, le sexe ou l'apparence physique.", "page": 6}, {"q": "Vrai : laquelle de ces affirmations est exacte ?", "options": ["Les discriminations sont punies par la loi", "Les discriminations sont autorisées dans les loisirs", "Les discriminations sont seulement déconseillées", "Les discriminations sont autorisées pour le logement"], "answer": 0, "explication": "La France condamne les discriminations : elles sont punies par la loi.", "page": 6}, {"q": "Lequel de ces critères est cité par le livret comme un motif de discrimination interdit ?", "options": ["L'apparence physique", "Le niveau de diplôme exigé pour un poste", "Les compétences professionnelles", "L'expérience professionnelle"], "answer": 0, "explication": "Parmi les critères cités : origine, sexe, orientation sexuelle, opinion politique, âge, convictions religieuses, apparence physique…", "page": 6}, {"q": "Sur quoi doit être fondée toute décision d'un employeur (embauche, promotion…) ?", "options": ["Sur des raisons professionnelles et non personnelles", "Sur la religion du candidat", "Sur l'origine du candidat", "Sur l'âge du candidat"], "answer": 0, "explication": "Les décisions d'un employeur doivent reposer sur des raisons professionnelles, jamais personnelles.", "page": 7}, {"q": "Comment le livret définit-il le sexisme ?", "options": ["Un traitement dénigrant envers une personne en raison de son sexe", "Une discrimination fondée sur la religion supposée", "Une haine dirigée contre les Juifs", "Une discrimination fondée sur l'âge"], "answer": 0, "explication": "Le sexisme est un traitement dénigrant envers une autre personne à cause de son sexe.", "page": 7}, {"q": "Comment le livret définit-il le racisme ?", "options": ["Une discrimination fondée sur l'origine ou l'appartenance ethnique ou raciale d'une personne", "Un traitement dénigrant en raison du sexe", "Une attitude hostile en raison de l'orientation sexuelle", "Une critique d'une religion"], "answer": 0, "explication": "Le racisme est une discrimination fondée sur l'origine ou l'appartenance ethnique ou raciale.", "page": 7}, {"q": "Qu'est-ce que l'antisémitisme selon le livret ?", "options": ["Une forme spécifique de racisme et de haine dirigée contre les Juifs, fondée sur des préjugés, des stéréotypes et des discriminations", "Une discrimination fondée sur le sexe", "Une forme de prosélytisme religieux", "Une critique des institutions de l'État"], "answer": 0, "explication": "L'antisémitisme est une forme spécifique de racisme et de haine visant les Juifs.", "page": 7}, {"q": "Qu'est-ce que la discrimination sur critère religieux ?", "options": ["Une discrimination fondée sur la religion supposée de la personne", "Le fait de pratiquer sa religion en public", "Le fait de changer de religion", "Le fait de critiquer une religion par une caricature"], "answer": 0, "explication": "C'est une discrimination fondée sur la religion supposée d'une personne.", "page": 7}, {"q": "Comment le livret définit-il la haine et la discrimination anti-LGBT+ ?", "options": ["Des attitudes hostiles envers des personnes en raison de leur orientation sexuelle", "Des attitudes hostiles en raison de l'origine", "Une discrimination fondée sur l'âge", "Une discrimination fondée sur la religion"], "answer": 0, "explication": "La haine anti-LGBT+ désigne les attitudes hostiles liées à l'orientation sexuelle des personnes.", "page": 7}, {"q": "Laquelle de ces formes de haine ou de discrimination n'est PAS citée par le livret parmi celles contre lesquelles l'État lutte activement ?", "options": ["La discrimination selon le niveau de diplôme", "Le sexisme", "L'antisémitisme", "La haine anti-LGBT+"], "answer": 0, "explication": "L'État lutte activement contre le sexisme, le racisme, l'antisémitisme, la discrimination religieuse et la haine anti-LGBT+.", "page": 7}]}, {"titre": "Fraternité", "questions": [{"q": "Sur quoi la France est-elle fondée, selon le livret, ce qui se traduit par la fraternité ?", "options": ["Sur la volonté des citoyens de vivre ensemble", "Sur une religion commune", "Sur une origine commune", "Sur la puissance militaire"], "answer": 0, "explication": "La France repose sur la volonté de vivre ensemble, qui s'exprime par la fraternité entre tous.", "page": 7}, {"q": "Vrai : laquelle de ces affirmations sur la fraternité républicaine est exacte ?", "options": ["Elle est civique, et non basée sur l'origine ou la religion", "Elle est réservée aux personnes de même religion", "Elle est fondée sur l'origine familiale", "Elle concerne seulement les membres d'une même famille"], "answer": 0, "explication": "La fraternité consiste à voir en l'autre un semblable malgré les différences ; elle est civique.", "page": 7}, {"q": "Sur quelle capacité repose la fraternité ?", "options": ["Voir en l'autre un semblable malgré les différences", "Parler plusieurs langues", "Partager la même religion", "Habiter dans la même ville"], "answer": 0, "explication": "La fraternité repose sur la capacité à reconnaître en l'autre un semblable, malgré les différences.", "page": 7}, {"q": "Quel exemple le livret donne-t-il de la protection assurée par la Nation au titre de la solidarité collective ?", "options": ["La Sécurité sociale", "Les impôts locaux uniquement", "Les fêtes religieuses", "Le permis de conduire"], "answer": 0, "explication": "Le principe de solidarité signifie que la Nation protège les individus, par exemple avec la Sécurité sociale.", "page": 7}, {"q": "Pourquoi remplir ses obligations fiscales est-il un acte solidaire ?", "options": ["Parce que cela permet de financer les services publics au bénéfice de tous", "Parce que cela finance les partis politiques", "Parce que cela finance les cultes religieux", "Parce que cela donne le droit de vote"], "answer": 0, "explication": "Payer ses impôts finance les services publics, qui profitent à tous.", "page": 7}, {"q": "Selon le principe de solidarité, à quoi chaque citoyen français doit-il participer en cas de nécessité ?", "options": ["À la défense de la Nation", "À l'élection du maire", "À la construction des écoles", "À l'organisation de la fête nationale"], "answer": 0, "explication": "La solidarité exige que chaque citoyen participe à la défense de la Nation si nécessaire.", "page": 7}, {"q": "Quels exemples le livret cite-t-il de participation citoyenne mettant en œuvre la solidarité et la fraternité ?", "options": ["Les collectes pour des associations humanitaires ou l'engagement dans une association de quartier", "Le refus de payer ses impôts", "La pratique d'un culte", "Le vote blanc"], "answer": 0, "explication": "Organiser des collectes humanitaires ou s'engager dans une association de quartier sont des formes de solidarité citoyenne.", "page": 7}, {"q": "Quel exemple illustre la solidarité intergénérationnelle ?", "options": ["En cotisant, chaque salarié contribue au versement des retraites", "Les parents votent à la place de leurs enfants", "Les jeunes paient moins d'impôts", "Les retraités financent les écoles"], "answer": 0, "explication": "La solidarité entre générations passe par les cotisations des salariés qui financent les retraites.", "page": 7}, {"q": "Sous quelles formes la solidarité issue de la fraternité se décline-t-elle dans le livret ?", "options": ["Collective et intergénérationnelle", "Religieuse et familiale", "Militaire et commerciale", "Régionale et européenne"], "answer": 0, "explication": "Le livret distingue la solidarité collective et la solidarité intergénérationnelle.", "page": 7}, {"q": "À quoi la fraternité contribue-t-elle, selon le livret ?", "options": ["À la réduction des inégalités, notamment sociales", "À l'augmentation des impôts", "À la séparation des citoyens par origine", "Au choix d'une religion officielle"], "answer": 0, "explication": "La fraternité contribue à réduire les inégalités, en particulier sociales.", "page": 7}]}, {"titre": "Les symboles de la France", "questions": [{"q": "Que s'est-il passé le 14 juillet 1789 ?", "options": ["Le peuple de Paris a pris la Bastille, une prison royale", "La Fête de la Fédération a été célébrée", "La Marseillaise a été écrite", "La Constitution de la Ve République a été adoptée"], "answer": 0, "explication": "La prise de la Bastille, le 14 juillet 1789, marque le début de la Révolution française.", "page": 8}, {"q": "Quel événement a été célébré le 14 juillet 1790 ?", "options": ["La Fête de la Fédération", "La prise de la Bastille", "La première élection du Président", "L'adoption du drapeau tricolore"], "answer": 0, "explication": "Un an après la prise de la Bastille, le 14 juillet 1790, a eu lieu la Fête de la Fédération.", "page": 8}, {"q": "Depuis quelle année le 14 juillet est-il le jour de la fête nationale ?", "options": ["1880", "1789", "1790", "1958"], "answer": 0, "explication": "Depuis 1880, le 14 juillet est la fête nationale, en mémoire de 1789 et de 1790.", "page": 8}, {"q": "Quels événements la fête nationale du 14 juillet commémore-t-elle ?", "options": ["La prise de la Bastille (1789) et la Fête de la Fédération (1790)", "La fin de la Seconde Guerre mondiale et la Libération", "L'adoption de la Constitution de 1958 et la loi de 1905", "La création du drapeau et de l'hymne"], "answer": 0, "explication": "Le 14 juillet commémore à la fois la prise de la Bastille et la Fête de la Fédération.", "page": 8}, {"q": "Qu'était la Bastille ?", "options": ["Une prison royale", "Un palais présidentiel", "Une cathédrale", "Une assemblée de députés"], "answer": 0, "explication": "La Bastille était une prison royale, prise par le peuple de Paris en 1789.", "page": 8}, {"q": "Quel est le nom de l'hymne national français ?", "options": ["La Marseillaise", "Le Chant du départ", "L'Internationale", "La Parisienne"], "answer": 0, "explication": "L'hymne national est La Marseillaise.", "page": 8}, {"q": "Qui a écrit La Marseillaise ?", "options": ["Rouget de Lisle", "Victor Hugo", "Napoléon Bonaparte", "Jean Jaurès"], "answer": 0, "explication": "La Marseillaise a été écrite par Rouget de Lisle.", "page": 8}, {"q": "En quelle année La Marseillaise a-t-elle été écrite ?", "options": ["1792", "1789", "1794", "1880"], "answer": 0, "explication": "Rouget de Lisle a écrit La Marseillaise en 1792.", "page": 8}, {"q": "Où les enfants étudient-ils La
