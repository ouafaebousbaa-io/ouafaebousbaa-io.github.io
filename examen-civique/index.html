<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Examen civique CR</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one narrow column, like an exam booklet; a home screen of five theme rows, then one question per screen. */
:root {
  --paper: #f5f6fa;
  --sheet: #ffffff;
  --ink: #161b33;
  --muted: #5b6180;
  --line: #dfe2ec;
  --bleu: #22328a;
  --bleu-soft: #e7eaf7;
  --ok: #1f7a4d;
  --ok-soft: #e3f3ea;
  --ko: #b3261e;
  --ko-soft: #fbe7e5;
  --display: "Literata", Georgia, "Times New Roman", serif;
  --body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #10131f; --sheet: #181c2c; --ink: #e8eaf4; --muted: #9aa0bd; --line: #2c3249;
  --bleu: #9fb0ff; --bleu-soft: #232a4a; --ok: #6fd39d; --ok-soft: #173326; --ko: #ff8a80; --ko-soft: #3a1c1c;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #10131f; --sheet: #181c2c; --ink: #e8eaf4; --muted: #9aa0bd; --line: #2c3249;
  --bleu: #9fb0ff; --bleu-soft: #232a4a; --ok: #6fd39d; --ok-soft: #173326; --ko: #ff8a80; --ko-soft: #3a1c1c;
  color-scheme: dark }

body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; display: flex; flex-direction: column; gap: 20px; }
h1, h2 { font-family: var(--display); font-weight: 650; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: 1.75rem; line-height: 1.15; }
h2 { font-size: 1.3rem; line-height: 1.3; }
p { margin: 0; }
.eyebrow { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.09em; font-weight: 600; color: var(--muted); }
.lede { color: var(--muted); }
.tricolore { display: flex; height: 4px; width: 48px; border-radius: 2px; overflow: hidden; }
.tricolore span { flex: 1; } .tricolore span:nth-child(1){background:#22328a} .tricolore span:nth-child(2){background:#d9dbe4} .tricolore span:nth-child(3){background:#c8302b}

button { font: inherit; cursor: pointer; color: inherit; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--bleu); outline-offset: 2px; }
.btn { border: 0; border-radius: 10px; padding: 14px 18px; font-weight: 600; background: var(--bleu); color: var(--sheet); text-align: center; }
.btn.ghost { background: transparent; color: var(--bleu); border: 1.5px solid var(--bleu); }
.btn:disabled { opacity: .4; cursor: default; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row .btn { flex: 1 1 160px; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 2px; }
.stat b { font-family: var(--mono); font-size: 1.35rem; font-variant-numeric: tabular-nums; }
.stat span { font-size: 0.78rem; color: var(--muted); }

.themes { display: flex; flex-direction: column; background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.theme { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 14px 16px; border: 0; border-top: 1px solid var(--line); background: transparent; text-align: left; }
.theme:first-child { border-top: 0; }
.theme:hover { background: var(--bleu-soft); }
.theme .name { font-weight: 600; min-width: 0; display: flex; flex-direction: column; }
.theme .name small { font-weight: 400; font-size: 0.8rem; color: var(--muted); }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--line); border-radius: 12px; }
.tabs button { border: 0; border-radius: 9px; padding: 10px 8px; font-weight: 600; background: transparent; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--sheet); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.theme .count { font-family: var(--mono); font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { grid-column: 1 / -1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.bar .g { background: var(--ok); } .bar .r { background: var(--ko); }
.legend { display: flex; gap: 16px; font-size: 0.8rem; color: var(--muted); flex-wrap: wrap; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; background: var(--c); }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.link { background: none; border: 0; padding: 6px 0; color: var(--bleu); font-weight: 600; }
.meta { font-family: var(--mono); font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.meta.warn { color: var(--ko); }
.progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--bleu); transition: width .2s; }

.card { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; padding: 20px 18px; display: flex; flex-direction: column; gap: 16px; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: start; text-align: left; padding: 13px 14px; background: var(--paper); border: 1.5px solid var(--line); border-radius: 10px; }
.opt:hover:not(:disabled) { border-color: var(--bleu); }
.opt .k { font-family: var(--mono); font-size: 0.8rem; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; border: 1.5px solid var(--line); color: var(--muted); }
.opt span:last-child { min-width: 0; padding-top: 2px; }
.opt.chosen { border-color: var(--bleu); background: var(--bleu-soft); }
.opt.chosen .k { border-color: var(--bleu); color: var(--bleu); }
.opt.good { border-color: var(--ok); background: var(--ok-soft); }
.opt.good .k { border-color: var(--ok); background: var(--ok); color: var(--sheet); }
.opt.bad { border-color: var(--ko); background: var(--ko-soft); }
.opt.bad .k { border-color: var(--ko); background: var(--ko); color: var(--sheet); }
.opt:disabled { cursor: default; }

.feedback { border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 6px; background: var(--paper); border-left: 4px solid var(--c); }
.feedback .verdict { font-weight: 700; color: var(--c); }
.feedback a { color: var(--bleu); font-size: 0.85rem; overflow-wrap: anywhere; }
.note { font-size: 0.85rem; color: var(--muted); }

.score { font-family: var(--display); font-size: 3rem; line-height: 1; font-variant-numeric: tabular-nums; }
.score small { font-size: 1.2rem; color: var(--muted); }
.pill { display: inline-block; padding: 4px 10px; border-radius: 999px; font-weight: 700; font-size: 0.85rem; background: var(--c-soft); color: var(--c); }
.review { display: flex; flex-direction: column; gap: 12px; }
.ritem { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 6px; border-left: 4px solid var(--c); }
.ritem .q { font-weight: 600; }
.ritem .a { font-size: 0.92rem; }
.confirm { background: var(--ko-soft); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head>

<script>
const DATA = {"official": [{"theme": "Principes et valeurs de la République", "questions": [{"q": "Parmi les propositions suivantes, laquelle constitue une participation citoyenne ?", "options": ["Voter aux élections", "Renouveler son passeport", "Payer une contravention", "Regarder le journal télévisé"], "answer": 0, "explication": "Voter est un devoir civique qui assure la légitimité des élus (même s'il n'est pas obligatoire) ; le livret cite aussi l'engagement associatif comme forme de participation citoyenne (p. 7).", "source": "Livret du citoyen 2026, p. 34"}, {"q": "Que garantit la liberté d’expression ?", "options": ["Le droit de tout dire sans aucune limite, y compris des insultes", "Le droit d'exprimer librement ses opinions, dans les limites fixées par la loi", "Le droit d'imposer ses opinions aux autres", "Le droit de s'exprimer uniquement en privé"], "answer": 1, "explication": "Chacun est libre d'exprimer ses idées et opinions, mais dans les limites fixées par la loi : pas d'appel à la violence, d'insultes, de menaces ni de propos discriminatoires.", "source": "Livret du citoyen 2026, p. 26"}, {"q": "À quoi sert un titre de séjour ?", "options": ["À voter à toutes les élections", "À remplacer la carte nationale d'identité française", "À permettre à une personne étrangère de résider légalement en France", "À obtenir automatiquement la nationalité française"], "answer": 2, "explication": "Un étranger non ressortissant de l'Union européenne doit détenir un titre de séjour à l'expiration de son visa : c'est ce qui lui permet de rester légalement en France.", "source": "Livret du citoyen 2026, p. 27"}, {"q": "La liberté de circulation permet à toute personne de :", "options": ["Entrer dans n'importe quel domicile privé", "Conduire un véhicule sans permis", "Franchir les frontières sans aucun document", "Se déplacer librement sur le territoire"], "answer": 3, "explication": "La liberté d'aller et venir (liberté de circulation) permet de circuler librement sur le territoire ; elle connaît des exceptions (prisonniers, visas pour les étrangers non européens, état d'urgence).", "source": "Livret du citoyen 2026, p. 27"}, {"q": "Sur quel site internet peut-on retrouver le symbole de la République française ?", "options": ["Sur service-public.fr, site officiel de l'administration", "Sur leboncoin.fr", "Sur amazon.fr", "Sur facebook.com"], "answer": 0, "explication": "Les symboles de la République se retrouvent sur l'ensemble des sites internet et documents de l'administration, comme service-public.fr.", "source": "Livret du citoyen 2026, p. 8"}, {"q": "Complétez ces paroles de la Marseillaise : \"Aux armes […] ! Formez vos bataillons\"", "options": ["soldats", "citoyens", "enfants", "Français"], "answer": 1, "explication": "Le refrain de la Marseillaise commence par « Aux armes, citoyens, formez vos bataillons ! ».", "source": "Livret du citoyen 2026, p. 9"}, {"q": "Complétez les paroles de la Marseillaise : \"Allons enfants de la patrie […]\"", "options": ["Marchons, marchons vers la victoire", "La liberté guide nos pas", "Le jour de gloire est arrivé", "Unissons-nous pour la nation"], "answer": 2, "explication": "Le premier couplet commence par « Allons enfants de la Patrie, le jour de gloire est arrivé ! ».", "source": "Livret du citoyen 2026, p. 9"}, {"q": "En application de la liberté individuelle, quelle proposition est correcte ? Une personne peut :", "options": ["Obliger sa fille à épouser l'homme qu'elle a choisi pour elle", "Empêcher son conjoint de travailler", "Confisquer les papiers d'identité d'un membre de sa famille", "Choisir librement la personne avec qui elle vit"], "answer": 3, "explication": "La liberté de choix permet à chacun de décider de son mode de vie et de ses relations, dans les limites de la loi ; chaque conjoint peut aussi travailler librement (Charte, p. 80).", "source": "Livret du citoyen 2026, p. 26"}, {"q": "Concernant la pratique de la religion, quelle proposition est correcte ?", "options": ["Chacun est libre de pratiquer la religion de son choix, dans le respect de l'ordre public", "Il est obligatoire d'avoir une religion", "L'État impose une religion officielle", "On peut désobéir à la loi au nom de sa religion"], "answer": 0, "explication": "La laïcité garantit la liberté de manifester ses croyances et de pratiquer sa religion dans les limites du respect de l'ordre public (article 10 de la DDHC).", "source": "Livret du citoyen 2026, p. 10"}, {"q": "En tant que parent, peut-on refuser que son enfant participe aux cours de sport à l'école car ils sont mixtes ?", "options": ["Oui, sur simple demande écrite à l'école", "Non, le sport fait partie du programme obligatoire et la mixité garantit l'égalité filles-garçons", "Oui, si la religion de la famille l'interdit", "Oui, mais seulement pour les filles"], "answer": 1, "explication": "À l'école publique, on ne peut pas refuser, en raison de sa religion, une règle de fonctionnement ou un enseignement du programme scolaire, comme le sport.", "source": "Livret du citoyen 2026, p. 13"}, {"q": "Quelle est la devise de la France ?", "options": ["Travail, Famille, Patrie", "Unité, Progrès, Justice", "Liberté, Égalité, Fraternité", "Paix, Justice, Liberté"], "answer": 2, "explication": "La devise « Liberté, égalité, fraternité » consacre les valeurs fondatrices de la République ; elle est inscrite sur le fronton des bâtiments publics (mairies, préfectures…).", "source": "Livret du citoyen 2026, p. 6"}, {"q": "La répudiation de sa femme est :", "options": ["Autorisée si le mari le décide seul", "Possible si le mariage a été célébré à l'étranger", "Autorisée avec l'accord de la famille", "Interdite : elle n'a aucune valeur en droit français"], "answer": 3, "explication": "La répudiation, décidée par un seul époux, est contraire à l'égalité entre l'homme et la femme ; en France, un mariage ne prend fin que par un divorce, devant un juge ou par consentement mutuel devant un notaire.", "source": "https://www.lemondedudroit.fr/droit-civil/290-famille/40480-repudiation-atteinte-a-lordre-public-francais.html"}, {"q": "Les impôts permettent de financer les dépenses publiques. Quelle proposition est correcte ?", "options": ["Chacun y participe selon ses revenus", "Seuls les citoyens français paient des impôts", "Payer ses impôts est facultatif", "Tout le monde paie exactement le même montant"], "answer": 0, "explication": "Contribuer aux charges publiques est un devoir constitutionnel : tous les résidents, pas seulement les Français, financent les services publics selon leurs moyens, en déclarant leurs revenus et en payant leurs impôts.", "source": "Livret du citoyen 2026, p. 34"}, {"q": "Peut-on brûler publiquement un drapeau français ?", "options": ["Oui, c'est toujours permis au nom de la liberté d'expression", "Non, c'est un outrage au drapeau, interdit par la loi", "Oui, uniquement le 14 juillet", "Oui, si l'on est propriétaire du drapeau"], "answer": 1, "explication": "Le Code pénal sanctionne l'outrage au drapeau tricolore ou à l'hymne national, notamment lorsqu'il est commis lors d'une manifestation publique.", "source": "Livret du citoyen 2026, p. 33"}, {"q": "Que fait l’État pour lutter contre les discriminations ?", "options": ["Il les autorise dans les entreprises privées", "Il ne s'en occupe pas, c'est une affaire privée", "Il les interdit par la loi et les sanctionne", "Il les tolère si elles sont justifiées par la religion"], "answer": 2, "explication": "La France condamne les discriminations, qui sont punies par la loi ; l'État lutte activement contre le sexisme, le racisme, l'antisémitisme… et le Défenseur des droits peut être saisi en cas de discrimination (p. 30).", "source": "Livret du citoyen 2026, p. 6"}, {"q": "Que représente Marianne ?", "options": ["La première reine de France", "Une sainte catholique", "L'épouse d'un président", "La République française"], "answer": 3, "explication": "Marianne, femme portant un bonnet phrygien (symbole de la liberté), est le symbole de la République ; sa statue est présente dans toutes les mairies.", "source": "Livret du citoyen 2026, p. 8"}, {"q": "Qu'est-ce que la liberté d'association ?", "options": ["Le droit pour chacun, Français ou étranger, de créer une association ou d'y adhérer", "L'obligation d'adhérer à un parti politique", "Un droit réservé aux personnes de nationalité française", "L'obligation d'être membre d'un syndicat"], "answer": 0, "explication": "La loi du 1er juillet 1901 reconnaît à chacun le droit de créer ou de rejoindre une association ; ce droit n'est pas réservé aux Français.", "source": "Livret du citoyen 2026, p. 31"}, {"q": "Qu'est-ce que la liberté ?", "options": ["Pouvoir faire tout ce que l'on veut, sans aucune limite", "Pouvoir faire tout ce qui ne nuit pas à autrui", "Pouvoir ne pas respecter les lois avec lesquelles on n'est pas d'accord", "Un droit réservé aux citoyens français"], "answer": 1, "explication": "L'article 4 de la DDHC de 1789 proclame que « la liberté consiste à pouvoir faire tout ce qui ne nuit pas à autrui », dans les limites définies par la loi.", "source": "Livret du citoyen 2026, p. 6"}, {"q": "Qu'est-ce que la Marseillaise ?", "options": ["La devise de la République", "Le nom de la fête nationale", "L'hymne national de la France", "Un monument de Marseille"], "answer": 2, "explication": "La Marseillaise, écrite en 1792 par Rouget de Lisle, est l'hymne national ; elle est étudiée par les enfants à l'école primaire.", "source": "Livret du citoyen 2026, p. 8"}, {"q": "Sur quel document peut-on voir Marianne ?", "options": ["Un ticket de cinéma", "Une facture d'électricité", "Un contrat de location", "La carte nationale d'identité"], "answer": 3, "explication": "Marianne apparaît sur les documents de l'administration française, dont la carte nationale d'identité.", "source": "Livret du citoyen 2026, p. 8"}, {"q": "Un employeur refuse d’embaucher des femmes dans son entreprise. Que dit la loi ?", "options": ["C'est une discrimination interdite et punie par la loi", "C'est autorisé dans une entreprise privée", "C'est autorisé si l'employeur l'indique dans l'offre d'emploi", "C'est autorisé si l'entreprise a moins de 10 salariés"], "answer": 0, "explication": "Le sexe fait partie des critères de discrimination punis par la loi : toute décision d'un employeur (embauche, promotion…) doit reposer sur des raisons professionnelles.", "source": "Livret du citoyen 2026, p. 7"}, {"q": "Une des valeurs de la devise républicaine est l'égalité. Qu'est-ce que cela signifie ?", "options": ["Tout le monde doit gagner le même salaire", "La loi est la même pour tous, sans distinction", "Les hommes ont plus de droits que les femmes", "Les droits dépendent de la religion de chacun"], "answer": 1, "explication": "Tous les citoyens ont les mêmes droits quels que soient leur sexe, leur origine, leur religion ou leurs opinions ; la loi est la même pour tous (Charte, p. 80).", "source": "Livret du citoyen 2026, p. 6"}, {"q": "Quelle est la place de la langue française dans la République ?", "options": ["Le français et l'anglais sont les deux langues officielles", "Chaque région choisit sa langue officielle", "Le français est la seule langue officielle de la République", "Il n'existe pas de langue officielle en France"], "answer": 2, "explication": "La France a une seule langue officielle : le français, qui fait partie des symboles de la République.", "source": "Livret du citoyen 2026, p. 10"}, {"q": "Quels sont des symboles officiels de la République française ?", "options": ["Le coq, la tour Eiffel et la baguette", "La tour Eiffel, le Louvre et l'Arc de triomphe", "Le lion, l'aigle et la fleur de lys", "Le drapeau tricolore, la Marseillaise et Marianne"], "answer": 3, "explication": "Le drapeau tricolore, la Marseillaise, Marianne, la devise, le 14 juillet et la langue française sont des symboles de la République ; le coq n'a pas de statut officiel.", "source": "Livret du citoyen 2026, p. 8"}, {"q": "A-t-on le droit d'insulter publiquement quelqu’un parce qu’il est différent (handicap, apparence physique, sexe…) ?", "options": ["Non, c'est interdit et puni par la loi", "Oui, au nom de la liberté d'expression", "Oui, si c'est sur internet", "Oui, si la personne n'est pas française"], "answer": 0, "explication": "La liberté d'expression a des limites : les injures publiques et l'incitation à discriminer sont interdites, et les discriminations liées par exemple au sexe ou à l'apparence physique sont punies (p. 6).", "source": "Livret du citoyen 2026, p. 12"}, {"q": "Le régime de la France est :", "options": ["Une monarchie absolue", "Une République démocratique", "Une dictature militaire", "Une théocratie"], "answer": 1, "explication": "Selon l'article 1er de la Constitution de 1958, « la France est une République indivisible, laïque, démocratique et sociale ».", "source": "Livret du citoyen 2026, p. 10"}, {"q": "Pourquoi le principe de laïcité doit-il être respecté à l'école ?", "options": ["Pour interdire aux élèves d'avoir une religion", "Pour imposer une religion officielle", "Pour garantir la liberté de conscience des élèves et les protéger de toute pression", "Pour que seuls les élèves croyants puissent étudier"], "answer": 2, "explication": "La laïcité à l'école garantit la liberté de conscience des élèves : ils peuvent penser librement et se forger leurs opinions à l'abri des pressions et des influences.", "source": "Livret du citoyen 2026, p. 13"}, {"q": "En quelle année la loi de séparation des Églises et de l'Etat a-t-elle été votée ?", "options": ["1789", "1848", "1958", "1905"], "answer": 3, "explication": "La loi de 1905 sépare les Églises et l'État : l'État ne soutient aucune organisation religieuse et n'intervient pas dans leur fonctionnement.", "source": "Livret du citoyen 2026, p. 11"}, {"q": "Une personne a-t-elle le droit de ne pas croire en une religion ?", "options": ["Oui, chacun est libre de croire ou de ne pas croire", "Non, chaque personne doit avoir une religion", "Oui, mais seulement les citoyens français", "Non, sauf autorisation de la mairie"], "answer": 0, "explication": "La laïcité garantit la liberté de conscience : chacun est libre d'avoir ou de ne pas avoir de religion (athée, agnostique…).", "source": "Livret du citoyen 2026, p. 10"}, {"q": "Quel droit est garanti par la laïcité ?", "options": ["Le droit de vote des étrangers", "La liberté de conscience", "Le droit d'imposer sa religion aux autres", "Le droit de refuser une loi pour motif religieux"], "answer": 1, "explication": "La laïcité garantit la liberté de conscience pour tous : avoir une religion, ne pas en avoir, en changer ou l'abandonner.", "source": "Livret du citoyen 2026, p. 10"}, {"q": "À l'école publique, qui peut porter des signes religieux très visibles ?", "options": ["Les élèves", "Les enseignants", "Ni les élèves ni les personnels de l'école", "Le directeur de l'école"], "answer": 2, "explication": "La loi du 15 mars 2004 interdit aux élèves les signes religieux ostensibles (les signes discrets restent autorisés), et les personnels de l'Éducation nationale sont neutres.", "source": "Livret du citoyen 2026, p. 13"}, {"q": "Selon le principe de laïcité, que signifie la neutralité de l’État ?", "options": ["L'État interdit toutes les religions", "L'État finance en priorité la religion majoritaire", "L'État nomme les responsables religieux", "L'État ne reconnaît, ne salarie et ne subventionne aucun culte"], "answer": 3, "explication": "L'État ne soutient aucune organisation religieuse, ne finance ni édifice ni personnel religieux et traite toutes les religions de la même manière (sauf exceptions historiques en Alsace-Moselle).", "source": "Livret du citoyen 2026, p. 11"}, {"q": "Que peut faire un usager du service public dans une mairie ?", "options": ["Porter un signe religieux, en respectant les règles du service", "Exiger un agent de la même religion que lui", "Faire du prosélytisme au guichet", "Demander que le service s'adapte à sa religion"], "answer": 0, "explication": "La neutralité ne s'impose pas aux usagers : ils peuvent porter un signe religieux dans un service public en respectant ses règles, mais ne peuvent pas exiger une adaptation du service au nom d'une religion.", "source": "Livret du citoyen 2026, p. 12"}, {"q": "Qui doit respecter le principe de neutralité religieuse dans une préfecture ?", "options": ["Les étrangers qui viennent demander un titre de séjour", "Les agents qui travaillent à la préfecture", "Toutes les personnes présentes, usagers compris", "Personne, la neutralité n'existe pas en préfecture"], "answer": 1, "explication": "Les personnes qui travaillent dans les services publics doivent rester neutres ; la neutralité ne s'impose pas aux usagers.", "source": "Livret du citoyen 2026, p. 12"}, {"q": "La laïcité impose-t-elle aux agents publics d'être neutres vis-à-vis des usagers ?", "options": ["Non, ils peuvent afficher leur religion au guichet", "Oui, mais seulement envers les usagers français", "Oui, ils ne doivent pas manifester leurs convictions religieuses, politiques ou philosophiques", "Non, seuls les enseignants doivent être neutres"], "answer": 2, "explication": "Les agents publics doivent rester neutres et ne pas montrer leurs opinions ou croyances pendant leur travail : c'est une condition du traitement équitable des usagers.", "source": "Livret du citoyen 2026, p. 12"}, {"q": "Que garantit le principe de laïcité ?", "options": ["La supériorité d'une religion sur les autres", "L'interdiction de toute pratique religieuse", "Le financement des cultes par l'État", "La liberté de croire ou de ne pas croire et l'égalité de tous quelles que soient leurs convictions"], "answer": 3, "explication": "La laïcité garantit la liberté de conscience et le libre exercice des cultes, et impose que la loi soit la même pour tous, quelles que soient sa religion ou ses convictions (p. 11).", "source": "Livret du citoyen 2026, p. 10"}, {"q": "A-t-on le droit de changer de religion ?", "options": ["Oui, chacun peut changer de religion ou l'abandonner", "Non, c'est interdit par la loi", "Oui, mais avec l'autorisation de sa famille", "Oui, mais uniquement avec l'accord d'un juge"], "answer": 0, "explication": "La liberté de conscience inclut le droit de changer de religion (se convertir) ou de ne plus en avoir.", "source": "Livret du citoyen 2026, p. 10"}, {"q": "Que représente la laïcité ?", "options": ["Une religion officielle de l'État", "Un principe constitutionnel de la République", "Une simple opinion personnelle", "Une loi contre les religions"], "answer": 1, "explication": "La laïcité est un principe essentiel de la République, de valeur constitutionnelle (article 1er de la Constitution) ; elle est célébrée le 9 décembre.", "source": "Livret du citoyen 2026, p. 10"}, {"q": "Qu'est ce qui est interdit par la Charte de la laïcité à l'école ?", "options": ["Parler de religion entre élèves, dans le respect des autres", "Étudier l'histoire des religions en cours", "Le port par les élèves de signes ou tenues manifestant ostensiblement une appartenance religieuse", "Avoir une religion en dehors de l'école"], "answer": 2, "explication": "La Charte de la laïcité à l'École reprend la loi de 2004 : interdiction des signes ou tenues montrant ostensiblement sa religion, et impossibilité de refuser un enseignement au nom de sa religion.", "source": "Livret du citoyen 2026, p. 13"}, {"q": "Que dit l'article 1er de la Constitution française ?", "options": ["La France est une monarchie constitutionnelle", "La France est une République fédérale et religieuse", "Le catholicisme est la religion officielle de la France", "La France est une République indivisible, laïque, démocratique et sociale"], "answer": 3, "explication": "L'article 1er de la Constitution du 4 octobre 1958 dispose : « La France est une République indivisible, laïque, démocratique et sociale ».", "source": "Livret du citoyen 2026, p. 10"}]}, {"theme": "Système institutionnel et politique", "questions": [{"q": "Qu'est-ce que l'État de droit ?", "options": ["Un État où le chef de l'État décide seul des lois", "Un État où tout le monde, y compris les dirigeants, doit respecter le droit", "Un État où chacun peut faire sa propre loi", "Un État dirigé par des juges non élus"], "answer": 1, "explication": "Le livret définit l'État de droit comme un système où la loi doit être respectée par tous, y compris par l'État. Il s'oppose à l'État arbitraire.", "source": "Livret du citoyen 2026, p. 16"}, {"q": "Le président de la République a commis un crime. Quelle proposition est correcte ?", "options": ["Il n'est pas au-dessus des lois : il pourra être poursuivi en justice, au plus tard après son mandat", "Il ne pourra jamais être jugé", "Il peut se juger lui-même", "Il peut effacer son crime par un décret"], "answer": 0, "explication": "Pendant son mandat, le président est protégé des poursuites (il peut toutefois être destitué), mais ces poursuites reprennent un mois après la fin de ses fonctions. Le président reste soumis à la loi.", "source": "https://www.justice.gouv.fr/node/1910"}, {"q": "La loi est l'expression de :", "options": ["La volonté du président de la République", "La volonté des juges", "La volonté des religions", "La volonté générale"], "answer": 3, "explication": "Selon l'article 6 de la Déclaration des droits de l'homme et du citoyen de 1789, reproduite dans le livret, la loi est l'expression de la volonté générale ; tout citoyen doit donc la respecter.", "source": "Livret du citoyen 2026, p. 78"}, {"q": "Quelle est la durée du mandat du conseil municipal et du maire ?", "options": ["2 ans", "4 ans", "6 ans", "10 ans"], "answer": 2, "explication": "Chaque commune est gérée par un maire et un conseil municipal élus pour six ans.", "source": "Livret du citoyen 2026, p. 19"}, {"q": "Que garantit l’État de droit ?", "options": ["Le pouvoir absolu du président", "Le respect des droits de chacun et l'égalité de tous devant la loi, sous le contrôle de juges indépendants", "L'impunité des ministres", "Le droit pour chacun de se faire justice soi-même"], "answer": 1, "explication": "Selon le livret, les principes de l'État de droit sont la protection des libertés fondamentales, la séparation des trois pouvoirs et l'indépendance de la justice. La loi s'impose à tous, y compris à l'État.", "source": "Livret du citoyen 2026, p. 16"}, {"q": "Une personne peut-elle voter à la place d'une autre ?", "options": ["Oui, seulement si cette autre personne lui a donné une procuration", "Oui, toujours, si elle est de la même famille", "Oui, si elle présente la carte d'identité de l'autre", "Non, jamais, même avec une procuration"], "answer": 0, "explication": "Le vote est personnel. On ne peut voter pour quelqu'un d'autre que si cette personne a fait une procuration de vote.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/systeme-institutionnel-et-politique/democratie-et-droit-de-vote/democratie-et-droit-de-vote-les-conditions-pour-voter-en-france-1/"}, {"q": "Est-ce que le vote est obligatoire ?", "options": ["Oui, sous peine de prison", "Oui, sous peine d'amende", "Oui, seulement pour l'élection présidentielle", "Non, voter est un droit et non une obligation"], "answer": 3, "explication": "Le vote n'est pas obligatoire en France (contrairement à certains pays), mais c'est un devoir civique important qui donne leur légitimité aux élus.", "source": "Livret du citoyen 2026, p. 34"}, {"q": "À la fin de son mandat, le président de la République peut-il décider de rester au pouvoir ?", "options": ["Oui, s'il le souhaite", "Oui, si le Premier ministre est d'accord", "Non, il doit respecter la durée de son mandat fixée par la Constitution", "Oui, s'il déclare l'état d'urgence"], "answer": 2, "explication": "Le président est élu au suffrage universel direct pour cinq ans, mandat renouvelable une seule fois : il ne peut pas prolonger seul son mandat.", "source": "Livret du citoyen 2026, p. 16"}, {"q": "Qui dirige l'action du Gouvernement ?", "options": ["Le président du Sénat", "Le Premier ministre", "Le préfet de Paris", "Le président du Conseil constitutionnel"], "answer": 1, "explication": "Le Gouvernement est nommé sur proposition du Premier ministre, qui en dirige l'action.", "source": "Livret du citoyen 2026, p. 16"}, {"q": "Qui nomme le Premier ministre ?", "options": ["Le président de la République", "Les députés, par un vote", "Les citoyens, par une élection", "Le Conseil constitutionnel"], "answer": 0, "explication": "Le président de la République nomme le Premier ministre ; le Gouvernement est issu de la majorité aux élections législatives.", "source": "Livret du citoyen 2026, p. 18"}, {"q": "Quelle est l'organisation administrative de la France ?", "options": ["Un État fédéral composé de provinces autonomes", "Un pays divisé uniquement en cantons", "Un État où Paris décide seul de tout, sans collectivités locales", "Un État décentralisé organisé en communes, départements et régions"], "answer": 3, "explication": "Dans le cadre de la décentralisation, l'État transfère des compétences et des moyens aux collectivités territoriales : communes, départements, régions et collectivités d'outre-mer.", "source": "Livret du citoyen 2026, p. 19"}, {"q": "Qu'est-ce que le pouvoir législatif ? Le pouvoir :", "options": ["De juger les personnes", "D'appliquer les lois", "De voter les lois", "De commander l'armée"], "answer": 2, "explication": "Le pouvoir législatif consiste à élaborer et voter les lois ; il est exercé par les députés et les sénateurs.", "source": "Livret du citoyen 2026, p. 16"}, {"q": "Pourquoi séparer les trois pouvoirs dans une démocratie ?", "options": ["Pour que les élections soient moins fréquentes", "Pour éviter qu'une seule personne ou institution concentre tout le pouvoir et en abuse", "Pour donner tout le pouvoir au président", "Pour que les juges écrivent les lois"], "answer": 1, "explication": "La séparation des trois pouvoirs (législatif, exécutif, judiciaire) est un principe de l'État de droit : chaque pouvoir est confié à une institution différente, ce qui évite qu'une seule les concentre et protège les libertés.", "source": "Livret du citoyen 2026, p. 16"}, {"q": "Qui sanctionne l'auteur d'un vol ?", "options": ["Le juge (la justice pénale)", "Le maire", "La victime elle-même", "Le préfet"], "answer": 0, "explication": "La justice est rendue par les juges : elle sanctionne les infractions aux règles de droit par des peines prévues par la loi (emprisonnement, amende…).", "source": "Livret du citoyen 2026, p. 17"}, {"q": "Quel est le rôle du gouvernement ?", "options": ["Voter les lois", "Juger les citoyens", "Élire le président de la République", "Déterminer et conduire la politique de la nation et faire appliquer les lois"], "answer": 3, "explication": "Le pouvoir exécutif, exercé par le Gouvernement, consiste à définir la politique de la Nation et à mettre en œuvre les lois.", "source": "Livret du citoyen 2026, p. 16"}, {"q": "Que se passe-t-il si un ministre ne respecte pas la loi ?", "options": ["Rien, les ministres sont au-dessus des lois", "Il est protégé jusqu'à la fin de sa vie", "Il peut être poursuivi et jugé, comme tout citoyen", "Seul le président peut décider de le punir"], "answer": 2, "explication": "Un ministre n'est pas au-dessus des lois. Pour les infractions liées à ses fonctions, il est jugé par la Cour de justice de la République ; pour les autres, par les tribunaux ordinaires.", "source": "https://www.publicsenat.fr/actualites/politique/comment-fonctionne-la-cour-de-justice-de-la-republique-187060"}, {"q": "Combien de députés composent l’Assemblée nationale ?", "options": ["100", "577", "348", "1 000"], "answer": 1, "explication": "Les 577 députés de l'Assemblée nationale sont élus au suffrage universel direct tous les cinq ans. (348 est le nombre de sénateurs.)", "source": "Livret du citoyen 2026, p. 16"}, {"q": "Qui peut voter aux élections en France ?", "options": ["Les citoyens français majeurs, jouissant de leurs droits civiques et inscrits sur les listes électorales", "Toutes les personnes qui habitent en France, quelle que soit leur nationalité", "Uniquement les personnes nées en France", "Uniquement les personnes qui paient des impôts"], "answer": 0, "explication": "Pour voter, il faut avoir la nationalité française, être majeur (18 ans), ne pas avoir été privé de ses droits civiques et être inscrit sur les listes électorales. Les ressortissants de l'UE peuvent voter aux municipales et aux européennes.", "source": "Livret du citoyen 2026, p. 17"}, {"q": "Pour combien de temps sont élus les sénateurs ?", "options": ["2 ans", "5 ans", "9 ans", "6 ans"], "answer": 3, "explication": "Les 348 sénateurs sont élus au suffrage universel indirect pour un mandat de six ans.", "source": "Livret du citoyen 2026, p. 16"}, {"q": "La séparation des pouvoirs est un principe fondamental. Quels sont les trois pouvoirs concernés ?", "options": ["Le pouvoir religieux, le pouvoir militaire et le pouvoir économique", "Le pouvoir municipal, le pouvoir départemental et le pouvoir régional", "Le pouvoir législatif, le pouvoir exécutif et le pouvoir judiciaire", "Le pouvoir médiatique, le pouvoir syndical et le pouvoir politique"], "answer": 2, "explication": "Les trois pouvoirs sont le législatif (élaborer et voter les lois : députés et sénateurs), l'exécutif (définir la politique de la Nation et mettre en œuvre les lois : gouvernement) et le judiciaire (rendre la justice : les juges).", "source": "Livret du citoyen 2026, p. 16"}, {"q": "Est-ce que le président de la République a tous les pouvoirs ?", "options": ["Oui, il fait les lois et juge les citoyens", "Non, les pouvoirs sont séparés et limités par la Constitution", "Oui, mais seulement en temps de paix", "Oui, s'il a été élu avec plus de 50 % des voix"], "answer": 1, "explication": "La séparation des trois pouvoirs est un principe de l'État de droit : le Parlement vote les lois, le Gouvernement les met en œuvre et les juges rendent la justice.", "source": "Livret du citoyen 2026, p. 16"}, {"q": "Qui est le préfet ?", "options": ["Le représentant de l'État dans le département", "Le chef de la police municipale", "Un élu qui dirige la région", "Le juge principal du département"], "answer": 0, "explication": "Dans les territoires, l'État est représenté par les préfets de région et de département.", "source": "Livret du citoyen 2026, p. 19"}, {"q": "Quelle condition est nécessaire pour voter aux élections ?", "options": ["Être propriétaire de son logement", "Avoir un emploi", "Être marié", "Être majeur (avoir au moins 18 ans)"], "answer": 3, "explication": "Pour voter, il faut notamment être majeur, c'est-à-dire avoir au moins 18 ans, en plus de la nationalité, des droits civiques et de l'inscription sur les listes électorales.", "source": "Livret du citoyen 2026, p. 17"}, {"q": "Qui dirige la commune ?", "options": ["Le préfet", "Le président de la région", "Le maire, avec le conseil municipal", "Le Premier ministre"], "answer": 2, "explication": "Chaque commune est gérée par un maire et un conseil municipal élus pour six ans.", "source": "Livret du citoyen 2026, p. 19"}, {"q": "Quel est le régime politique de la France aujourd'hui ?", "options": ["Une monarchie", "Une république démocratique (la Ve République)", "Un empire", "Une dictature"], "answer": 1, "explication": "La Constitution de la Ve République, adoptée par référendum le 28 septembre 1958 et promulguée le 4 octobre 1958, fonde encore aujourd'hui le régime politique de la France, une république démocratique.", "source": "Livret du citoyen 2026, p. 45"}, {"q": "Qu'est-ce que l'Hôtel de Matignon ?", "options": ["La résidence et le lieu de travail du Premier ministre", "La résidence du président de la République", "Le siège du Sénat", "Le siège de l'Assemblée nationale"], "answer": 0, "explication": "Le Premier ministre réside et travaille à l'Hôtel de Matignon ; le président de la République, lui, réside au palais de l'Élysée.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/systeme-institutionnel-et-politique/etat-de-droit-et-separation-des-pouvoirs/etat-de-droit-et-separation-des-pouvoirs-presentation-des-3-pouvoirs-1/"}, {"q": "Le Parlement est composé :", "options": ["Du président et du Premier ministre", "Des ministres et des préfets", "Du Conseil d'État et de la Cour de cassation", "De l'Assemblée nationale et du Sénat"], "answer": 3, "explication": "Le Parlement est composé de l'Assemblée nationale (577 députés) et du Sénat (348 sénateurs) ; il vote les lois et contrôle le Gouvernement.", "source": "Livret du citoyen 2026, p. 16"}, {"q": "Quel est le rôle du président de la République ?", "options": ["Il vote les lois à la place du Parlement", "Il juge les crimes", "Il est le chef de l'État et des armées et nomme le Gouvernement", "Il dirige la commune de Paris"], "answer": 2, "explication": "Le président de la République, élu pour cinq ans, est le chef de l'État et des armées ; il nomme le Gouvernement sur proposition du Premier ministre.", "source": "Livret du citoyen 2026, p. 16"}, {"q": "Quel est le rôle du Premier ministre ?", "options": ["Il vote les lois avec les députés", "Il dirige l'action du Gouvernement et assure l'exécution des lois", "Il préside le Parlement européen", "Il juge les ministres"], "answer": 1, "explication": "Le Premier ministre dirige l'action du Gouvernement, qui définit la politique de la Nation et met en œuvre les lois.", "source": "Livret du citoyen 2026, p. 16"}, {"q": "Qui est le chef du Gouvernement ?", "options": ["Le Premier ministre", "Le président de l'Assemblée nationale", "Le maire de Paris", "Le ministre de l'Intérieur"], "answer": 0, "explication": "Le Premier ministre dirige l'action du Gouvernement (les ministres) : il en est le chef.", "source": "Livret du citoyen 2026, p. 16"}, {"q": "Combien y a-t-il de régions en France ?", "options": ["8", "36", "101", "18 (13 en métropole et 5 en outre-mer)"], "answer": 3, "explication": "La France compte 13 régions métropolitaines et 5 régions d'outre-mer, soit 18 régions en tout. (101 est le nombre de départements.)", "source": "Livret du citoyen 2026, p. 19"}, {"q": "Quel est le rôle du Défenseur des droits ?", "options": ["Défendre les accusés devant le tribunal à la place d'un avocat", "Voter les lois sur les droits de l'homme", "Défendre les personnes dont les droits ne sont pas respectés et lutter contre les discriminations", "Délivrer les titres de séjour"], "answer": 2, "explication": "Le Défenseur des droits, autorité administrative indépendante créée en 2011, intervient en cas de litige avec une administration, de discrimination ou d'atteinte aux droits.", "source": "Livret du citoyen 2026, p. 30"}, {"q": "Depuis quand l'euro est-elle la monnaie unique ?", "options": ["1957", "2002", "1981", "2012"], "answer": 1, "explication": "Les pièces et billets en euros sont en circulation depuis le 1er janvier 2002, d'abord dans 12 pays de l'UE ; la France partage aujourd'hui cette monnaie avec 20 autres pays.", "source": "Livret du citoyen 2026, p. 23"}, {"q": "Quel est le rôle principal du département ?", "options": ["L'action sociale (protection de l'enfance, aide aux personnes âgées) et la gestion des collèges publics", "La gestion des lycées et des universités", "La défense nationale", "Le vote des lois"], "answer": 0, "explication": "Les départements sont notamment responsables des collèges publics, de l'action sociale, des routes départementales, de la protection de l'enfance et de l'aide aux personnes âgées.", "source": "Livret du citoyen 2026, p. 19"}, {"q": "Quel est le rôle principal des communes ?", "options": ["Gérer les lycées", "Diriger la politique étrangère", "Commander la gendarmerie nationale", "Gérer les services de proximité : écoles maternelles et élémentaires, routes communales, état civil"], "answer": 3, "explication": "Les communes s'occupent notamment des écoles maternelles et élémentaires publiques, des activités sportives et culturelles, des routes communales et de l'état civil (naissances, mariages, décès).", "source": "Livret du citoyen 2026, p. 19"}, {"q": "Combien de communes environ existe-t-il en France ?", "options": ["Environ 3 500", "Environ 350 000", "Environ 35 000", "Environ 1 000"], "answer": 2, "explication": "La France compte 34 875 communes au 1er janvier 2025, soit environ 35 000.", "source": "Livret du citoyen 2026, p. 19"}, {"q": "Quel traité concerne la construction de l'Union européenne ?", "options": ["Le traité de Versailles", "Le traité de Maastricht", "Le traité de l'Atlantique Nord", "Le traité de Verdun"], "answer": 1, "explication": "Signé en 1992, le traité de Maastricht crée l'Union européenne ; il fait suite au traité de Rome de 1957 qui avait instauré la CEE.", "source": "Livret du citoyen 2026, p. 22"}, {"q": "Quel État a quitté l'Union européenne en 2020 ?", "options": ["Le Royaume-Uni", "La Suisse", "La Norvège", "La Grèce"], "answer": 0, "explication": "En 2020, le Royaume-Uni (entré en 1973) a quitté l'Union européenne : c'est le Brexit. L'UE compte depuis 27 États membres.", "source": "Livret du citoyen 2026, p. 22"}, {"q": "Quelle est la devise de l’Union européenne ?", "options": ["« Liberté, Égalité, Fraternité »", "« L'union fait la force »", "« Paix et prospérité »", "« Unie dans la diversité »"], "answer": 3, "explication": "La devise de l'Union européenne est « Unie dans la diversité ». « Liberté, Égalité, Fraternité » est la devise de la République française.", "source": "Livret du citoyen 2026, p. 23"}, {"q": "Quel est l'hymne de l'Union européenne ?", "options": ["« La Marseillaise »", "« Le Chant des partisans »", "L'« Ode à la joie » de Beethoven", "« Les Quatre Saisons » de Vivaldi"], "answer": 2, "explication": "L'hymne européen est l'« Ode à la joie », extrait de la Neuvième symphonie de Beethoven, adopté en 1985 ; il symbolise la liberté, la paix et la solidarité.", "source": "Livret du citoyen 2026, p. 23"}, {"q": "De quoi est composé le drapeau européen ?", "options": ["De 27 étoiles, une par pays membre", "De 12 étoiles jaunes disposées en cercle sur fond bleu", "De trois bandes verticales bleu, blanc, rouge", "D'une seule grande étoile jaune au centre"], "answer": 1, "explication": "Le drapeau européen compte 12 étoiles, qui symbolisent l'unité et l'harmonie entre les Européens ; ce nombre ne correspond pas au nombre de pays membres (27).", "source": "Livret du citoyen 2026, p. 22"}, {"q": "De quelle couleur est le drapeau européen ?", "options": ["Bleu, avec des étoiles jaunes", "Rouge, avec des étoiles blanches", "Vert, avec des étoiles bleues", "Blanc, avec des étoiles rouges"], "answer": 0, "explication": "Le drapeau européen est bleu, avec un cercle de 12 étoiles jaunes.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/systeme-institutionnel-et-politique/institutions-europeennes/les-symboles-europeens-1/"}, {"q": "En quelle année le traité de Maastricht, qui marque la fondation de l'Union européenne, a-t-il été signé ?", "options": ["1945", "1968", "2010", "1992"], "answer": 3, "explication": "C'est en 1992, avec la signature du traité de Maastricht, que l'Union européenne est créée.", "source": "Livret du citoyen 2026, p. 22"}, {"q": "Où est le siège du Parlement européen ?", "options": ["À Genève", "À Berlin", "À Strasbourg", "À Rome"], "answer": 2, "explication": "Le Parlement européen siège à Strasbourg, en France ; ses députés sont élus tous les cinq ans.", "source": "Livret du citoyen 2026, p. 23"}, {"q": "Où est le siège de la Commission européenne ?", "options": ["À Strasbourg", "À Bruxelles", "À Paris", "À Francfort"], "answer": 1, "explication": "La Commission européenne, organe exécutif de l'Union, est située à Bruxelles (Belgique). Le Parlement européen siège à Strasbourg et la BCE à Francfort.", "source": "Livret du citoyen 2026, p. 23"}, {"q": "Quel État n'est pas membre de l'Union européenne ?", "options": ["La Suisse", "L'Italie", "La Pologne", "Le Portugal"], "answer": 0, "explication": "La Suisse n'est pas membre de l'UE (elle est seulement associée à l'espace Schengen). L'Italie est un pays fondateur (1957), le Portugal est entré en 1986 et la Pologne en 2004.", "source": "Livret du citoyen 2026, p. 22"}, {"q": "Quand célèbre-t-on la journée de l'Europe ?", "options": ["Le 14 juillet", "Le 1er janvier", "Le 11 novembre", "Le 9 mai"], "answer": 3, "explication": "La journée de l'Europe est célébrée le 9 mai, en souvenir de la déclaration de Robert Schuman du 9 mai 1950, considérée comme l'acte de naissance de l'Union européenne.", "source": "Livret du citoyen 2026, p. 23"}, {"q": "À quelle fréquence les élections européennes sont-elles organisées ?", "options": ["Tous les ans", "Tous les 3 ans", "Tous les 5 ans", "Tous les 10 ans"], "answer": 2, "explication": "Tous les cinq ans, les citoyens européens élisent les députés du Parlement européen, qui siège à Strasbourg.", "source": "Livret du citoyen 2026, p. 23"}, {"q": "Quelle condition est nécessaire pour voter aux élections européennes ?", "options": ["Avoir une carte de résident de 10 ans", "Avoir la nationalité d'un pays de l'Union européenne", "Être né sur le continent européen", "Parler au moins deux langues européennes"], "answer": 1, "explication": "Pour voter aux élections du Parlement européen en France, il faut être français ou ressortissant d'un État membre de l'Union européenne ; un titre de séjour ne suffit pas.", "source": "Livret du citoyen 2026, p. 17"}, {"q": "Quel pays est un pays fondateur de l'Union européenne ?", "options": ["L'Italie", "L'Espagne", "Le Royaume-Uni", "La Pologne"], "answer": 0, "explication": "Les six pays fondateurs (1957) sont la France, l'Allemagne, l'Italie, la Belgique, les Pays-Bas et le Luxembourg. Le Royaume-Uni est entré en 1973, l'Espagne en 1986 et la Pologne en 2004.", "source": "Livret du citoyen 2026, p. 22"}]}, {"theme": "Droits et devoirs", "questions": [{"q": "À quelle liberté la PMA fait-elle référence ?", "options": ["La liberté de disposer de son corps et de choisir d'avoir un enfant", "La liberté de la presse", "La liberté de réunion", "La liberté du commerce et de l'industrie"], "answer": 0, "explication": "Le livret range la PMA dans le droit de disposer de son corps : la décision d'avoir un enfant est une liberté personnelle. Depuis la loi bioéthique du 2 août 2021, la PMA est ouverte à toutes les femmes (couples hétérosexuels, couples de femmes, femmes seules).", "source": "Livret du citoyen 2026, p. 29"}, {"q": "Au nom de quoi l'État justifie-t-il la restriction des droits ?", "options": ["Des intérêts du parti au pouvoir", "De l'ordre public et du respect des droits des autres", "De la religion majoritaire du pays", "Des préférences personnelles du président"], "answer": 1, "explication": "Les libertés peuvent être limitées pour éviter les troubles à l'ordre public (réunion, manifestation) et pour respecter les droits des autres (liberté d'expression). Ces restrictions se font dans le cadre de la loi et sous le contrôle du juge.", "source": "Livret du citoyen 2026, p. 30"}, {"q": "Concernant le droit de se marier, quelle proposition est correcte ?", "options": ["Des majeurs doivent obtenir l'accord de leurs parents pour se marier", "Le mariage est réservé aux couples composés d'un homme et d'une femme", "Chacun est libre de choisir son conjoint, quel que soit son sexe", "Un homme peut épouser plusieurs femmes"], "answer": 2, "explication": "Depuis la loi du 17 mai 2013, le mariage est ouvert aux couples de même sexe. Il est possible à partir de 18 ans ; la polygamie est interdite et constitue une infraction pénale.", "source": "Livret du citoyen 2026, p. 73"}, {"q": "Est-il toujours possible de divorcer ?", "options": ["Non, le mariage est définitif", "Oui, mais seulement si le mari est d'accord", "Oui, mais seulement après 20 ans de mariage", "Oui, devant un juge ou par consentement mutuel devant un notaire"], "answer": 3, "explication": "Les époux peuvent toujours se séparer : ils divorcent soit devant un juge, soit par consentement mutuel devant un notaire. L'autorité parentale reste exercée par les deux parents.", "source": "Livret du citoyen 2026, p. 73"}, {"q": "La peine de mort est :", "options": ["abolie en France depuis 1981", "appliquée en France pour les crimes les plus graves", "abolie en France depuis 1789", "décidée par le maire de la commune"], "answer": 0, "explication": "Depuis 1981, la peine de mort est interdite par la loi. Cette abolition a été portée par Robert Badinter, ministre de la Justice de François Mitterrand.", "source": "Livret du citoyen 2026, p. 46"}, {"q": "Laquelle de ces citations est inscrite dans la Déclaration des Droits de l'homme et du Citoyen de 1789 ?", "options": ["« La France est une République indivisible, laïque, démocratique et sociale. »", "« Les hommes naissent et demeurent libres et égaux en droits. »", "« Liberté, Égalité, Fraternité. »", "« Je pense, donc je suis. »"], "answer": 1, "explication": "« Les hommes naissent et demeurent libres et égaux en droits » est l'article 1er de la DDHC de 1789. La première proposition vient de l'article 1er de la Constitution de 1958, la troisième est la devise de la République et la dernière est de Descartes.", "source": "Livret du citoyen 2026, p. 14"}, {"q": "Le recours à l'avortement est-il autorisé ?", "options": ["Non, il est interdit en France", "Oui, mais seulement avec l'accord du conjoint", "Oui, l'IVG est légale en France et c'est une liberté garantie à la femme", "Oui, mais seulement pour les femmes de plus de 25 ans"], "answer": 2, "explication": "L'avortement est dépénalisé depuis la loi Veil du 17 janvier 1975 et, depuis le 8 mars 2024, la liberté de recourir à l'IVG est garantie par la Constitution, dans les conditions fixées par la loi.", "source": "Livret du citoyen 2026, p. 29"}, {"q": "Que contient la Constitution ?", "options": ["Le Code de la route", "La liste des impôts locaux de chaque commune", "Le règlement intérieur des entreprises", "L'organisation de l'État et les droits et libertés fondamentaux"], "answer": 3, "explication": "La Constitution fixe les droits et libertés des citoyens et explique comment les pouvoirs (gouvernement, Parlement, tribunaux) sont partagés et organisés.", "source": "Livret du citoyen 2026, p. 10"}, {"q": "Que garantit la liberté de la presse ?", "options": ["Le droit d'écrire, d'imprimer et de publier librement, en répondant des abus prévus par la loi", "L'obligation pour les journaux de soutenir le gouvernement", "Le contrôle de chaque article par la police avant sa publication", "Le droit de publier des propos diffamatoires sans être sanctionné"], "answer": 0, "explication": "Selon l'article 11 de la DDHC, la libre communication des pensées est un principe fondamental : la presse est libre et les journalistes peuvent informer et donner leur opinion. Cette liberté est encadrée par la loi : pas de propos diffamatoires, d'incitation aux crimes ou de contestation des crimes contre l'humanité.", "source": "Livret du citoyen 2026, p. 27"}, {"q": "Que prévoit la Charte de l'environnement ?", "options": ["L'interdiction totale des voitures en France", "Le droit de chacun de vivre dans un environnement équilibré et respectueux de la santé", "La suppression de toute activité industrielle", "Le droit de polluer à condition de payer une taxe"], "answer": 1, "explication": "La Charte de l'environnement de 2004, intégrée à la Constitution, reconnaît à chacun le droit de vivre dans un environnement équilibré et respectueux de la santé. Elle impose aussi à chacun le devoir de préserver l'environnement (article 2).", "source": "Livret du citoyen 2026, p. 31"}, {"q": "Que signifie la dignité humaine ?", "options": ["Seuls les citoyens français ont droit au respect", "Le respect dépend de l'origine ou de la religion de la personne", "Chaque personne mérite le respect du seul fait d'être un être humain", "Le respect n'est dû qu'aux personnes qui ont un emploi"], "answer": 2, "explication": "Le droit à la dignité humaine signifie qu'une personne ne doit jamais être traitée comme un objet ou un moyen. Ce principe est inscrit dans le préambule de la Constitution de 1946.", "source": "Livret du citoyen 2026, p. 28"}, {"q": "Que signifie le droit de manifester ?", "options": ["Le droit de dégrader des biens publics pour se faire entendre", "Le droit d'empêcher le passage des secours", "L'obligation de participer aux défilés officiels", "Le droit de se rassembler sur la voie publique pour exprimer pacifiquement une opinion"], "answer": 3, "explication": "Manifester est un moyen d'expression collective reconnu comme une liberté fondamentale. Pour éviter les troubles à l'ordre public, une manifestation doit être déclarée à l'administration (parcours, organisateurs).", "source": "Livret du citoyen 2026, p. 31"}, {"q": "Que signifie PMA ?", "options": ["Procréation médicalement assistée", "Protection maternelle et adoption", "Prestation médicale d'accompagnement", "Plan de maternité assistée"], "answer": 0, "explication": "La PMA (procréation médicalement assistée) aide à concevoir un enfant. Depuis la loi bioéthique du 2 août 2021, elle est ouverte à toutes les femmes : couples hétérosexuels, couples de femmes et femmes seules. La GPA reste interdite.", "source": "Livret du citoyen 2026, p. 29"}, {"q": "Quel texte est le plus difficile à modifier ?", "options": ["Un décret", "La Constitution", "Une loi ordinaire", "Un arrêté municipal"], "answer": 1, "explication": "La Constitution est tout en haut de la hiérarchie des normes, au-dessus de toutes les lois. Pour la modifier, il faut un référendum ou un vote du Parlement réuni en Congrès.", "source": "Livret du citoyen 2026, p. 16"}, {"q": "Quelle liberté permet à une personne de croire en la religion de son choix ?", "options": ["La liberté d'entreprendre", "La liberté de circulation", "La liberté de conscience et de religion", "La liberté syndicale"], "answer": 2, "explication": "La liberté de pensée, de conscience et de religion permet à chacun de choisir sa religion et de la pratiquer, ou de ne pas avoir de religion. L'article 10 de la DDHC précise que nul ne doit être inquiété pour ses opinions, même religieuses.", "source": "Livret du citoyen 2026, p. 26"}, {"q": "Qu'est-ce que le droit de grève ?", "options": ["Le droit pour l'employeur de fermer l'entreprise sans prévenir", "Le droit de bloquer les routes nationales", "Le droit de s'absenter seul pour des raisons personnelles", "Le droit d'arrêter collectivement le travail pour soutenir des revendications professionnelles"], "answer": 3, "explication": "La grève est une cessation collective et concertée du travail pour appuyer des revendications professionnelles (salaires, conditions de travail…). Tout salarié peut faire grève, syndiqué ou non.", "source": "https://www.service-public.gouv.fr/particuliers/vosdroits/F117"}, {"q": "Qu'est-ce que la Constitution ?", "options": ["Le texte juridique suprême qui fonde l'organisation de la République", "Un discours prononcé chaque année par le président", "Un règlement adopté par chaque mairie", "Un traité signé avec les pays voisins"], "answer": 0, "explication": "La Constitution est l'acte fondateur de l'État : un ensemble de règles fondamentales qui définissent comment le pays est organisé et dirigé. La Constitution actuelle est celle de la Ve République (4 octobre 1958).", "source": "Livret du citoyen 2026, p. 10"}, {"q": "Qui peut demander à avorter ?", "options": ["Seulement les femmes mariées", "Toute femme enceinte, majeure ou mineure", "Seulement les femmes de nationalité française", "Seulement les femmes majeures avec l'accord de leurs parents"], "answer": 1, "explication": "Toute femme enceinte, même mineure, peut demander l'arrêt de sa grossesse par une IVG dans les conditions fixées par la loi. Depuis le 8 mars 2024, cette liberté est garantie par la Constitution.", "source": "Livret du citoyen 2026, p. 29"}, {"q": "Une femme majeure de nationalité française a-t-elle le droit de voter aux élections ?", "options": ["Non, seuls les hommes votent", "Oui, mais seulement aux élections municipales", "Oui, les femmes ont le droit de vote depuis 1944", "Oui, mais seulement avec l'accord de son mari"], "answer": 2, "explication": "Les Françaises ont obtenu le droit de vote en avril 1944 et ont voté pour la première fois en avril 1945. Aujourd'hui, tous les citoyens français majeurs, femmes et hommes, peuvent voter.", "source": "Livret du citoyen 2026, p. 17"}, {"q": "Concernant l'utilisation des réseaux sociaux, quelle proposition est correcte ?", "options": ["On peut tout publier, car Internet n'est pas soumis à la loi", "Un message anonyme ne peut jamais être poursuivi", "On peut publier des insultes si le compte est privé", "La loi s'applique aussi en ligne : harceler, menacer ou insulter est puni"], "answer": 3, "explication": "La liberté d'expression sur les réseaux sociaux est protégée par la loi, mais les contenus qui incitent à la haine ou à la violence sont interdits. Le cyberharcèlement est un délit en ligne.", "source": "Livret du citoyen 2026, p. 26"}, {"q": "Jeter un mégot par terre est :", "options": ["une infraction punie d'une amende", "autorisé si le mégot est éteint", "un crime jugé par la cour d'assises", "un geste sans aucune conséquence"], "answer": 0, "explication": "Un mégot de cigarette est un déchet : il doit être jeté dans une poubelle, sous peine d'amende.", "source": "Livret du citoyen 2026, p. 65"}, {"q": "L'État peut-il limiter les droits et libertés ?", "options": ["Non, jamais", "Oui, dans les cas prévus par la loi, pour protéger l'ordre public ou les droits des autres", "Oui, à tout moment et sans justification", "Oui, mais seulement ceux des étrangers"], "answer": 1, "explication": "Les libertés ont des limites fixées par la loi : pour respecter les droits des autres (liberté d'expression) ou en cas de crise exceptionnelle comme un état d'urgence (liberté d'aller et venir).", "source": "Livret du citoyen 2026, p. 27"}, {"q": "Parmi ces actions, laquelle permet d'adopter une attitude respectueuse de l’environnement ?", "options": ["Laisser la lumière allumée en permanence", "Jeter ses piles usagées avec les ordures ménagères", "Économiser l'eau et l'énergie", "Déposer ses vieux meubles sur le trottoir"], "answer": 2, "explication": "Chacun doit contribuer à préserver l'environnement. Le livret cite des gestes simples pour économiser l'énergie : chauffage à 19 °C maximum, douches plus courtes, appareils éteints quand on ne s'en sert pas.", "source": "Livret du citoyen 2026, p. 67"}, {"q": "Quelle proposition constitue une obligation ?", "options": ["Adhérer à un parti politique", "Pratiquer une religion", "Posséder une voiture", "Payer ses impôts"], "answer": 3, "explication": "Tous les résidents, pas seulement les Français, doivent contribuer au financement des services publics : toute personne majeure non rattachée au foyer fiscal de ses parents doit déclarer ses revenus et payer ses impôts chaque année.", "source": "Livret du citoyen 2026, p. 34"}, {"q": "Pour quel motif peut-on limiter la liberté d'expression ?", "options": ["Pour protéger les droits des autres, par exemple contre l'injure, la diffamation ou l'incitation à la haine", "Pour empêcher de critiquer le gouvernement", "Pour interdire de parler une langue étrangère", "Pour empêcher de parler de religion en public"], "answer": 0, "explication": "La liberté d'expression a des limites pour respecter les droits des autres : il est interdit de diffuser des injures, des propos diffamatoires ou des provocations à la haine, ou de faire l'apologie de crimes contre l'humanité.", "source": "Livret du citoyen 2026, p. 27"}, {"q": "Pourquoi doit-on trier ses déchets ?", "options": ["Pour remplir plus vite les poubelles", "Pour permettre leur recyclage et protéger l'environnement", "Parce que le tri est réservé aux propriétaires", "Pour augmenter la quantité de déchets brûlés"], "answer": 1, "explication": "Le tri des déchets, organisé par les collectivités, s'impose à tous ; depuis 2024, celui des déchets verts et alimentaires est obligatoire. Il fait partie des gestes pour préserver l'environnement.", "source": "Livret du citoyen 2026, p. 66"}, {"q": "Que doit faire une victime de violences ?", "options": ["Garder le silence, car c'est une affaire privée", "Se faire justice elle-même", "En parler, appeler le 17 en cas d'urgence et porter plainte", "Attendre que la situation s'arrange d'elle-même"], "answer": 2, "explication": "Les victimes de violences peuvent porter plainte auprès de la police ou de la gendarmerie et demander de l'aide à des associations. En urgence, on appelle le 17 (police secours) ; le 3919 est le numéro pour les violences conjugales.", "source": "Livret du citoyen 2026, p. 69"}, {"q": "Que doit-on faire face aux ordres des policiers ou gendarmes ?", "options": ["Les ignorer si on n'est pas d'accord", "Leur résister physiquement", "Prendre la fuite", "Les respecter, quitte à les contester ensuite par les voies légales"], "answer": 3, "explication": "Il faut respecter les agents des forces de l'ordre dans leurs fonctions : refuser d'obéir à un ordre d'un policier ou d'un gendarme est un délit puni par la loi.", "source": "Livret du citoyen 2026, p. 33"}, {"q": "Quel est le rôle de la police ?", "options": ["Faire respecter la loi et protéger les personnes et les biens", "Voter les lois", "Juger et condamner les auteurs d'infractions", "Collecter les impôts"], "answer": 0, "explication": "La police et la gendarmerie assurent le maintien de l'ordre et la sécurité publique, mènent les enquêtes et ont des missions de prévention et d'assistance. Ce sont les juges qui sanctionnent les infractions.", "source": "Livret du citoyen 2026, p. 29"}, {"q": "Quel est un exemple d’assistance à personne en danger ?", "options": ["Filmer la scène sans intervenir", "Appeler les secours (15, 18 ou 112) pour une personne qui fait un malaise dans la rue", "Passer son chemin", "Attendre que quelqu'un d'autre réagisse"], "answer": 1, "explication": "L'assistance à personne en danger oblige chacun à porter secours à autrui, sans mettre sa propre vie en péril ; s'y soustraire est un délit. Alerter les secours (15 SAMU, 18 pompiers, 112) est un premier geste.", "source": "Livret du citoyen 2026, p. 36"}, {"q": "Quel exemple illustre une limitation de liberté pour protéger l'intérêt général ?", "options": ["L'interdiction de prier chez soi", "L'interdiction pour les femmes de travailler", "Les restrictions de déplacement pendant l'épidémie de Covid-19 en 2020", "L'obligation de voter pour un parti donné"], "answer": 2, "explication": "En cas de crise exceptionnelle et temporaire, comme un état d'urgence, l'État peut restreindre la liberté d'aller et venir pour protéger la population.", "source": "Livret du citoyen 2026, p. 27"}, {"q": "Quelle est l’attitude à avoir lorsque qu'on est témoin de violences ?", "options": ["Ne rien faire, ce n'est pas son affaire", "Frapper l'agresseur", "Publier une vidéo de la scène sur les réseaux sociaux", "Se protéger, alerter (17 ou 112) et aider la victime sans se mettre en danger"], "answer": 3, "explication": "Chacun doit porter secours à une personne en danger, dans la mesure où il peut le faire sans mettre sa propre vie en péril. Le témoin alerte la police (17) ou le numéro d'urgence européen (112).", "source": "Livret du citoyen 2026, p. 36"}, {"q": "Quelle est l'infraction la plus grave ?", "options": ["Le crime", "La contravention", "Le délit", "L'avertissement"], "answer": 0, "explication": "Les infractions sont classées en trois catégories : contraventions (les moins graves), délits et crimes (les plus graves). Les crimes sont punis d'une réclusion pouvant aller jusqu'à la perpétuité et jugés par la cour d'assises ou la cour criminelle.", "source": "Livret du citoyen 2026, p. 33"}, {"q": "Quelle obligation concerne toutes les personnes résidant en France quelle que soit leur nationalité ?", "options": ["Voter à toutes les élections", "Respecter les lois et payer ses impôts", "Effectuer la Journée défense et citoyenneté", "Être juré à la cour d'assises"], "answer": 1, "explication": "Toute personne vivant en France doit respecter les lois et contribuer, selon ses moyens, au financement des services publics en payant ses impôts. Le vote, la JDC et le jury d'assises sont réservés aux citoyens français.", "source": "Livret du citoyen 2026, p. 34"}, {"q": "Quelle proposition représente un exemple de crime ?", "options": ["Un excès de vitesse", "Un vol à l'étalage", "Un meurtre", "Le tapage nocturne"], "answer": 2, "explication": "Le meurtre, l'assassinat, le viol, le braquage ou le terrorisme sont des crimes. Le vol est un délit ; l'excès de vitesse et le tapage nocturne sont des contraventions.", "source": "Livret du citoyen 2026, p. 33"}, {"q": "Quelle proposition représente un exemple de délit ?", "options": ["Un meurtre", "Le stationnement gênant", "Le tapage nocturne", "Un vol"], "answer": 3, "explication": "Le vol, la fraude fiscale ou le harcèlement moral sont des délits, jugés par le tribunal correctionnel (amende d'au moins 3 750 € et jusqu'à 10 ans de prison). Le meurtre est un crime ; le tapage nocturne et le stationnement gênant sont des contraventions.", "source": "Livret du citoyen 2026, p. 32"}, {"q": "Qui veille au maintien de l’ordre public ?", "options": ["La police et la gendarmerie", "Les syndicats", "Les associations de quartier", "Les entreprises de transport"], "answer": 0, "explication": "La police et la gendarmerie assurent les missions de maintien de l'ordre et de sécurité publique.", "source": "Livret du citoyen 2026, p. 29"}, {"q": "S'agissant des déchets, quelle proposition est correcte ?", "options": ["On peut déposer ses vieux meubles n'importe où sur le trottoir", "Le tri des déchets est réservé aux grandes villes", "Il est interdit d'abandonner ses déchets dans l'espace public", "Jeter ses déchets dans la nature est autorisé à la campagne"], "answer": 2, "explication": "Il est interdit de jeter ses déchets en dehors des poubelles, et les dépôts sauvages dans la rue ou dans la nature sont punis d'une amende. Les encombrants et déchets verts vont à la déchèterie.", "source": "Livret du citoyen 2026, p. 66"}]}, {"theme": "Histoire, géographie et culture", "questions": [{"q": "Quel était le surnom de Louis XIV ?", "options": ["Le Bien-Aimé", "Le Petit Caporal", "Le Roi-Soleil", "Cœur de Lion"], "answer": 2, "explication": "Louis XIV, roi de 1643 à 1715, est appelé le « Roi-Soleil » ; il a fait construire le château de Versailles.", "source": "Livret du citoyen 2026, p. 39"}, {"q": "Quel roi de France a été exécuté pendant la Révolution française ?", "options": ["Louis XIV", "Henri IV", "Louis XVI", "Louis-Philippe"], "answer": 2, "explication": "Louis XVI est renversé le 10 août 1792, jugé, puis guillotiné place de la Concorde en 1793.", "source": "Livret du citoyen 2026, p. 40"}, {"q": "En quelle année Napoléon Ier est-il devenu empereur ?", "options": ["1789", "1804", "1815", "1848"], "answer": 1, "explication": "Napoléon Bonaparte devient empereur en 1804 : c'est le début du Premier Empire, qui dure jusqu'en 1815.", "source": "Livret du citoyen 2026, p. 41"}, {"q": "Lequel de ces personnages a un lien avec la République française ?", "options": ["Astérix", "Marianne", "Le Petit Prince", "Cendrillon"], "answer": 1, "explication": "Marianne, femme portant un bonnet phrygien, est le symbole de la République ; sa statue est placée dans toutes les mairies et elle apparaît sur les documents de l'administration.", "source": "Livret du citoyen 2026, p. 8"}, {"q": "De quand date l'appel à la résistance du général de Gaulle ?", "options": ["Du 18 juin 1940", "Du 11 novembre 1918", "Du 6 juin 1944", "Du 8 mai 1945"], "answer": 0, "explication": "Le 18 juin 1940, le général de Gaulle lance son appel sur la radio britannique (BBC) : il marque le début de la Résistance.", "source": "Livret du citoyen 2026, p. 44"}, {"q": "Pourquoi la Shoah est-elle étudiée à l'école ?", "options": ["Pour transmettre la mémoire de ce génocide et lutter contre le racisme et l'antisémitisme", "Pour apprendre la géographie de l'Allemagne", "Parce que c'est une tradition religieuse", "Pour célébrer la victoire de 1945"], "answer": 0, "explication": "On l'étudie par devoir de mémoire, pour comprendre où mènent la haine, le racisme et l'antisémitisme, et éviter que de tels crimes se reproduisent.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/zoom-sur/focus-sur-la-seconde-guerre-mondiale-la-shoah/"}, {"q": "Quel pays a été colonisé par la France ?", "options": ["L'Algérie", "Le Japon", "L'Argentine", "La Suède"], "answer": 0, "explication": "L'Algérie faisait partie de l'empire colonial français en Afrique ; elle obtient son indépendance en 1962, à l'issue de la guerre d'Algérie (1954-1962).", "source": "Livret du citoyen 2026, p. 45"}, {"q": "Depuis quand les Français élisent-ils le président de la République au suffrage universel direct ?", "options": ["Depuis 1789", "Depuis 1875", "Depuis 2002", "Depuis 1962"], "answer": 3, "explication": "La réforme approuvée par référendum en 1962 instaure l'élection directe du président ; la première a eu lieu en 1965.", "source": "https://www.elysee.fr/la-presidence/l-election-des-presidents-de-la-republique-depuis-195"}, {"q": "Quelle est la première étape de la construction européenne en 1951 ?", "options": ["La création de la CECA (Communauté européenne du charbon et de l'acier)", "La mise en circulation de l'euro", "Le traité de Maastricht", "L'adhésion du Royaume-Uni"], "answer": 0, "explication": "La Communauté européenne du charbon et de l'acier (CECA), créée en 1951, est la première étape ; le traité de Rome suit en 1957 entre six pays fondateurs dont la France.", "source": "Livret du citoyen 2026, p. 22"}, {"q": "Durant le mandat de quel président la peine de mort a-t-elle été abolie ?", "options": ["Charles de Gaulle", "François Mitterrand", "Jacques Chirac", "Nicolas Sarkozy"], "answer": 1, "explication": "La peine de mort est abolie en 1981, sous la présidence de François Mitterrand, grâce à son ministre de la Justice Robert Badinter.", "source": "Livret du citoyen 2026, p. 46"}, {"q": "Quel régime politique a été mis en place pendant la Révolution française en 1792 ?", "options": ["L'Empire", "La monarchie absolue", "La dictature militaire", "La République"], "answer": 3, "explication": "La Première République débute en 1792, à la fin de la monarchie constitutionnelle.", "source": "Livret du citoyen 2026, p. 40"}, {"q": "Qui était une figure de la Résistance française pendant la Seconde Guerre mondiale ?", "options": ["Philippe Pétain", "Jean Moulin", "Napoléon Ier", "Louis XIV"], "answer": 1, "explication": "Jean Moulin, missionné par le général de Gaulle, unifie la Résistance ; il est arrêté et torturé à mort par les nazis.", "source": "Livret du citoyen 2026, p. 44"}, {"q": "En 1944, qu'est-ce qui a changé pour les femmes ?", "options": ["Elles ont obtenu le droit de vote", "Elles ont obtenu le droit de travailler", "Elles ont dû faire le service militaire", "Elles ont obtenu le droit à l'avortement"], "answer": 0, "explication": "Les femmes obtiennent le droit de vote en avril 1944 et votent pour la première fois un an plus tard, en avril 1945.", "source": "Livret du citoyen 2026, p. 17"}, {"q": "Quelle organisation internationale a été créée en 1945 après la Seconde Guerre mondiale ?", "options": ["L'Union européenne", "L'ONU (Organisation des Nations unies)", "L'OTAN", "La Société des Nations"], "answer": 1, "explication": "L'ONU est créée en 1945, après la Seconde Guerre mondiale, notamment pour maintenir la paix et la sécurité internationales ; l'Union européenne date de 1992.", "source": "Livret du citoyen 2026, p. 49"}, {"q": "Quelle peine a été supprimée en 1981 ?", "options": ["La prison à perpétuité", "Les amendes", "La peine de mort", "Le travail d'intérêt général"], "answer": 2, "explication": "Depuis 1981, la peine de mort est interdite par la loi ; Robert Badinter a porté cette abolition.", "source": "Livret du citoyen 2026, p. 46"}, {"q": "En quelle année l'euro est-elle devenue la monnaie utilisée en France ?", "options": ["2002", "1958", "1981", "2012"], "answer": 0, "explication": "Les pièces et billets en euros sont mis en circulation le 1er janvier 2002 ; la France partage cette monnaie avec 20 autres pays de l'Union européenne.", "source": "Livret du citoyen 2026, p. 22"}, {"q": "En quelle année a commencé la Première Guerre mondiale ?", "options": ["1870", "1905", "1914", "1939"], "answer": 2, "explication": "La Première Guerre mondiale débute en juillet 1914 et s'achève avec l'armistice du 11 novembre 1918.", "source": "Livret du citoyen 2026, p. 43"}, {"q": "Où a eu lieu le débarquement en 1944 ?", "options": ["En Bretagne", "En Alsace", "En Normandie", "En Corse"], "answer": 2, "explication": "Le 6 juin 1944, les Alliés débarquent en Normandie : c'est le début de la libération de la France.", "source": "Livret du citoyen 2026, p. 44"}, {"q": "Quel continent a été le plus concerné par la décolonisation française après la Seconde Guerre mondiale ?", "options": ["L'Europe", "L'Amérique du Sud", "L'Océanie", "L'Afrique"], "answer": 3, "explication": "L'empire colonial français s'étendait surtout en Afrique (Afrique de l'Ouest, Afrique équatoriale, Algérie, Madagascar, Maroc, Tunisie…) ; la plupart des colonies deviennent indépendantes dans les années 1950 et 1960.", "source": "Livret du citoyen 2026, p. 45"}, {"q": "Que fête-t-on le 8 mai ?", "options": ["L'armistice de 1918", "La prise de la Bastille", "La fête du Travail", "La victoire de 1945, fin de la Seconde Guerre mondiale en Europe"], "answer": 3, "explication": "L'Allemagne capitule le 8 mai 1945 : ce jour férié commémore la fin de la Seconde Guerre mondiale ; l'armistice de 1918 est commémoré le 11 novembre.", "source": "Livret du citoyen 2026, p. 44"}, {"q": "Quelle mer ou océan borde la France métropolitaine ?", "options": ["La mer Baltique", "La mer Noire", "L'océan Indien", "La mer Méditerranée"], "answer": 3, "explication": "Les côtes de la France métropolitaine s'ouvrent sur la Manche, la mer du Nord, l'océan Atlantique et la mer Méditerranée.", "source": "Livret du citoyen 2026, p. 49"}, {"q": "Quel pays a une frontière terrestre avec la France métropolitaine ?", "options": ["Le Portugal", "Les Pays-Bas", "La Belgique", "L'Autriche"], "answer": 2, "explication": "La France métropolitaine a 8 voisins terrestres : Allemagne, Andorre, Belgique, Espagne, Italie, Luxembourg, Monaco et Suisse.", "source": "Livret du citoyen 2026, p. 49"}, {"q": "Quelle ville française est un port maritime ?", "options": ["Lyon", "Toulouse", "Dijon", "Marseille"], "answer": 3, "explication": "Marseille-Fos fait partie des plus grands ports maritimes commerciaux français, avec Le Havre, Dunkerque et Nantes-Saint-Nazaire.", "source": "Livret du citoyen 2026, p. 50"}, {"q": "Quelle mer se situe entre la France et l'Angleterre ?", "options": ["La Manche", "La mer Méditerranée", "La mer Baltique", "La mer Adriatique"], "answer": 0, "explication": "La Manche se situe entre la France et l'Angleterre.", "source": "Livret du citoyen 2026, p. 49"}, {"q": "Qu'est ce que la France d'outre-mer ?", "options": ["Les territoires français situés hors du continent européen", "Les pays étrangers où l'on parle français", "Les anciennes colonies devenues indépendantes", "Les régions frontalières de la France métropolitaine"], "answer": 0, "explication": "La France compte 12 territoires d'outre-mer, situés en dehors de la France métropolitaine : 5 départements et régions (Guadeloupe, Martinique, Guyane, La Réunion, Mayotte) et 7 collectivités à statut particulier.", "source": "Livret du citoyen 2026, p. 2
