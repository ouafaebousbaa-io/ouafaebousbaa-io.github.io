<html lang="fr">
<head>

<title>Examen civique CR</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one narrow column, like an exam booklet; a home screen of five theme rows, then one question per screen. */
:root {
  --paper: #f5f6fa;
  --sheet: #ffffff;
  --ink: #161b33;
  --muted: #5b6180;
  --line: #dfe2ec;
  --bleu: #22328a;
  --bleu-soft: #e7eaf7;
  --ok: #1f7a4d;
  --ok-soft: #e3f3ea;
  --ko: #b3261e;
  --ko-soft: #fbe7e5;
  --display: "Literata", Georgia, "Times New Roman", serif;
  --body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #10131f; --sheet: #181c2c; --ink: #e8eaf4; --muted: #9aa0bd; --line: #2c3249;
  --bleu: #9fb0ff; --bleu-soft: #232a4a; --ok: #6fd39d; --ok-soft: #173326; --ko: #ff8a80; --ko-soft: #3a1c1c;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #10131f; --sheet: #181c2c; --ink: #e8eaf4; --muted: #9aa0bd; --line: #2c3249;
  --bleu: #9fb0ff; --bleu-soft: #232a4a; --ok: #6fd39d; --ok-soft: #173326; --ko: #ff8a80; --ko-soft: #3a1c1c;
  color-scheme: dark }

body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; display: flex; flex-direction: column; gap: 20px; }
h1, h2 { font-family: var(--display); font-weight: 650; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: 1.75rem; line-height: 1.15; }
h2 { font-size: 1.3rem; line-height: 1.3; }
p { margin: 0; }
.eyebrow { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.09em; font-weight: 600; color: var(--muted); }
.lede { color: var(--muted); }
.tricolore { display: flex; height: 4px; width: 48px; border-radius: 2px; overflow: hidden; }
.tricolore span { flex: 1; } .tricolore span:nth-child(1){background:#22328a} .tricolore span:nth-child(2){background:#d9dbe4} .tricolore span:nth-child(3){background:#c8302b}

button { font: inherit; cursor: pointer; color: inherit; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--bleu); outline-offset: 2px; }
.btn { border: 0; border-radius: 10px; padding: 14px 18px; font-weight: 600; background: var(--bleu); color: var(--sheet); text-align: center; }
.btn.ghost { background: transparent; color: var(--bleu); border: 1.5px solid var(--bleu); }
.btn:disabled { opacity: .4; cursor: default; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row .btn { flex: 1 1 160px; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 2px; }
.stat b { font-family: var(--mono); font-size: 1.35rem; font-variant-numeric: tabular-nums; }
.stat span { font-size: 0.78rem; color: var(--muted); }

.themes { display: flex; flex-direction: column; background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.theme { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 14px 16px; border: 0; border-top: 1px solid var(--line); background: transparent; text-align: left; }
.theme:first-child { border-top: 0; }
.theme:hover { background: var(--bleu-soft); }
.theme .name { font-weight: 600; min-width: 0; }
.theme .count { font-family: var(--mono); font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { grid-column: 1 / -1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.bar .g { background: var(--ok); } .bar .r { background: var(--ko); }
.legend { display: flex; gap: 16px; font-size: 0.8rem; color: var(--muted); flex-wrap: wrap; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; background: var(--c); }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.link { background: none; border: 0; padding: 6px 0; color: var(--bleu); font-weight: 600; }
.meta { font-family: var(--mono); font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.meta.warn { color: var(--ko); }
.progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--bleu); transition: width .2s; }

.card { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; padding: 20px 18px; display: flex; flex-direction: column; gap: 16px; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: start; text-align: left; padding: 13px 14px; background: var(--paper); border: 1.5px solid var(--line); border-radius: 10px; }
.opt:hover:not(:disabled) { border-color: var(--bleu); }
.opt .k { font-family: var(--mono); font-size: 0.8rem; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; border: 1.5px solid var(--line); color: var(--muted); }
.opt span:last-child { min-width: 0; padding-top: 2px; }
.opt.chosen { border-color: var(--bleu); background: var(--bleu-soft); }
.opt.chosen .k { border-color: var(--bleu); color: var(--bleu); }
.opt.good { border-color: var(--ok); background: var(--ok-soft); }
.opt.good .k { border-color: var(--ok); background: var(--ok); color: var(--sheet); }
.opt.bad { border-color: var(--ko); background: var(--ko-soft); }
.opt.bad .k { border-color: var(--ko); background: var(--ko); color: var(--sheet); }
.opt:disabled { cursor: default; }

.feedback { border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 6px; background: var(--paper); border-left: 4px solid var(--c); }
.feedback .verdict { font-weight: 700; color: var(--c); }
.feedback a { color: var(--bleu); font-size: 0.85rem; overflow-wrap: anywhere; }
.note { font-size: 0.85rem; color: var(--muted); }

.score { font-family: var(--display); font-size: 3rem; line-height: 1; font-variant-numeric: tabular-nums; }
.score small { font-size: 1.2rem; color: var(--muted); }
.pill { display: inline-block; padding: 4px 10px; border-radius: 999px; font-weight: 700; font-size: 0.85rem; background: var(--c-soft); color: var(--c); }
.review { display: flex; flex-direction: column; gap: 12px; }
.ritem { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 6px; border-left: 4px solid var(--c); }
.ritem .q { font-weight: 600; }
.ritem .a { font-size: 0.92rem; }
.confirm { background: var(--ko-soft); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head>

<script>
const DATA = [{"theme": "Principes et valeurs de la République", "questions": [{"q": "Parmi les propositions suivantes, laquelle constitue une participation citoyenne ?", "options": ["Voter aux élections", "Renouveler son passeport", "Payer une contravention", "Regarder le journal télévisé"], "answer": 0, "explication": "Voter est le droit civique par excellence : c'est la façon la plus directe de participer à la vie démocratique, avec l'engagement associatif, syndical ou politique.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/droits-et-devoirs/droits-fondamentaux/un-droit-fondamental-la-citoyennete/"}, {"q": "Que garantit la liberté d’expression ?", "options": ["Le droit de tout dire sans aucune limite, y compris des insultes", "Le droit d'exprimer librement ses opinions, dans les limites fixées par la loi", "Le droit d'imposer ses opinions aux autres", "Le droit de s'exprimer uniquement en privé"], "answer": 1, "explication": "La libre communication des pensées et des opinions est garantie par l'article 11 de la Déclaration de 1789, mais chacun répond des abus de cette liberté prévus par la loi.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/principes-et-valeurs-de-la-republique/laicite/histoire-de-la-laicite/"}, {"q": "À quoi sert un titre de séjour ?", "options": ["À voter à toutes les élections", "À remplacer la carte nationale d'identité française", "À permettre à une personne étrangère de résider légalement en France", "À obtenir automatiquement la nationalité française"], "answer": 2, "explication": "Une personne étrangère vivant en France doit détenir un titre de séjour valide et le renouveler à son expiration : il prouve qu'elle est en situation régulière.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/droits-et-devoirs/obligations-et-devoirs-des-personnes-residant-en-france/les-obligations-en-tant-que-resident-francais/"}, {"q": "La liberté de circulation permet à toute personne de :", "options": ["Entrer dans n'importe quel domicile privé", "Conduire un véhicule sans permis", "Franchir les frontières sans aucun document", "Se déplacer librement sur le territoire"], "answer": 3, "explication": "La liberté d'aller et venir est une liberté individuelle : on peut se déplacer sur le territoire (avec son titre de séjour pour un étranger), dans le respect de la loi.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/principes-et-valeurs-de-la-republique/devise-et-symboles-de-la-republique/la-liberte/"}, {"q": "Sur quel site internet peut-on retrouver le symbole de la République française ?", "options": ["Sur service-public.fr, site officiel de l'administration", "Sur leboncoin.fr", "Sur amazon.fr", "Sur facebook.com"], "answer": 0, "explication": "Les sites officiels de l'État (en .gouv.fr ou service-public.fr) affichent dans leur en-tête le bloc-marque avec Marianne et la devise.", "source": "https://www.info.gouv.fr/actualite/comment-reperer-une-information-officielle-de-l-etat"}, {"q": "Complétez ces paroles de la Marseillaise : \"Aux armes […] ! Formez vos bataillons\"", "options": ["soldats", "citoyens", "enfants", "Français"], "answer": 1, "explication": "Le refrain commence par « Aux armes, citoyens ! Formez vos bataillons ». La Marseillaise, composée en 1792, est l'hymne national.", "source": "https://www.ardeche.gouv.fr/contenu/telechargement/9030/99048/file/paroles-marseillaise.pdf"}, {"q": "Complétez les paroles de la Marseillaise : \"Allons enfants de la patrie […]\"", "options": ["Marchons, marchons vers la victoire", "La liberté guide nos pas", "Le jour de gloire est arrivé", "Unissons-nous pour la nation"], "answer": 2, "explication": "Le premier couplet commence par « Allons enfants de la Patrie, le jour de gloire est arrivé ».", "source": "https://www.ardeche.gouv.fr/contenu/telechargement/9030/99048/file/paroles-marseillaise.pdf"}, {"q": "En application de la liberté individuelle, quelle proposition est correcte ? Une personne peut :", "options": ["Obliger sa fille à épouser l'homme qu'elle a choisi pour elle", "Empêcher son conjoint de travailler", "Confisquer les papiers d'identité d'un membre de sa famille", "Choisir librement la personne avec qui elle vit"], "answer": 3, "explication": "Choisir la personne avec laquelle on vit fait partie des libertés individuelles ; le mariage exige le libre consentement de chacun.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/principes-et-valeurs-de-la-republique/devise-et-symboles-de-la-republique/la-liberte/"}, {"q": "Concernant la pratique de la religion, quelle proposition est correcte ?", "options": ["Chacun est libre de pratiquer la religion de son choix, dans le respect de l'ordre public", "Il est obligatoire d'avoir une religion", "L'État impose une religion officielle", "On peut désobéir à la loi au nom de sa religion"], "answer": 0, "explication": "La laïcité garantit la liberté de conscience : on peut pratiquer une religion, à condition de ne pas troubler l'ordre public et de respecter la loi.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/principes-et-valeurs-de-la-republique/laicite/la-definition-de-la-laicite-1/"}, {"q": "En tant que parent, peut-on refuser que son enfant participe aux cours de sport à l'école car ils sont mixtes ?", "options": ["Oui, sur simple demande écrite à l'école", "Non, le sport fait partie du programme obligatoire et la mixité garantit l'égalité filles-garçons", "Oui, si la religion de la famille l'interdit", "Oui, mais seulement pour les filles"], "answer": 1, "explication": "Un élève ne peut pas refuser un cours du programme, comme le sport, pour un motif religieux ou personnel ; l'école garantit l'égalité entre filles et garçons.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/principes-et-valeurs-de-la-republique/laicite/la-laicite-a-ecole-1/"}, {"q": "Quelle est la devise de la France ?", "options": ["Travail, Famille, Patrie", "Unité, Progrès, Justice", "Liberté, Égalité, Fraternité", "Paix, Justice, Liberté"], "answer": 2, "explication": "« Liberté, Égalité, Fraternité » est apparue sous la Révolution, adoptée officiellement en 1848 et inscrite dans la Constitution de 1958.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/principes-et-valeurs-de-la-republique/devise-et-symboles-de-la-republique/la-devise-francaise/"}, {"q": "La répudiation de sa femme est :", "options": ["Autorisée si le mari le décide seul", "Possible si le mariage a été célébré à l'étranger", "Autorisée avec l'accord de la famille", "Interdite : elle n'a aucune valeur en droit français"], "answer": 3, "explication": "La répudiation, décidée par un seul époux, est contraire à l'égalité entre époux et à l'ordre public français ; seul un divorce prononcé selon la loi met fin au mariage.", "source": "https://www.lemondedudroit.fr/droit-civil/290-famille/40480-repudiation-atteinte-a-lordre-public-francais.html"}, {"q": "Les impôts permettent de financer les dépenses publiques. Quelle proposition est correcte ?", "options": ["Chacun y participe selon ses revenus", "Seuls les citoyens français paient des impôts", "Payer ses impôts est facultatif", "Tout le monde paie exactement le même montant"], "answer": 0, "explication": "Payer ses impôts est une obligation pour toute personne résidant en France ; la contribution est adaptée aux revenus et finance les services publics (école, hôpital, police…).", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/droits-et-devoirs/obligations-et-devoirs-des-personnes-residant-en-france/les-obligations-en-tant-que-resident-francais/"}, {"q": "Peut-on brûler publiquement un drapeau français ?", "options": ["Oui, c'est toujours permis au nom de la liberté d'expression", "Non, c'est un outrage au drapeau, interdit par la loi", "Oui, uniquement le 14 juillet", "Oui, si l'on est propriétaire du drapeau"], "answer": 1, "explication": "Le drapeau tricolore est un symbole officiel : le détruire ou l'utiliser de manière dégradante en public constitue un outrage interdit.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/principes-et-valeurs-de-la-republique/les-symboles-de-la-republique/le-drapeau-fran%C3%A7ais/"}, {"q": "Que fait l’État pour lutter contre les discriminations ?", "options": ["Il les autorise dans les entreprises privées", "Il ne s'en occupe pas, c'est une affaire privée", "Il les interdit par la loi et les sanctionne", "Il les tolère si elles sont justifiées par la religion"], "answer": 2, "explication": "La loi reconnaît plus de 26 critères de discrimination et punit les discriminations d'amendes, voire de prison en cas de récidive ; le Défenseur des droits aide les victimes.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/principes-et-valeurs-de-la-republique/devise-et-symboles-de-la-republique/egalite-3/"}, {"q": "Que représente Marianne ?", "options": ["La première reine de France", "Une sainte catholique", "L'épouse d'un président", "La République française"], "answer": 3, "explication": "Marianne, coiffée du bonnet phrygien, est née sous la Révolution et incarne la République ; c'est un symbole officiel.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/principes-et-valeurs-de-la-republique/les-symboles-de-la-republique/marianne/"}, {"q": "Qu'est-ce que la liberté d'association ?", "options": ["Le droit pour chacun, Français ou étranger, de créer une association ou d'y adhérer", "L'obligation d'adhérer à un parti politique", "Un droit réservé aux personnes de nationalité française", "L'obligation d'être membre d'un syndicat"], "answer": 0, "explication": "Garantie par la loi de 1901, la liberté d'association permet à toute personne, française ou étrangère, de s'engager librement dans une association ou d'en créer une.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/principes-et-valeurs-de-la-republique/devise-et-symboles-de-la-republique/fraternite-2/"}, {"q": "Qu'est-ce que la liberté ?", "options": ["Pouvoir faire tout ce que l'on veut, sans aucune limite", "Pouvoir faire tout ce qui ne nuit pas à autrui", "Pouvoir ne pas respecter les lois avec lesquelles on n'est pas d'accord", "Un droit réservé aux citoyens français"], "answer": 1, "explication": "Selon l'article 4 de la Déclaration de 1789, « la liberté consiste à faire tout ce qui ne nuit pas à autrui » ; ses limites sont fixées par la loi.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/droits-et-devoirs/obligations-et-devoirs-des-personnes-residant-en-france/la-limite-des-libertes-individuelles/"}, {"q": "Qu'est-ce que la Marseillaise ?", "options": ["La devise de la République", "Le nom de la fête nationale", "L'hymne national de la France", "Un monument de Marseille"], "answer": 2, "explication": "La Marseillaise, composée en 1792, est devenue l'hymne national en 1879 ; on l'entend lors des cérémonies officielles et des compétitions sportives.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/principes-et-valeurs-de-la-republique/les-symboles-de-la-republique/hymne-francais/"}, {"q": "Sur quel document peut-on voir Marianne ?", "options": ["Un ticket de cinéma", "Une facture d'électricité", "Un contrat de location", "La carte nationale d'identité"], "answer": 3, "explication": "Marianne figure sur la carte d'identité, les documents administratifs (comme la déclaration d'impôts), les timbres et les pièces.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/principes-et-valeurs-de-la-republique/les-symboles-de-la-republique/marianne/"}, {"q": "Un employeur refuse d’embaucher des femmes dans son entreprise. Que dit la loi ?", "options": ["C'est une discrimination interdite et punie par la loi", "C'est autorisé dans une entreprise privée", "C'est autorisé si l'employeur l'indique dans l'offre d'emploi", "C'est autorisé si l'entreprise a moins de 10 salariés"], "answer": 0, "explication": "Le sexe est un critère de discrimination interdit : refuser un emploi à cause du sexe est une discrimination directe, sanctionnée par la loi.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/principes-et-valeurs-de-la-republique/devise-et-symboles-de-la-republique/egalite-3/"}, {"q": "Une des valeurs de la devise républicaine est l'égalité. Qu'est-ce que cela signifie ?", "options": ["Tout le monde doit gagner le même salaire", "La loi est la même pour tous, sans distinction", "Les hommes ont plus de droits que les femmes", "Les droits dépendent de la religion de chacun"], "answer": 1, "explication": "L'égalité signifie que la loi s'applique de la même façon à tous, avec les mêmes droits et devoirs, sans distinction d'origine, de sexe ou de religion.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/principes-et-valeurs-de-la-republique/devise-et-symboles-de-la-republique/egalite-1/"}, {"q": "Quelle est la place de la langue française dans la République ?", "options": ["Le français et l'anglais sont les deux langues officielles", "Chaque région choisit sa langue officielle", "Le français est la langue de la République, inscrite dans la Constitution", "Il n'existe pas de langue officielle en France"], "answer": 2, "explication": "Depuis 1992, la Constitution précise que « la langue de la République est le français » ; c'est la langue de l'école, de l'administration et de la justice.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/principes-et-valeurs-de-la-republique/la-langue-de-la-republique/la-langue-fran%C3%A7aise/"}, {"q": "Quels sont des symboles officiels de la République française ?", "options": ["Le coq, la tour Eiffel et la baguette", "La tour Eiffel, le Louvre et l'Arc de triomphe", "Le lion, l'aigle et la fleur de lys", "Le drapeau tricolore, la Marseillaise et Marianne"], "answer": 3, "explication": "Le drapeau, l'hymne, Marianne, la devise et le 14 juillet sont des symboles officiels ; le coq n'est qu'un symbole non officiel.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/principes-et-valeurs-de-la-republique/les-symboles-de-la-republique/"}, {"q": "A-t-on le droit d'insulter publiquement quelqu’un parce qu’il est différent (handicap, apparence physique, sexe…) ?", "options": ["Non, c'est interdit et puni par la loi", "Oui, au nom de la liberté d'expression", "Oui, si c'est sur internet", "Oui, si la personne n'est pas française"], "answer": 0, "explication": "Le handicap, l'apparence physique ou le sexe sont des critères de discrimination protégés : les insultes fondées sur ces critères sont interdites et sanctionnées.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/principes-et-valeurs-de-la-republique/devise-et-symboles-de-la-republique/egalite-3/"}, {"q": "Le régime de la France est :", "options": ["Une monarchie absolue", "Une République démocratique", "Une dictature militaire", "Une théocratie"], "answer": 1, "explication": "D'après l'article 1er de la Constitution, la France est une République indivisible, laïque, démocratique et sociale.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/principes-et-valeurs-de-la-republique/laicite/la-definition-de-la-laicite-1/"}, {"q": "Pourquoi le principe de laïcité doit-il être respecté à l'école ?", "options": ["Pour interdire aux élèves d'avoir une religion", "Pour imposer une religion officielle", "Pour garantir la liberté de conscience des élèves et les protéger de toute pression", "Pour que seuls les élèves croyants puissent étudier"], "answer": 2, "explication": "L'école publique est neutre : elle laisse chaque élève former librement ses opinions et le protège du prosélytisme et des pressions.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/principes-et-valeurs-de-la-republique/laicite/la-laicite-a-ecole-1/"}, {"q": "En quelle année la loi de séparation des Églises et de l'Etat a-t-elle été votée ?", "options": ["1789", "1848", "1958", "1905"], "answer": 3, "explication": "La loi de 1905 sépare les Églises et l'État : l'État est indépendant des religions et n'en finance aucune.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/principes-et-valeurs-de-la-republique/laicite/histoire-de-la-laicite/"}, {"q": "Une personne a-t-elle le droit de ne pas croire en une religion ?", "options": ["Oui, chacun est libre de croire ou de ne pas croire", "Non, chaque personne doit avoir une religion", "Oui, mais seulement les citoyens français", "Non, sauf autorisation de la mairie"], "answer": 0, "explication": "La laïcité garantit la liberté de conscience : avoir une religion ou ne pas en avoir est un droit pour tous.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/principes-et-valeurs-de-la-republique/laicite/la-definition-de-la-laicite-1/"}, {"q": "Quel droit est garanti par la laïcité ?", "options": ["Le droit de vote des étrangers", "La liberté de conscience", "Le droit d'imposer sa religion aux autres", "Le droit de refuser une loi pour motif religieux"], "answer": 1, "explication": "La laïcité garantit la liberté de conscience : chacun peut croire, ne pas croire, changer ou abandonner une religion.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/principes-et-valeurs-de-la-republique/laicite/la-definition-de-la-laicite-1/"}, {"q": "À l'école publique, qui peut porter des signes religieux très visibles ?", "options": ["Les élèves", "Les enseignants", "Ni les élèves ni les personnels de l'école", "Le directeur de l'école"], "answer": 2, "explication": "Depuis la loi de 2004, les élèves ne peuvent pas porter de signes religieux ostensibles, et les personnels sont tenus à une stricte neutralité.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/principes-et-valeurs-de-la-republique/laicite/la-laicite-a-ecole-1/"}, {"q": "Selon le principe de laïcité, que signifie la neutralité de l’État ?", "options": ["L'État interdit toutes les religions", "L'État finance en priorité la religion majoritaire", "L'État nomme les responsables religieux", "L'État ne reconnaît, ne salarie et ne subventionne aucun culte"], "answer": 3, "explication": "L'État ne reconnaît ni ne finance aucune religion, ne se mêle pas de leur fonctionnement interne et traite toutes les convictions de façon égale.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/principes-et-valeurs-de-la-republique/laicite/la-definition-de-la-laicite-1/"}, {"q": "Que peut faire un usager du service public dans une mairie ?", "options": ["Porter un signe religieux, en respectant les règles du service", "Exiger un agent de la même religion que lui", "Faire du prosélytisme au guichet", "Demander que le service s'adapte à sa religion"], "answer": 0, "explication": "La neutralité s'impose aux agents, pas aux usagers : un usager peut porter un signe religieux, sans prosélytisme ni demande d'adaptation du service au nom de sa religion.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/principes-et-valeurs-de-la-republique/laicite/la-laicite-dans-les-services-publics/"}, {"q": "Qui doit respecter le principe de neutralité religieuse dans une préfecture ?", "options": ["Les étrangers qui viennent demander un titre de séjour", "Les agents qui travaillent à la préfecture", "Toutes les personnes présentes, usagers compris", "Personne, la neutralité n'existe pas en préfecture"], "answer": 1, "explication": "Les agents publics ne doivent pas manifester leurs convictions religieuses ; les usagers, eux, ne sont pas soumis à cette obligation de neutralité.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/principes-et-valeurs-de-la-republique/laicite/la-laicite-dans-les-services-publics/"}, {"q": "La laïcité impose-t-elle aux agents publics d'être neutres vis-à-vis des usagers ?", "options": ["Non, ils peuvent afficher leur religion au guichet", "Oui, mais seulement envers les usagers français", "Oui, ils ne doivent pas manifester leurs convictions religieuses, politiques ou philosophiques", "Non, seuls les enseignants doivent être neutres"], "answer": 2, "explication": "Tout agent public doit rester neutre dans son travail afin de traiter tous les usagers de manière égale.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/principes-et-valeurs-de-la-republique/laicite/la-laicite-dans-les-services-publics/"}, {"q": "Que garantit le principe de laïcité ?", "options": ["La supériorité d'une religion sur les autres", "L'interdiction de toute pratique religieuse", "Le financement des cultes par l'État", "La liberté de croire ou de ne pas croire et l'égalité de tous quelles que soient leurs convictions"], "answer": 3, "explication": "La laïcité repose sur la liberté de conscience, la séparation de l'État et des religions et l'égalité de tous devant la loi, quelle que soit sa religion.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/principes-et-valeurs-de-la-republique/laicite/la-definition-de-la-laicite-1/"}, {"q": "A-t-on le droit de changer de religion ?", "options": ["Oui, chacun peut changer de religion ou l'abandonner", "Non, c'est interdit par la loi", "Oui, mais avec l'autorisation de sa famille", "Oui, mais uniquement avec l'accord d'un juge"], "answer": 0, "explication": "La liberté de conscience garantie par la laïcité inclut le droit de changer de religion ou d'en abandonner une, sans autorisation de personne.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/principes-et-valeurs-de-la-republique/laicite/la-definition-de-la-laicite-1/"}, {"q": "Que représente la laïcité ?", "options": ["Une religion officielle de l'État", "Un principe constitutionnel de la République", "Une simple opinion personnelle", "Une loi contre les religions"], "answer": 1, "explication": "La laïcité est un principe constitutionnel, inscrit à l'article 1er de la Constitution, et non une simple opinion.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/principes-et-valeurs-de-la-republique/laicite/la-definition-de-la-laicite-1/"}, {"q": "Qu'est ce qui est interdit par la Charte de la laïcité à l'école ?", "options": ["Parler de religion entre élèves, dans le respect des autres", "Étudier l'histoire des religions en cours", "Le port par les élèves de signes ou tenues manifestant ostensiblement une appartenance religieuse", "Avoir une religion en dehors de l'école"], "answer": 2, "explication": "La Charte de la laïcité à l'école (15 articles) interdit aux élèves les signes religieux ostensibles, le prosélytisme et le refus d'un cours au nom de convictions religieuses.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/principes-et-valeurs-de-la-republique/laicite/la-laicite-a-ecole-2/"}, {"q": "Que dit l'article 1er de la Constitution française ?", "options": ["La France est une monarchie constitutionnelle", "La France est une République fédérale et religieuse", "Le catholicisme est la religion officielle de la France", "La France est une République indivisible, laïque, démocratique et sociale"], "answer": 3, "explication": "L'article 1er de la Constitution de 1958 dispose : « La France est une République indivisible, laïque, démocratique et sociale ».", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/principes-et-valeurs-de-la-republique/laicite/la-definition-de-la-laicite-1/"}]}, {"theme": "Système institutionnel et politique", "questions": [{"q": "Qu'est-ce que l'État de droit ?", "options": ["Un État où le chef de l'État décide seul des lois", "Un État où tout le monde, y compris les dirigeants, doit respecter le droit", "Un État où chacun peut faire sa propre loi", "Un État dirigé par des juges non élus"], "answer": 1, "explication": "Dans un État de droit, l'État lui-même et ses gouvernants sont soumis aux règles de droit, comme tous les citoyens. Personne n'est au-dessus des lois.", "source": "https://www.conseil-constitutionnel.fr/la-constitution/le-role-de-l-etat"}, {"q": "Le président de la République a commis un crime. Quelle proposition est correcte ?", "options": ["Il n'est pas au-dessus des lois : il pourra être poursuivi en justice, au plus tard après son mandat", "Il ne pourra jamais être jugé", "Il peut se juger lui-même", "Il peut effacer son crime par un décret"], "answer": 0, "explication": "Pendant son mandat, le président est protégé des poursuites (il peut toutefois être destitué), mais ces poursuites reprennent un mois après la fin de ses fonctions. Le président reste soumis à la loi.", "source": "https://www.justice.gouv.fr/node/1910"}, {"q": "La loi est l'expression de :", "options": ["La volonté du président de la République", "La volonté des juges", "La volonté des religions", "La volonté générale"], "answer": 3, "explication": "La loi, votée par les représentants élus du peuple, est l'expression de la volonté générale. Ce principe vient de la Déclaration de 1789.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/systeme-institutionnel-et-politique/democratie-et-droit-de-vote/comment-voter-une-loi-1/"}, {"q": "Quelle est la durée du mandat du conseil municipal et du maire ?", "options": ["2 ans", "4 ans", "6 ans", "10 ans"], "answer": 2, "explication": "Le maire et les conseillers municipaux sont élus pour 6 ans. Les élections municipales ont donc lieu tous les 6 ans.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/systeme-institutionnel-et-politique/democratie-et-droit-de-vote/democratie-et-droit-de-vote-la-democratie-et-la-republique-2/"}, {"q": "Que garantit l’État de droit ?", "options": ["Le pouvoir absolu du président", "Le respect des droits de chacun et l'égalité de tous devant la loi, sous le contrôle de juges indépendants", "L'impunité des ministres", "Le droit pour chacun de se faire justice soi-même"], "answer": 1, "explication": "L'État de droit protège les droits et libertés fondamentaux : la même loi s'applique à tous et chacun peut faire appel à une justice indépendante.", "source": "https://commission.europa.eu/strategy-and-policy/policies/justice-and-fundamental-rights/upholding-rule-law/rule-law/what-rule-law_en"}, {"q": "Une personne peut-elle voter à la place d'une autre ?", "options": ["Oui, seulement si cette autre personne lui a donné une procuration", "Oui, toujours, si elle est de la même famille", "Oui, si elle présente la carte d'identité de l'autre", "Non, jamais, même avec une procuration"], "answer": 0, "explication": "Le vote est personnel. On ne peut voter pour quelqu'un d'autre que si cette personne a fait une procuration de vote.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/systeme-institutionnel-et-politique/democratie-et-droit-de-vote/democratie-et-droit-de-vote-les-conditions-pour-voter-en-france-1/"}, {"q": "Est-ce que le vote est obligatoire ?", "options": ["Oui, sous peine de prison", "Oui, sous peine d'amende", "Oui, seulement pour l'élection présidentielle", "Non, voter est un droit et non une obligation"], "answer": 3, "explication": "En France, le vote n'est pas obligatoire : c'est un droit. Chaque citoyen est libre de voter ou non.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/systeme-institutionnel-et-politique/democratie-et-droit-de-vote/democratie-et-droit-de-vote-les-conditions-pour-voter-en-france-1/"}, {"q": "À la fin de son mandat, le président de la République peut-il décider de rester au pouvoir ?", "options": ["Oui, s'il le souhaite", "Oui, si le Premier ministre est d'accord", "Non, il doit respecter la durée de son mandat fixée par la Constitution", "Oui, s'il déclare l'état d'urgence"], "answer": 2, "explication": "Le président est élu pour 5 ans et ne peut pas prolonger seul son mandat ; une nouvelle élection a lieu. Il ne peut pas faire plus de deux mandats de suite.", "source": "https://www.elysee.fr/la-presidence/le-president-dans-la-constitution"}, {"q": "Qui dirige l'action du Gouvernement ?", "options": ["Le président du Sénat", "Le Premier ministre", "Le préfet de Paris", "Le président du Conseil constitutionnel"], "answer": 1, "explication": "Selon l'article 21 de la Constitution, le Premier ministre dirige l'action du Gouvernement.", "source": "https://www.info.gouv.fr/le-premier-ministre"}, {"q": "Qui nomme le Premier ministre ?", "options": ["Le président de la République", "Les députés, par un vote", "Les citoyens, par une élection", "Le Conseil constitutionnel"], "answer": 0, "explication": "Le président de la République nomme le Premier ministre, en tenant compte de la majorité à l'Assemblée nationale.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/systeme-institutionnel-et-politique/etat-de-droit-et-separation-des-pouvoirs/etat-de-droit-et-separation-des-pouvoirs-presentation-des-3-pouvoirs-1/"}, {"q": "Quelle est l'organisation administrative de la France ?", "options": ["Un État fédéral composé de provinces autonomes", "Un pays divisé uniquement en cantons", "Un État où Paris décide seul de tout, sans collectivités locales", "Un État décentralisé organisé en communes, départements et régions"], "answer": 3, "explication": "La République a une organisation décentralisée : l'État transfère des compétences aux collectivités territoriales (communes, départements, régions et collectivités à statut particulier ou d'outre-mer).", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/systeme-institutionnel-et-politique/organisation-de-la-republique-fran%C3%A7aise/le-decoupage-administratif-de-la-france-1/"}, {"q": "Qu'est-ce que le pouvoir législatif ? Le pouvoir :", "options": ["De juger les personnes", "D'appliquer les lois", "De voter les lois", "De commander l'armée"], "answer": 2, "explication": "Le pouvoir législatif est exercé par le Parlement (Assemblée nationale et Sénat) : il discute et vote les lois.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/systeme-institutionnel-et-politique/etat-de-droit-et-separation-des-pouvoirs/etat-de-droit-et-separation-des-pouvoirs-presentation-des-3-pouvoirs-1/"}, {"q": "Pourquoi séparer les trois pouvoirs dans une démocratie ?", "options": ["Pour que les élections soient moins fréquentes", "Pour éviter qu'une seule personne ou institution concentre tout le pouvoir et en abuse", "Pour donner tout le pouvoir au président", "Pour que les juges écrivent les lois"], "answer": 1, "explication": "Chaque pouvoir (législatif, exécutif, judiciaire) est confié à une institution différente, ce qui permet à chacun de contrôler les autres et protège les libertés.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/systeme-institutionnel-et-politique/etat-de-droit-et-separation-des-pouvoirs/etat-de-droit-et-separation-des-pouvoirs-presentation-des-3-pouvoirs-1/"}, {"q": "Qui sanctionne l'auteur d'un vol ?", "options": ["Le juge (la justice pénale)", "Le maire", "La victime elle-même", "Le préfet"], "answer": 0, "explication": "Le vol est une infraction punie par la justice pénale. Seuls les juges peuvent prononcer une peine.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/systeme-institutionnel-et-politique/etat-de-droit-et-separation-des-pouvoirs/etat-de-droit-et-separation-des-pouvoirs-presentation-des-3-pouvoirs-2/"}, {"q": "Quel est le rôle du gouvernement ?", "options": ["Voter les lois", "Juger les citoyens", "Élire le président de la République", "Déterminer et conduire la politique de la nation et faire appliquer les lois"], "answer": 3, "explication": "Le Gouvernement (Premier ministre et ministres) exerce le pouvoir exécutif : il conduit la politique de la nation, dirige l'administration et applique les lois.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/systeme-institutionnel-et-politique/etat-de-droit-et-separation-des-pouvoirs/etat-de-droit-et-separation-des-pouvoirs-presentation-des-3-pouvoirs-1/"}, {"q": "Que se passe-t-il si un ministre ne respecte pas la loi ?", "options": ["Rien, les ministres sont au-dessus des lois", "Il est protégé jusqu'à la fin de sa vie", "Il peut être poursuivi et jugé, comme tout citoyen", "Seul le président peut décider de le punir"], "answer": 2, "explication": "Un ministre n'est pas au-dessus des lois. Pour les infractions liées à ses fonctions, il est jugé par la Cour de justice de la République ; pour les autres, par les tribunaux ordinaires.", "source": "https://www.publicsenat.fr/actualites/politique/comment-fonctionne-la-cour-de-justice-de-la-republique-187060"}, {"q": "Combien de députés composent l’Assemblée nationale ?", "options": ["100", "577", "348", "1 000"], "answer": 1, "explication": "L'Assemblée nationale compte 577 députés élus pour 5 ans au suffrage universel direct. (348 est le nombre de sénateurs.)", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/systeme-institutionnel-et-politique/etat-de-droit-et-separation-des-pouvoirs/etat-de-droit-et-separation-des-pouvoirs-presentation-des-3-pouvoirs-1/"}, {"q": "Qui peut voter aux élections en France ?", "options": ["Les citoyens français majeurs, jouissant de leurs droits civiques et inscrits sur les listes électorales", "Toutes les personnes qui habitent en France, quelle que soit leur nationalité", "Uniquement les personnes nées en France", "Uniquement les personnes qui paient des impôts"], "answer": 0, "explication": "Pour voter, il faut être français, avoir au moins 18 ans, jouir de ses droits civils et politiques et être inscrit sur les listes électorales. Les citoyens de l'UE peuvent aussi voter aux élections municipales et européennes.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/systeme-institutionnel-et-politique/democratie-et-droit-de-vote/democratie-et-droit-de-vote-les-conditions-pour-voter-en-france-1/"}, {"q": "Pour combien de temps sont élus les sénateurs ?", "options": ["2 ans", "5 ans", "9 ans", "6 ans"], "answer": 3, "explication": "Les 348 sénateurs sont élus pour 6 ans au suffrage indirect par les grands électeurs ; le Sénat est renouvelé par moitié tous les 3 ans.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/systeme-institutionnel-et-politique/democratie-et-droit-de-vote/democratie-et-droit-de-vote-la-democratie-et-la-republique-2/"}, {"q": "La séparation des pouvoirs est un principe fondamental. Quels sont les trois pouvoirs concernés ?", "options": ["Le pouvoir religieux, le pouvoir militaire et le pouvoir économique", "Le pouvoir municipal, le pouvoir départemental et le pouvoir régional", "Le pouvoir législatif, le pouvoir exécutif et le pouvoir judiciaire", "Le pouvoir médiatique, le pouvoir syndical et le pouvoir politique"], "answer": 2, "explication": "Le législatif fait la loi (Parlement), l'exécutif l'applique (président et Gouvernement) et le judiciaire contrôle et sanctionne son non-respect (juges).", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/systeme-institutionnel-et-politique/etat-de-droit-et-separation-des-pouvoirs/etat-de-droit-et-separation-des-pouvoirs-presentation-des-3-pouvoirs-1/"}, {"q": "Est-ce que le président de la République a tous les pouvoirs ?", "options": ["Oui, il fait les lois et juge les citoyens", "Non, les pouvoirs sont séparés et limités par la Constitution", "Oui, mais seulement en temps de paix", "Oui, s'il a été élu avec plus de 50 % des voix"], "answer": 1, "explication": "Le président exerce le pouvoir exécutif avec le Gouvernement ; le Parlement vote les lois et des juges indépendants rendent la justice.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/systeme-institutionnel-et-politique/etat-de-droit-et-separation-des-pouvoirs/etat-de-droit-et-separation-des-pouvoirs-presentation-des-3-pouvoirs-1/"}, {"q": "Qui est le préfet ?", "options": ["Le représentant de l'État dans le département", "Le chef de la police municipale", "Un élu qui dirige la région", "Le juge principal du département"], "answer": 0, "explication": "Le préfet représente l'État dans le département : il dirige les services de l'État, organise la sécurité, délivre les titres et vérifie que les collectivités respectent la loi.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/systeme-institutionnel-et-politique/organisation-de-la-republique-fran%C3%A7aise/le-decoupage-administratif-de-la-france-2/"}, {"q": "Quelle condition est nécessaire pour voter aux élections ?", "options": ["Être propriétaire de son logement", "Avoir un emploi", "Être marié", "Être majeur (avoir au moins 18 ans)"], "answer": 3, "explication": "En France, il faut avoir au moins 18 ans pour voter, en plus d'être français, de jouir de ses droits civiques et d'être inscrit sur les listes électorales.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/systeme-institutionnel-et-politique/democratie-et-droit-de-vote/democratie-et-droit-de-vote-les-conditions-pour-voter-en-france-1/"}, {"q": "Qui dirige la commune ?", "options": ["Le préfet", "Le président de la région", "Le maire, avec le conseil municipal", "Le Premier ministre"], "answer": 2, "explication": "La commune est dirigée par des élus : le maire et les conseillers municipaux, élus pour 6 ans.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/systeme-institutionnel-et-politique/organisation-de-la-republique-fran%C3%A7aise/le-decoupage-administratif-de-la-france-1/"}, {"q": "Quel est le régime politique de la France aujourd'hui ?", "options": ["Une monarchie", "Une république démocratique (la Ve République)", "Un empire", "Une dictature"], "answer": 1, "explication": "Depuis la Constitution du 4 octobre 1958, la France vit sous la Ve République : le pouvoir vient du peuple, qui élit ses représentants.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/les-regimes-politiques-depuis-1789/la-cinquieme-republique/"}, {"q": "Qu'est-ce que l'Hôtel de Matignon ?", "options": ["La résidence et le lieu de travail du Premier ministre", "La résidence du président de la République", "Le siège du Sénat", "Le siège de l'Assemblée nationale"], "answer": 0, "explication": "Le Premier ministre réside et travaille à l'Hôtel de Matignon ; le président de la République, lui, réside au palais de l'Élysée.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/systeme-institutionnel-et-politique/etat-de-droit-et-separation-des-pouvoirs/etat-de-droit-et-separation-des-pouvoirs-presentation-des-3-pouvoirs-1/"}, {"q": "Le Parlement est composé :", "options": ["Du président et du Premier ministre", "Des ministres et des préfets", "Du Conseil d'État et de la Cour de cassation", "De l'Assemblée nationale et du Sénat"], "answer": 3, "explication": "Le Parlement comprend deux chambres : l'Assemblée nationale (577 députés) et le Sénat (348 sénateurs). Il vote les lois et contrôle le Gouvernement.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/systeme-institutionnel-et-politique/etat-de-droit-et-separation-des-pouvoirs/etat-de-droit-et-separation-des-pouvoirs-presentation-des-3-pouvoirs-1/"}, {"q": "Quel est le rôle du président de la République ?", "options": ["Il vote les lois à la place du Parlement", "Il juge les crimes", "Il est le chef de l'État et des armées et veille au respect de la Constitution", "Il dirige la commune de Paris"], "answer": 2, "explication": "Le président est le chef de l'État et le chef des armées ; il est garant de la Constitution, de l'indépendance nationale et de la continuité de l'État.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/systeme-institutionnel-et-politique/etat-de-droit-et-separation-des-pouvoirs/etat-de-droit-et-separation-des-pouvoirs-presentation-des-3-pouvoirs-1/"}, {"q": "Quel est le rôle du Premier ministre ?", "options": ["Il vote les lois avec les députés", "Il dirige l'action du Gouvernement et assure l'exécution des lois", "Il préside le Parlement européen", "Il juge les ministres"], "answer": 1, "explication": "Nommé par le président de la République, le Premier ministre dirige l'action du Gouvernement, coordonne les ministres et veille à l'application des lois.", "source": "https://www.info.gouv.fr/le-premier-ministre"}, {"q": "Qui est le chef du Gouvernement ?", "options": ["Le Premier ministre", "Le président de l'Assemblée nationale", "Le maire de Paris", "Le ministre de l'Intérieur"], "answer": 0, "explication": "Le Premier ministre est le chef du Gouvernement : il dirige les ministres et l'action du Gouvernement.", "source": "https://www.info.gouv.fr/le-premier-ministre"}, {"q": "Combien y a-t-il de régions en France ?", "options": ["8", "36", "101", "18 (13 en métropole et 5 en outre-mer)"], "answer": 3, "explication": "La France compte 18 régions, dont 13 en métropole et 5 en outre-mer. (101 est le nombre de départements.)", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/systeme-institutionnel-et-politique/organisation-de-la-republique-fran%C3%A7aise/le-decoupage-administratif-de-la-france-3/"}, {"q": "Quel est le rôle du Défenseur des droits ?", "options": ["Défendre les accusés devant le tribunal à la place d'un avocat", "Voter les lois sur les droits de l'homme", "Défendre les personnes dont les droits ne sont pas respectés et lutter contre les discriminations", "Délivrer les titres de séjour"], "answer": 2, "explication": "Le Défenseur des droits est une autorité administrative indépendante : il aide gratuitement les personnes face aux services publics et lutte contre les discriminations.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/droits-et-devoirs/droits-fondamentaux/les-acteurs-institutionnels/"}, {"q": "Depuis quand l'euro est-elle la monnaie unique ?", "options": ["1957", "2002", "1981", "2012"], "answer": 1, "explication": "Les pièces et billets en euros circulent depuis le 1er janvier 2002 ; l'euro existait déjà comme monnaie de compte depuis 1999 (la BCE a été créée en 1998).", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/les-conflits-mondiaux-et-le-nouvel-ordre-mondial/la-construction-europeenne/"}, {"q": "Quel est le rôle principal du département ?", "options": ["L'action sociale (RSA, aide aux personnes handicapées) et la gestion des collèges", "La gestion des lycées et des universités", "La défense nationale", "Le vote des lois"], "answer": 0, "explication": "Le département agit surtout dans la solidarité et l'action sociale (RSA, handicap, enfance) et gère les collèges.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/systeme-institutionnel-et-politique/organisation-de-la-republique-fran%C3%A7aise/le-decoupage-administratif-de-la-france-1/"}, {"q": "Quel est le rôle principal des communes ?", "options": ["Gérer les lycées", "Diriger la politique étrangère", "Commander la gendarmerie nationale", "Gérer les services de proximité : écoles maternelles et primaires, urbanisme, état civil"], "answer": 3, "explication": "La commune s'occupe des affaires locales du quotidien : écoles maternelles et primaires, urbanisme, logement, action sociale de proximité.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/systeme-institutionnel-et-politique/organisation-de-la-republique-fran%C3%A7aise/le-decoupage-administratif-de-la-france-1/"}, {"q": "Combien de communes environ existe-t-il en France ?", "options": ["Environ 3 500", "Environ 350 000", "Environ 35 000", "Environ 1 000"], "answer": 2, "explication": "La France compte environ 35 000 communes (34 875 au 1er janvier 2026), ce qui en fait la collectivité la plus répandue.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/systeme-institutionnel-et-politique/organisation-de-la-republique-fran%C3%A7aise/le-decoupage-administratif-de-la-france-3/"}, {"q": "Quel traité concerne la construction de l'Union européenne ?", "options": ["Le traité de Versailles", "Le traité de Maastricht", "Le traité de l'Atlantique Nord", "Le traité de Verdun"], "answer": 1, "explication": "Signé en 1992, le traité de Maastricht crée l'Union européenne et la citoyenneté européenne ; d'autres traités (Paris 1951, Rome 1957, Lisbonne 2007) jalonnent la construction européenne.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/systeme-institutionnel-et-politique/institutions-europeennes/les-etapes-cles-de-la-construction-europeenne/"}, {"q": "Quel État a quitté l'Union européenne en 2020 ?", "options": ["Le Royaume-Uni", "La Suisse", "La Norvège", "La Grèce"], "answer": 0, "explication": "Le Royaume-Uni est le premier pays à avoir quitté l'UE (Brexit), le 31 janvier 2020.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/systeme-institutionnel-et-politique/institutions-europeennes/les-etapes-cles-de-la-construction-europeenne/"}, {"q": "Quelle est la devise de l’Union européenne ?", "options": ["« Liberté, Égalité, Fraternité »", "« L'union fait la force »", "« Paix et prospérité »", "« Unie dans la diversité »"], "answer": 3, "explication": "Depuis 2000, la devise de l'UE est « Unie dans la diversité ». « Liberté, Égalité, Fraternité » est la devise de la République française.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/systeme-institutionnel-et-politique/institutions-europeennes/les-symboles-europeens-2/"}, {"q": "Quel est l'hymne de l'Union européenne ?", "options": ["« La Marseillaise »", "« Le Chant des partisans »", "L'« Ode à la joie » de Beethoven", "« Les Quatre Saisons » de Vivaldi"], "answer": 2, "explication": "L'hymne européen est l'« Ode à la joie », mélodie de Beethoven ; il symbolise la liberté, la paix et la solidarité.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/systeme-institutionnel-et-politique/institutions-europeennes/les-symboles-europeens-1/"}, {"q": "De quoi est composé le drapeau européen ?", "options": ["De 27 étoiles, une par pays membre", "De 12 étoiles jaunes disposées en cercle sur fond bleu", "De trois bandes verticales bleu, blanc, rouge", "D'une seule grande étoile jaune au centre"], "answer": 1, "explication": "Le drapeau européen compte 12 étoiles jaunes en cercle sur fond bleu ; ce nombre ne correspond pas au nombre de pays, le cercle symbolise l'unité et l'harmonie entre les peuples.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/systeme-institutionnel-et-politique/institutions-europeennes/les-symboles-europeens-1/"}, {"q": "De quelle couleur est le drapeau européen ?", "options": ["Bleu, avec des étoiles jaunes", "Rouge, avec des étoiles blanches", "Vert, avec des étoiles bleues", "Blanc, avec des étoiles rouges"], "answer": 0, "explication": "Le drapeau européen est bleu, avec un cercle de 12 étoiles jaunes.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/systeme-institutionnel-et-politique/institutions-europeennes/les-symboles-europeens-1/"}, {"q": "En quelle année le traité de Maastricht, qui marque la fondation de l'Union européenne, a-t-il été signé ?", "options": ["1945", "1968", "2010", "1992"], "answer": 3, "explication": "Le traité de Maastricht a été signé en 1992 ; il transforme la CEE en Union européenne.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/systeme-institutionnel-et-politique/institutions-europeennes/les-etapes-cles-de-la-construction-europeenne/"}, {"q": "Où est le siège du Parlement européen ?", "options": ["À Genève", "À Berlin", "À Strasbourg", "À Rome"], "answer": 2, "explication": "Le siège officiel du Parlement européen est à Strasbourg, en France, où se tiennent ses sessions plénières.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/systeme-institutionnel-et-politique/institutions-europeennes/le-fonctionnement-europeen-2/"}, {"q": "Où est le siège de la Commission européenne ?", "options": ["À Strasbourg", "À Bruxelles", "À Paris", "À Francfort"], "answer": 1, "explication": "La Commission européenne siège à Bruxelles (bâtiment du Berlaymont). Le Parlement est à Strasbourg et la Banque centrale européenne à Francfort.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/systeme-institutionnel-et-politique/institutions-europeennes/le-fonctionnement-europeen-2/"}, {"q": "Quel État n'est pas membre de l'Union européenne ?", "options": ["La Suisse", "L'Italie", "La Pologne", "Le Portugal"], "answer": 0, "explication": "La Suisse ne fait pas partie de l'UE, même si elle est entourée de pays membres ; l'UE compte 27 États depuis le départ du Royaume-Uni.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/systeme-institutionnel-et-politique/institutions-europeennes/les-etapes-cles-de-la-construction-europeenne/"}, {"q": "Quand célèbre-t-on la journée de l'Europe ?", "options": ["Le 14 juillet", "Le 1er janvier", "Le 11 novembre", "Le 9 mai"], "answer": 3, "explication": "La Journée de l'Europe est fêtée chaque 9 mai, en souvenir de la déclaration Schuman du 9 mai 1950.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/systeme-institutionnel-et-politique/institutions-europeennes/les-symboles-europeens-2/"}, {"q": "À quelle fréquence les élections européennes sont-elles organisées ?", "options": ["Tous les ans", "Tous les 3 ans", "Tous les 5 ans", "Tous les 10 ans"], "answer": 2, "explication": "Les citoyens européens élisent les députés européens tous les 5 ans (dernière élection en 2024, avec 81 députés pour la France).", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/systeme-institutionnel-et-politique/institutions-europeennes/les-elections-europeennes/"}, {"q": "Quelle condition est nécessaire pour voter aux élections européennes ?", "options": ["Avoir une carte de résident de 10 ans", "Avoir la nationalité d'un pays de l'Union européenne", "Être né sur le continent européen", "Parler au moins deux langues européennes"], "answer": 1, "explication": "En France, il faut être citoyen d'un État membre de l'UE, résider en France, avoir 18 ans et être inscrit sur les listes électorales. Un titre de séjour ne suffit pas.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/systeme-institutionnel-et-politique/institutions-europeennes/les-elections-europeennes/"}, {"q": "Quel pays est un pays fondateur de l'Union européenne ?", "options": ["L'Italie", "L'Espagne", "Le Royaume-Uni", "La Pologne"], "answer": 0, "explication": "Les six pays fondateurs sont la France, l'Allemagne (de l'Ouest), l'Italie, la Belgique, les Pays-Bas et le Luxembourg. L'Espagne est entrée en 1986, le Royaume-Uni en 1973 et la Pologne en 2004.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/systeme-institutionnel-et-politique/institutions-europeennes/les-etapes-cles-de-la-construction-europeenne/"}]}, {"theme": "Droits et devoirs", "questions": [{"q": "À quelle liberté la PMA fait-elle référence ?", "options": ["La liberté de disposer de son corps et de choisir d'avoir un enfant", "La liberté de la presse", "La liberté de réunion", "La liberté du commerce et de l'industrie"], "answer": 0, "explication": "La PMA relève du droit de chacun de faire ses propres choix concernant son corps et sa vie familiale. Depuis le 2 août 2021 (loi bioéthique), elle est ouverte à toutes les femmes, en couple ou seules.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/droits-et-devoirs/droits-fondamentaux/les-libertes-au-sein-du-couple/"}, {"q": "Au nom de quoi l'État justifie-t-il la restriction des droits ?", "options": ["Des intérêts du parti au pouvoir", "De l'intérêt général et de l'ordre public", "De la religion majoritaire du pays", "Des préférences personnelles du président"], "answer": 1, "explication": "Une liberté peut être restreinte au nom de l'intérêt général, des libertés des autres, de l'ordre public (sécurité, tranquillité, salubrité) ou de la dignité humaine.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/droits-et-devoirs/obligations-et-devoirs-des-personnes-residant-en-france/la-limite-des-libertes-individuelles/"}, {"q": "Concernant le droit de se marier, quelle proposition est correcte ?", "options": ["Des majeurs doivent obtenir l'accord de leurs parents pour se marier", "Le mariage est réservé aux couples composés d'un homme et d'une femme", "Chacun est libre de choisir son conjoint, quel que soit son sexe", "Un homme peut épouser plusieurs femmes"], "answer": 2, "explication": "En France, chacun choisit librement son conjoint, de même sexe ou de sexe différent. Le consentement libre des deux époux est une condition indispensable du mariage (article 146 du Code civil).", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/droits-et-devoirs/droits-fondamentaux/les-libertes-au-sein-du-couple/"}, {"q": "Est-il toujours possible de divorcer ?", "options": ["Non, le mariage est définitif", "Oui, mais seulement si le mari est d'accord", "Oui, mais seulement après 20 ans de mariage", "Oui, et il n'est pas nécessaire de prouver une faute"], "answer": 3, "explication": "Chaque époux peut mettre fin au mariage par le divorce, sans avoir besoin de prouver une faute de l'autre. C'est une liberté individuelle au sein du couple.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/droits-et-devoirs/droits-fondamentaux/les-libertes-au-sein-du-couple/"}, {"q": "La peine de mort est :", "options": ["abolie en France depuis 1981", "appliquée en France pour les crimes les plus graves", "abolie en France depuis 1789", "décidée par le maire de la commune"], "answer": 0, "explication": "La loi du 9 octobre 1981, portée par Robert Badinter, a aboli la peine de mort. Depuis 2007, la Constitution précise : « Nul ne peut être condamné à la peine de mort » (article 66-1).", "source": "https://www.info.gouv.fr/index.php/actualite/le-9-octobre-1981-la-peine-de-mort-est-abolie-en-france"}, {"q": "Laquelle de ces citations est inscrite dans la Déclaration des Droits de l'homme et du Citoyen de 1789 ?", "options": ["« La France est une République indivisible, laïque, démocratique et sociale. »", "« Les hommes naissent et demeurent libres et égaux en droits. »", "« Liberté, Égalité, Fraternité. »", "« Je pense, donc je suis. »"], "answer": 1, "explication": "C'est l'article 1er de la DDHC de 1789. La première proposition vient de l'article 1er de la Constitution de 1958, la troisième est la devise de la République et la dernière est de Descartes.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/droits-et-devoirs/droits-fondamentaux/les-principaux-textes-la-declaraion-des-droits-de-lhomme-et-du-citoyen/"}, {"q": "Le recours à l'avortement est-il autorisé ?", "options": ["Non, il est interdit en France", "Oui, mais seulement avec l'accord du conjoint", "Oui, l'IVG est légale en France et c'est une liberté garantie à la femme", "Oui, mais seulement pour les femmes de plus de 25 ans"], "answer": 2, "explication": "L'IVG est légale depuis la loi Veil du 17 janvier 1975 et, depuis la loi constitutionnelle du 8 mars 2024, la Constitution (article 34) garantit à la femme la liberté d'y recourir. Elle se fait sans l'accord du partenaire, dans un cadre médical réglementé.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/droits-et-devoirs/droits-fondamentaux/un-droit-fondamental-le-droit-de-disposer-de-son-corps/"}, {"q": "Que contient la Constitution ?", "options": ["Le Code de la route", "La liste des impôts locaux de chaque commune", "Le règlement intérieur des entreprises", "L'organisation de l'État et les droits et libertés fondamentaux"], "answer": 3, "explication": "La Constitution fixe l'organisation de l'État et du régime politique, ainsi que les principaux droits et libertés et la manière dont ils sont garantis. Celle de 1958 comprend un préambule et 108 articles.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/droits-et-devoirs/droits-fondamentaux/les-principaux-textes-la-constitution-de-la-5-republique/"}, {"q": "Que garantit la liberté de la presse ?", "options": ["Le droit d'écrire, d'imprimer et de publier librement, en répondant des abus prévus par la loi", "L'obligation pour les journaux de soutenir le gouvernement", "Le contrôle de chaque article par la police avant sa publication", "Le droit de publier des propos diffamatoires sans être sanctionné"], "answer": 0, "explication": "Selon l'article 11 de la DDHC, tout citoyen peut parler, écrire et imprimer librement, mais doit répondre de l'abus de cette liberté dans les cas prévus par la loi (par exemple la diffamation).", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/droits-et-devoirs/droits-fondamentaux/les-principaux-textes-la-declaraion-des-droits-de-lhomme-et-du-citoyen/"}, {"q": "Que prévoit la Charte de l'environnement ?", "options": ["L'interdiction totale des voitures en France", "Le droit de chacun de vivre dans un environnement équilibré et respectueux de la santé", "La suppression de toute activité industrielle", "Le droit de polluer à condition de payer une taxe"], "answer": 1, "explication": "C'est l'article 1er de la Charte de l'environnement (2004), intégrée à la Constitution en 2005. Elle prévoit aussi le devoir de chacun de préserver l'environnement et le principe de précaution.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/droits-et-devoirs/droits-fondamentaux/les-principaux-textes-la-charte-de-lenvironnement/"}, {"q": "Que signifie la dignité humaine ?", "options": ["Seuls les citoyens français ont droit au respect", "Le respect dépend de l'origine ou de la religion de la personne", "Chaque personne mérite le respect du seul fait d'être un être humain", "Le respect n'est dû qu'aux personnes qui ont un emploi"], "answer": 2, "explication": "La dignité humaine signifie que tout être humain a une valeur et doit être respecté, sans condition d'âge, de sexe, de santé, d'origine ou de religion. Une personne ne doit jamais être traitée comme un objet.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/droits-et-devoirs/droits-fondamentaux/la-diginite-humaine/"}, {"q": "Que signifie le droit de manifester ?", "options": ["Le droit de dégrader des biens publics pour se faire entendre", "Le droit d'empêcher le passage des secours", "L'obligation de participer aux défilés officiels", "Le droit de se rassembler sur la voie publique pour exprimer pacifiquement une opinion"], "answer": 3, "explication": "Manifester, c'est exprimer collectivement et pacifiquement ses opinions dans l'espace public. Ce droit découle de la liberté d'expression et s'exerce dans le respect de l'ordre public (déclaration préalable aux autorités).", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/droits-et-devoirs/obligations-et-devoirs-des-personnes-residant-en-france/la-limite-des-libertes-individuelles/"}, {"q": "Que signifie PMA ?", "options": ["Procréation médicalement assistée", "Protection maternelle et adoption", "Prestation médicale d'accompagnement", "Plan de maternité assistée"], "answer": 0, "explication": "La PMA (procréation médicalement assistée) regroupe les techniques médicales qui aident à avoir un enfant. Elle est ouverte à toutes les femmes, en couple ou seules, depuis la loi bioéthique de 2021.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/droits-et-devoirs/droits-fondamentaux/les-libertes-au-sein-du-couple/"}, {"q": "Quel texte est le plus difficile à modifier ?", "options": ["Un décret", "La Constitution", "Une loi ordinaire", "Un arrêté municipal"], "answer": 1, "explication": "La Constitution est le texte le plus élevé de l'ordre juridique : toutes les lois doivent la respecter, et sa révision exige une procédure spéciale (référendum ou Congrès). Elle est donc très difficile à modifier.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/droits-et-devoirs/droits-fondamentaux/les-principaux-textes-la-constitution-de-la-5-republique/"}, {"q": "Quelle liberté permet à une personne de croire en la religion de son choix ?", "options": ["La liberté d'entreprendre", "La liberté de circulation", "La liberté de conscience et de religion", "La liberté syndicale"], "answer": 2, "explication": "La liberté de conscience et de culte permet de croire, de ne pas croire ou de changer de religion. L'article 10 de la DDHC précise que nul ne doit être inquiété pour ses opinions, même religieuses.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/droits-et-devoirs/droits-fondamentaux/les-droits-inherents-a-la-personne-humaine/"}, {"q": "Qu'est-ce que le droit de grève ?", "options": ["Le droit pour l'employeur de fermer l'entreprise sans prévenir", "Le droit de bloquer les routes nationales", "Le droit de s'absenter seul pour des raisons personnelles", "Le droit d'arrêter collectivement le travail pour soutenir des revendications professionnelles"], "answer": 3, "explication": "La grève est une cessation collective et concertée du travail pour appuyer des revendications professionnelles (salaires, conditions de travail…). Tout salarié peut faire grève, syndiqué ou non.", "source": "https://www.service-public.gouv.fr/particuliers/vosdroits/F117"}, {"q": "Qu'est-ce que la Constitution ?", "options": ["Le texte juridique suprême qui fonde l'organisation de la République", "Un discours prononcé chaque année par le président", "Un règlement adopté par chaque mairie", "Un traité signé avec les pays voisins"], "answer": 0, "explication": "La Constitution est le texte fondateur de l'État : la Constitution actuelle, du 4 octobre 1958, est celle de la Ve République. Avec la DDHC, le préambule de 1946 et la Charte de l'environnement, elle forme la norme la plus haute.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/droits-et-devoirs/droits-fondamentaux/les-principaux-textes-la-constitution-de-la-5-republique/"}, {"q": "Qui peut demander à avorter ?", "options": ["Seulement les femmes mariées", "Toute femme enceinte, majeure ou mineure", "Seulement les femmes de nationalité française", "Seulement les femmes majeures avec l'accord de leurs parents"], "answer": 1, "explication": "L'IVG est ouverte à toutes les femmes, sans condition d'âge. Une mineure n'a pas besoin de l'autorisation de ses parents, mais doit être accompagnée d'une personne majeure de son choix.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/droits-et-devoirs/droits-fondamentaux/un-droit-fondamental-le-droit-de-disposer-de-son-corps/"}, {"q": "Une femme majeure de nationalité française a-t-elle le droit de voter aux élections ?", "options": ["Non, seuls les hommes votent", "Oui, mais seulement aux élections municipales", "Oui, les femmes ont le droit de vote depuis 1944", "Oui, mais seulement avec l'accord de son mari"], "answer": 2, "explication": "L'ordonnance du 21 avril 1944 a donné aux femmes le droit de vote et d'éligibilité ; elles ont voté pour la première fois le 29 avril 1945. Le suffrage universel s'applique à tous les citoyens majeurs, femmes et hommes.", "source": "https://www.info.gouv.fr/actualite/droit-de-vote-il-est-important-de-se-souvenir-que-les-femmes-se-sont-battues-pour-lobtenir"}, {"q": "Concernant l'utilisation des réseaux sociaux, quelle proposition est correcte ?", "options": ["On peut tout publier, car Internet n'est pas soumis à la loi", "Un message anonyme ne peut jamais être poursuivi", "On peut publier des insultes si le compte est privé", "La loi s'applique aussi en ligne : harceler, menacer ou insulter est puni"], "answer": 3, "explication": "Les réseaux sociaux ne sont pas une zone de non-droit : le cyberharcèlement est un délit et les injures, menaces ou diffamations en ligne sont sanctionnées. On peut les signaler sur internet-signalement.gouv.fr ou appeler le 3018.", "source": "https://www.cybermalveillance.gouv.fr/medias/2022/09/230422_FicheReflexe_Cyberharcelement.pdf"}, {"q": "Jeter un mégot par terre est :", "options": ["une infraction punie d'une amende", "autorisé si le mégot est éteint", "un crime jugé par la cour d'assises", "un geste sans aucune conséquence"], "answer": 0, "explication": "Abandonner un déchet, y compris un mégot, dans l'espace public est une contravention sanctionnée par une amende. Cela pollue et coûte cher à la collectivité.", "source": "https://www.service-public.gouv.fr/particuliers/actualites/A18955"}, {"q": "L'État peut-il limiter les droits et libertés ?", "options": ["Non, jamais", "Oui, dans les cas prévus par la loi, pour protéger l'ordre public ou les droits des autres", "Oui, à tout moment et sans justification", "Oui, mais seulement ceux des étrangers"], "answer": 1, "explication": "La liberté consiste à faire tout ce qui ne nuit pas à autrui (article 4 de la DDHC). L'État peut donc encadrer les libertés pour l'intérêt général, l'ordre public, la dignité humaine ou les libertés des autres.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/droits-et-devoirs/obligations-et-devoirs-des-personnes-residant-en-france/la-limite-des-libertes-individuelles/"}, {"q": "Parmi ces actions, laquelle permet d'adopter une attitude respectueuse de l’environnement ?", "options": ["Laisser la lumière allumée en permanence", "Jeter ses piles usagées avec les ordures ménagères", "Économiser l'eau et l'énergie", "Déposer ses vieux meubles sur le trottoir"], "answer": 2, "explication": "Chaque résident doit agir au quotidien pour l'environnement : économiser l'eau et l'énergie, consommer de façon responsable, choisir ses transports, réutiliser et recycler.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/droits-et-devoirs/obligations-et-devoirs-des-personnes-residant-en-france/les-obligations-en-tant-que-resident-francais/"}, {"q": "Quelle proposition constitue une obligation ?", "options": ["Adhérer à un parti politique", "Pratiquer une religion", "Posséder une voiture", "Payer ses impôts"], "answer": 3, "explication": "Payer ses impôts, selon ses revenus, est une obligation pour toute personne résidant en France ; elle figure déjà dans la DDHC de 1789. L'impôt finance les services publics (école, hôpitaux, police, justice…).", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/droits-et-devoirs/obligations-et-devoirs-des-personnes-residant-en-france/les-obligations-en-tant-que-resident-francais/"}, {"q": "Pour quel motif peut-on limiter la liberté d'expression ?", "options": ["Pour protéger les droits des autres, par exemple contre l'injure, la diffamation ou l'incitation à la haine", "Pour empêcher de critiquer le gouvernement", "Pour interdire de parler une langue étrangère", "Pour empêcher de parler de religion en public"], "answer": 0, "explication": "On peut s'exprimer librement, mais on doit répondre des abus prévus par la loi (article 11 de la DDHC). Les limites protègent les autres et l'ordre public : injure, diffamation, appel à la haine ou à la violence sont punis.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/droits-et-devoirs/obligations-et-devoirs-des-personnes-residant-en-france/la-limite-des-libertes-individuelles/"}, {"q": "Pourquoi doit-on trier ses déchets ?", "options": ["Pour remplir plus vite les poubelles", "Pour permettre leur recyclage et protéger l'environnement", "Parce que le tri est réservé aux propriétaires", "Pour augmenter la quantité de déchets brûlés"], "answer": 1, "explication": "Trier permet de recycler et de réutiliser les matériaux, ce qui réduit la pollution et économise les ressources. Chacun a le devoir de participer à la préservation de l'environnement (Charte de l'environnement, article 2).", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/droits-et-devoirs/obligations-et-devoirs-des-personnes-residant-en-france/les-obligations-en-tant-que-resident-francais/"}, {"q": "Que doit faire une victime de violences ?", "options": ["Garder le silence, car c'est une affaire privée", "Se faire justice elle-même", "En parler, appeler le 17 en cas d'urgence et porter plainte", "Attendre que la situation s'arrange d'elle-même"], "answer": 2, "explication": "La victime n'est jamais responsable : elle peut en parler à une personne de confiance, se faire aider par une association, appeler le 17 (ou le 3919 pour les violences conjugales) et porter plainte au commissariat ou à la gendarmerie.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/droits-et-devoirs/obligations-et-devoirs-des-personnes-residant-en-france/la-protection-des-victimes-de-violences/"}, {"q": "Que doit-on faire face aux ordres des policiers ou gendarmes ?", "options": ["Les ignorer si on n'est pas d'accord", "Leur résister physiquement", "Prendre la fuite", "Les respecter, quitte à les contester ensuite par les voies légales"], "answer": 3, "explication": "Les policiers et gendarmes font respecter la loi : il faut obéir à leurs ordres légitimes. Refuser d'obtempérer ou résister avec violence est une infraction ; on peut contester ensuite devant la justice ou par une réclamation.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/droits-et-devoirs/obligations-et-devoirs-des-personnes-residant-en-france/se-conformer-aux-lois-les-acteurs/"}, {"q": "Quel est le rôle de la police ?", "options": ["Faire respecter la loi et protéger les personnes et les biens", "Voter les lois", "Juger et condamner les auteurs d'infractions", "Collecter les impôts"], "answer": 0, "explication": "La police (en ville) et la gendarmerie (en zone rurale) préviennent les infractions, maintiennent l'ordre public, protègent les personnes et les biens et enquêtent. Ce sont les juges, et non la police, qui condamnent.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/droits-et-devoirs/obligations-et-devoirs-des-personnes-residant-en-france/se-conformer-aux-lois-les-acteurs/"}, {"q": "Quel est un exemple d’assistance à personne en danger ?", "options": ["Filmer la scène sans intervenir", "Appeler les secours (15, 18 ou 112) pour une personne qui fait un malaise dans la rue", "Passer son chemin", "Attendre que quelqu'un d'autre réagisse"], "answer": 1, "explication": "Toute personne doit porter secours à quelqu'un en danger, au minimum en alertant les secours. Ne pas le faire peut être puni pour « non-assistance à personne en danger ».", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/droits-et-devoirs/obligations-et-devoirs-des-personnes-residant-en-france/les-obligations-en-tant-que-resident-francais/"}, {"q": "Quel exemple illustre une limitation de liberté pour protéger l'intérêt général ?", "options": ["L'interdiction de prier chez soi", "L'interdiction pour les femmes de travailler", "Les restrictions de déplacement pendant
