uelle chaîne de montagnes est située entre la France et l’Espagne ?", "options": ["Les Pyrénées", "Les Alpes", "Le Jura", "Les Vosges"], "answer": 0, "explication": "Les Pyrénées se situent entre la France et l'Espagne.", "source": "Livret du citoyen 2026, p. 51"}, {"q": "Quelle île française se trouve dans l'océan Indien ?", "options": ["La Réunion", "La Corse", "La Martinique", "La Guadeloupe"], "answer": 0, "explication": "La Réunion est une île volcanique de l'océan Indien, à l'est de Madagascar ; la Martinique et la Guadeloupe sont dans les Caraïbes.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/les-regions-fran%C3%A7aises/la-reunion/"}, {"q": "Quelle est la population approximative de la France en 2025 ?", "options": ["Environ 38 millions d'habitants", "Environ 98 millions d'habitants", "Environ 68,6 millions d'habitants", "Environ 150 millions d'habitants"], "answer": 2, "explication": "En 2025, la France compte 68,6 millions d'habitants, en métropole et outre-mer.", "source": "Livret du citoyen 2026, p. 49"}, {"q": "Quel fleuve traverse Paris ?", "options": ["La Seine", "La Loire", "Le Rhône", "La Garonne"], "answer": 0, "explication": "La Seine traverse Paris, la capitale de la France.", "source": "Livret du citoyen 2026, p. 51"}, {"q": "Lequel de ces pays partage des frontières terrestres avec la France ?", "options": ["La Suisse", "Le Danemark", "La Pologne", "Le Royaume-Uni"], "answer": 0, "explication": "La Suisse fait partie des 8 pays qui partagent une frontière terrestre avec la France métropolitaine ; le Royaume-Uni en est séparé par la Manche.", "source": "Livret du citoyen 2026, p. 49"}, {"q": "Quel pays a une frontière avec la France métropolitaine au nord-est ?", "options": ["L'Espagne", "Andorre", "L'Allemagne", "L'Italie"], "answer": 2, "explication": "L'Allemagne, comme la Belgique et le Luxembourg, est voisine de la France au nord-est ; l'Espagne et Andorre sont au sud, l'Italie au sud-est.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/atlas-de-la-france/les-frontieres-de-la-france/"}, {"q": "Où se trouvent les principales activités économiques en France ?", "options": ["Dans les zones de montagne", "Dans les petits villages ruraux", "Uniquement dans les ports", "Dans les grandes métropoles"], "answer": 3, "explication": "La population, les emplois, les richesses et les sièges d'entreprises se concentrent dans les métropoles : c'est la métropolisation.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/atlas-de-la-france/la-france-aire-urbaine-et-metropolisation/"}, {"q": "Parmi ces pays, lequel attire le plus de visiteurs chaque année ?", "options": ["L'Allemagne", "La France", "Le Portugal", "La Belgique"], "answer": 1, "explication": "Grâce à sa culture et à son patrimoine, la France est la première destination touristique au monde.", "source": "Livret du citoyen 2026, p. 53"}, {"q": "Où habite la majorité des Français ?", "options": ["À la campagne", "En montagne", "Dans les territoires d'outre-mer", "En ville"], "answer": 3, "explication": "Environ 81 % de la population vit en ville, surtout dans les grandes aires urbaines comme Paris, Lyon ou Marseille.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/atlas-de-la-france/la-demographie-francaise/"}, {"q": "Quelle région est la plus peuplée ?", "options": ["La Corse", "L'Île-de-France", "La Bretagne", "Le Centre-Val de Loire"], "answer": 1, "explication": "Avec environ 12,4 millions d'habitants, l'Île-de-France est la région la plus peuplée de France.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/les-regions-fran%C3%A7aises/ile-de-france/"}, {"q": "Quelle ville française fait partie des 10 plus grandes métropoles du pays ?", "options": ["Limoges", "Brest", "Bordeaux", "Amiens"], "answer": 2, "explication": "Au 1er janvier 2025, Bordeaux figure parmi les plus grandes villes de France, avec Paris, Lyon, Lille, Marseille, Toulouse, Nantes, Nice et Strasbourg.", "source": "Livret du citoyen 2026, p. 49"}, {"q": "Lequel de ces départements de France est le plus touristique ?", "options": ["La Creuse", "Le Cantal", "La Côte-d'Or", "Paris"], "answer": 3, "explication": "Avec ses monuments et ses musées (Louvre, tour Eiffel, Orsay), Paris est le département qui attire le plus de visiteurs.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/la-france-dans-leurope-et-dans-le-monde/une-puissance-touristique/"}, {"q": "Quand peut-on visiter gratuitement des lieux culturels en France ?", "options": ["Tous les lundis", "Uniquement le 14 juillet", "Lors de journées gratuites organisées par les musées publics", "Jamais : l'entrée est toujours payante"], "answer": 2, "explication": "Les musées publics organisent des journées gratuites ou proposent des tarifs réduits pour rendre les œuvres accessibles à tous ; en septembre, les Journées du patrimoine ouvrent aussi de nombreux lieux habituellement fermés.", "source": "Livret du citoyen 2026, p. 53"}, {"q": "Combien de personnes parlent français dans le monde ?", "options": ["Environ 70 millions", "Environ 150 millions", "Plus de 1 milliard", "Plus de 300 millions"], "answer": 3, "explication": "Selon l'OIF, le français est parlé par plus de 300 millions de personnes, réparties sur les 5 continents.", "source": "Livret du citoyen 2026, p. 57"}, {"q": "Qui était Marguerite Yourcenar ?", "options": ["Une chanteuse française", "Une écrivaine française", "Une reine de France", "Une résistante fusillée en 1944"], "answer": 1, "explication": "Marguerite Yourcenar (1903-1987), née à Bruxelles, est une écrivaine française, célèbre pour « Mémoires d'Hadrien » et première femme élue à l'Académie française.", "source": "Livret du citoyen 2026, p. 48"}, {"q": "Quel peintre est français ?", "options": ["Vincent Van Gogh", "Claude Monet", "Rembrandt", "Francisco de Goya"], "answer": 1, "explication": "Claude Monet (1840-1926) est un peintre français, l'un des fondateurs de l'impressionnisme (« Impression, soleil levant », « Les Nymphéas »).", "source": "Livret du citoyen 2026, p. 55"}, {"q": "Quel musée est situé à Paris ?", "options": ["Le musée d'Orsay", "Le musée du Prado", "Le British Museum", "Le MoMA"], "answer": 0, "explication": "Le musée d'Orsay est situé à Paris, au bord de la Seine ; le Prado est à Madrid, le British Museum à Londres et le MoMA à New York.", "source": "Livret du citoyen 2026, p. 54"}, {"q": "Qui était Auguste Rodin ?", "options": ["Un président de la République", "Un sculpteur", "Un chanteur", "Un général de la Première Guerre mondiale"], "answer": 1, "explication": "Auguste Rodin (1840-1917) est l'un des plus grands sculpteurs du XIXe siècle, connu pour « L'Âge d'airain » et « Le Penseur ».", "source": "Livret du citoyen 2026, p. 55"}, {"q": "Quel est le classement de la langue française parmi les langues les plus parlées dans le monde ?", "options": ["1re", "4e", "12e", "20e"], "answer": 1, "explication": "Selon l'OIF, le français est la 4e langue la plus parlée au monde.", "source": "Livret du citoyen 2026, p. 57"}, {"q": "Quelle cathédrale célèbre a été en partie détruite par un incendie en 2019 ?", "options": ["La cathédrale de Chartres", "La cathédrale de Reims", "Notre-Dame de Paris", "La cathédrale de Strasbourg"], "answer": 2, "explication": "Notre-Dame de Paris a brûlé en 2019 ; plus de 840 millions d'euros de dons ont financé sa reconstruction.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/histoire-geographie-et-culture/culture/patrimoine-francais-le-citoyen-acteur-et-conservateur-de-la-culture-en-france/"}, {"q": "Qui était une écrivaine française célèbre ?", "options": ["Virginia Woolf", "Simone de Beauvoir", "Agatha Christie", "Jane Austen"], "answer": 1, "explication": "Simone de Beauvoir (1908-1986) est une écrivaine française, considérée comme précurseure du mouvement féministe ; les trois autres sont britanniques.", "source": "Livret du citoyen 2026, p. 55"}, {"q": "Qui était un célèbre musicien français ?", "options": ["Wolfgang Amadeus Mozart", "Ludwig van Beethoven", "Claude Debussy", "Giuseppe Verdi"], "answer": 2, "explication": "Claude Debussy (1862-1918) est un compositeur français, l'un des plus grands musiciens français du début du XXe siècle.", "source": "Livret du citoyen 2026, p. 55"}, {"q": "Qui était Auguste Renoir ?", "options": ["Un écrivain du XVIIe siècle", "Un roi de France", "Un inventeur du cinéma", "Un peintre impressionniste"], "answer": 3, "explication": "Auguste Renoir (1841-1919) est un peintre impressionniste français, connu pour ses représentations de figures humaines.", "source": "Livret du citoyen 2026, p. 55"}, {"q": "Quelle fête est française ?", "options": ["Thanksgiving", "La Saint-Patrick", "Le 4 juillet, fête de l'Indépendance", "Le 14 juillet, fête nationale"], "answer": 3, "explication": "Le 14 juillet est la fête nationale française, avec un défilé militaire sur les Champs-Élysées, des bals et des feux d'artifice ; Thanksgiving et le 4 juillet sont américains, la Saint-Patrick irlandaise.", "source": "Livret du citoyen 2026, p. 57"}]}, {"theme": "Vivre dans la société française", "questions": [{"q": "Quel mariage est reconnu par l'État ?", "options": ["Le mariage civil célébré à la mairie", "Le mariage religieux uniquement", "Le mariage coutumier", "Toute union célébrée devant des témoins"], "answer": 0, "explication": "En France, seul le mariage civil célébré en mairie, par le maire ou un adjoint, est reconnu par la loi ; il est ouvert aux couples de même sexe depuis 2013.", "source": "Livret du citoyen 2026, p. 73"}, {"q": "Auprès de quelle institution les parents peuvent-ils inscrire leur enfant à l'école publique ?", "options": ["La préfecture", "La mairie", "La caisse d'allocations familiales (CAF)", "Le commissariat de police"], "answer": 1, "explication": "Ce sont les mairies qui gèrent les inscriptions des enfants à l'école publique.", "source": "Livret du citoyen 2026, p. 75"}, {"q": "En cas de divorce, qui exerce l'autorité parentale ?", "options": ["Toujours la mère seule", "Toujours le père seul", "En règle générale, les deux parents en commun", "Le parent qui a les revenus les plus élevés"], "answer": 2, "explication": "Après un divorce, l'autorité parentale continue d'être exercée par les deux parents, sauf décision de justice contraire.", "source": "Livret du citoyen 2026, p. 73"}, {"q": "Quelle aide permet aux personnes qui ont des difficultés financières d'avoir un avocat ?", "options": ["L'allocation de rentrée scolaire", "La prime d'activité", "L'aide personnalisée au logement (APL)", "L'aide juridictionnelle"], "answer": 3, "explication": "L'aide juridictionnelle est une aide financière de l'État pour les personnes ayant peu de moyens qui ont besoin d'être accompagnées par un avocat lors d'un procès.", "source": "Livret du citoyen 2026, p. 30"}, {"q": "Où faut-il déclarer la naissance d'un enfant ?", "options": ["À la préfecture du domicile", "À la mairie du lieu de naissance", "Au consulat du pays d'origine des parents", "À la caisse primaire d'assurance maladie (CPAM)"], "answer": 1, "explication": "La déclaration de naissance est obligatoire dans les 5 jours qui suivent la naissance ; elle se fait auprès du service d'état civil de la commune, c'est-à-dire à la mairie du lieu de naissance.", "source": "Livret du citoyen 2026, p. 73"}, {"q": "Quelle est l'une des conditions pour passer l'examen du permis de conduire ?", "options": ["Avoir au moins 21 ans", "Être de nationalité française", "Être propriétaire d'une voiture", "Avoir au moins 17 ans"], "answer": 3, "explication": "Pour passer le permis de conduire (voiture) en France, il faut avoir au moins 17 ans et résider en France ; on peut passer par une auto-école ou en candidat libre.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/vivre-dans-la-societe-fran%C3%A7aise/demarches-administratives/les-demarches-du-quotidien-comme-le-permis-de-conduire-1/"}, {"q": "Un bail locatif est valide s'il est :", "options": ["Écrit et signé par le locataire et le propriétaire", "Simplement conclu oralement entre le locataire et le propriétaire", "Signé uniquement par le locataire", "Validé par la préfecture"], "answer": 0, "explication": "Le bail est un contrat écrit entre le bailleur et le locataire : il n'est valide que s'il est signé par les deux, et c'est le seul document qui autorise à vivre dans le logement.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/vivre-dans-la-societe-fran%C3%A7aise/demarches-administratives/les-demarches-relatives-au-logement-1/"}, {"q": "Où peut-on déposer un lave-vaisselle cassé ?", "options": ["Dans la poubelle des ordures ménagères", "Sur le trottoir, à n'importe quel moment", "À la déchetterie", "Dans le bac de tri des emballages"], "answer": 2, "explication": "Des déchèteries sont présentes dans chaque territoire pour y déposer les appareils électroménagers, les encombrants et les déchets verts ; les dépôts sauvages sont interdits et punis d'une amende.", "source": "Livret du citoyen 2026, p. 66"}, {"q": "Quel numéro d'urgence permet d'appeler la police ?", "options": ["Le 17", "Le 15", "Le 18", "Le 115"], "answer": 0, "explication": "Le 17 permet d'appeler Police secours ; le 15 est le SAMU, le 18 les sapeurs-pompiers, le 112 le numéro d'appel d'urgence européen et le 115 l'hébergement d'urgence. Ces appels sont gratuits.", "source": "Livret du citoyen 2026, p. 69"}, {"q": "Concernant l'accès aux soins, quelle proposition est correcte ?", "options": ["Le médecin est imposé au patient par la mairie", "Chaque patient peut choisir librement son médecin", "L'hôpital public est réservé aux personnes de nationalité française", "Un patient peut exiger un acte contraire à l'organisation de l'hôpital pour des raisons religieuses"], "answer": 1, "explication": "Le libre choix du praticien et de l'établissement de santé est un droit du patient : aucun médecin ni hôpital ne peut lui être imposé, et le service public hospitalier est accessible à tous.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/vivre-dans-la-societe-fran%C3%A7aise/sante/sante-les-droits-du-patient/"}, {"q": "À qui est accessible la contraception ?", "options": ["Uniquement aux personnes majeures", "Uniquement aux femmes mariées", "À toutes les femmes et à tous les hommes, y compris les mineurs", "Aux mineures, seulement avec l'autorisation de leurs parents"], "answer": 2, "explication": "Le droit à la contraception, c'est-à-dire pouvoir choisir de ne pas devenir parent, est garanti à tous, y compris aux mineurs.", "source": "Livret du citoyen 2026, p. 29"}, {"q": "Qu’est-ce que le principe de confidentialité dans le domaine de la santé ?", "options": ["Le médecin doit informer l'employeur de l'état de santé du patient", "Le patient ne peut pas consulter son propre dossier médical", "Les informations médicales peuvent être communiquées librement à la famille", "Le médecin doit garder secrètes les informations médicales du patient"], "answer": 3, "explication": "Les personnels de santé ont l'obligation de garder secrètes les informations médicales d'un patient : c'est le principe de confidentialité dans le domaine de la santé.", "source": "Livret du citoyen 2026, p. 68"}, {"q": "L'inscription à l'Assurance maladie est :", "options": ["Réservée aux personnes de nationalité française", "Obligatoire pour toute personne qui travaille ou réside en France de manière stable et régulière", "Facultative et réservée aux salariés", "Payante chaque mois auprès de la mairie"], "answer": 1, "explication": "Tous les résidents en France ont l'obligation d'être inscrits à l'Assurance maladie, selon leur situation et dans les conditions fixées par la loi ; chaque assuré reçoit une carte Vitale.", "source": "Livret du citoyen 2026, p. 68"}, {"q": "Qui peut demander un congé parental d'éducation ?", "options": ["Uniquement la mère", "Uniquement les parents mariés", "Uniquement les fonctionnaires", "Tout(e) salarié(e), père ou mère, après la naissance ou l'adoption d'un enfant"], "answer": 3, "explication": "Après la naissance ou l'adoption d'un enfant de moins de 16 ans, tout(e) salarié(e), père ou mère, peut bénéficier d'un congé parental d'éducation pour interrompre ou réduire son activité afin d'élever l'enfant.", "source": "Livret du citoyen 2026, p. 73"}, {"q": "Quelles sont les affaires traitées par le conseil de prud'hommes ?", "options": ["Les litiges entre un salarié et son employeur liés au contrat de travail", "Les conflits entre voisins", "Les divorces", "Les infractions au code de la route"], "answer": 0, "explication": "En cas de litige entre un employeur et son salarié, c'est le conseil de prud'hommes qui est compétent pour juger.", "source": "Livret du citoyen 2026, p. 70"}, {"q": "Travailler sans être déclaré est :", "options": ["Autorisé si le salarié est d'accord", "Autorisé pendant la période d'essai", "Interdit par la loi", "Autorisé pour les emplois de moins de 10 heures par semaine"], "answer": 2, "explication": "Le travail non déclaré (travail dissimulé) est interdit : l'employeur risque jusqu'à 3 ans de prison et 45 000 € d'amende, et le salarié perd ses droits (chômage, retraite, Sécurité sociale, congés payés).", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/vivre-dans-la-societe-fran%C3%A7aise/emploi/le-droit-au-travail-5/"}, {"q": "Lorsqu'un employeur veut qu'un salarié travaille plus longtemps que la durée prévue dans le contrat de travail :", "options": ["Il doit payer ces heures supplémentaires ou les compenser par du repos", "Il n'a rien à payer en plus", "Il peut retenir une partie du salaire si le salarié refuse", "Il doit demander l'autorisation du maire"], "answer": 0, "explication": "Les heures travaillées au-delà de la durée légale (35 heures par semaine) sont des heures supplémentaires : l'employeur doit les payer (avec majoration) ou permettre au salarié de les récupérer.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/vivre-dans-la-societe-fran%C3%A7aise/emploi/le-droit-au-travail-1/"}, {"q": "Quelle est la mission de France Travail ?", "options": ["Délivrer les titres de séjour", "Accompagner les demandeurs d'emploi et leur verser leurs allocations", "Contrôler le respect du code du travail dans les entreprises", "Juger les conflits entre salariés et employeurs"], "answer": 1, "explication": "France Travail est l'organisme public qui accompagne les personnes dans leur recherche d'emploi, peut proposer des formations et verse, si les conditions sont remplies, l'allocation d'aide au retour à l'emploi (ARE).", "source": "Livret du citoyen 2026, p. 71"}, {"q": "Dans une entreprise, le droit syndical permet :", "options": ["À l'employeur d'obliger les salariés à adhérer à un syndicat", "À l'employeur de sanctionner un salarié syndiqué", "De créer un syndicat, d'y adhérer ou d'y participer librement", "De ne plus respecter le règlement intérieur"], "answer": 2, "explication": "Chaque travailleur, sans condition, a le droit de rejoindre une organisation syndicale pour le représenter au travail ; chacun peut défendre ses droits par l'action syndicale.", "source": "Livret du citoyen 2026, p. 70"}, {"q": "Dans une entreprise, le droit de grève autorise :", "options": ["Les salariés à être payés normalement pendant la grève", "Les salariés à dégrader le matériel de l'entreprise", "L'employeur à licencier les salariés grévistes", "Les salariés à arrêter collectivement le travail pour soutenir des revendications professionnelles"], "answer": 3, "explication": "La grève est un arrêt collectif et concerté du travail pour appuyer des revendications professionnelles ; le salaire est retenu pour la durée de l'arrêt, mais le gréviste ne peut pas être sanctionné ni licencié (sauf faute lourde).", "source": "https://www.service-public.gouv.fr/particuliers/vosdroits/F117"}, {"q": "Quelles sont les conditions pour toucher les allocations chômage ?", "options": ["Avoir démissionné sans motif et être inscrit à la mairie", "Avoir perdu son emploi sans l'avoir quitté volontairement, avoir travaillé suffisamment longtemps et être inscrit à France Travail", "Avoir simplement travaillé un jour dans sa vie, sans inscription", "Être de nationalité française et avoir plus de 25 ans"], "answer": 1, "explication": "Pour être indemnisé, il faut s'inscrire à France Travail ; l'allocation d'aide au retour à l'emploi (ARE) est versée si les conditions sont remplies : avoir travaillé suffisamment longtemps et ne pas avoir quitté son travail de manière volontaire.", "source": "Livret du citoyen 2026, p. 71"}, {"q": "Qu'est-ce que l'école maternelle ?", "options": ["Une crèche réservée aux bébés de moins de 2 ans", "Une école privée payante et facultative", "L'école des enfants de 6 à 11 ans", "La première étape de l'école, pour les enfants de 3 à 6 ans"], "answer": 3, "explication": "L'école maternelle accueille les enfants au début de l'instruction obligatoire, qui débute à 3 ans ; l'école élémentaire prend le relais de 6 à 11 ans.", "source": "Livret du citoyen 2026, p. 75"}, {"q": "Comment s'appelle le diplôme passé par les élèves à la fin du collège ?", "options": ["Le diplôme national du brevet (DNB)", "Le baccalauréat", "Le certificat d'aptitude professionnelle (CAP)", "La licence"], "answer": 0, "explication": "À la fin de la classe de 3e, les collégiens passent le diplôme national du brevet (brevet des collèges) ; le baccalauréat se passe à la fin du lycée.", "source": "https://formation-civique.interieur.gouv.fr/fiches-par-thematiques/vivre-dans-la-societe-fran%C3%A7aise/parentalite/le-sys const QS = [];
DATA.forEach((t, ti) => t.questions.forEach((q, qi) => QS.push({ ...q, id: ti + "-" + qi, ti, theme: t.theme })));

const KEY = "civique-cr-v1";
let store = {};
try { store = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { store = {}; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
function rec(id, ok) { store[id] = ok ? 1 : 0; save(); }

const app = document.getElementById("app");
const L = ["A", "B", "C", "D"];
let session = null, timer = null;

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function prep(q) { const order = shuffle([0, 1, 2, 3]); return { q, order, chosen: null }; }

function home() {
  clearInterval(timer); session = null;
  const seen = QS.filter(q => q.id in store).length;
  const good = QS.filter(q => store[q.id] === 1).length;
  const bad = QS.filter(q => store[q.id] === 0).length;
  const rows = DATA.map((t, ti) => {
    const qs = QS.filter(q => q.ti === ti), n = qs.length;
    const g = qs.filter(q => store[q.id] === 1).length, r = qs.filter(q => store[q.id] === 0).length;
    return `<button class="theme" data-theme-i="${ti}"><span class="name">${esc(t.theme)}</span><span class="count">${g}/${n}</span>
      <span class="bar"><i class="g" style="width:${g / n * 100}%"></i><i class="r" style="width:${r / n * 100}%"></i></span></button>`;
  }).join("");
  app.innerHTML = `
    <header style="display:flex;flex-direction:column;gap:10px">
      <div class="tricolore"><span></span><span></span><span></span></div>
      <p class="eyebrow">Examen civique · carte de résident</p>
      <h1>Les ${QS.length} questions de la liste officielle</h1>
      <p class="lede">Une seule bonne réponse sur quatre, comme le jour de l'épreuve. L'ordre des réponses change à chaque passage. Réponses vérifiées avec le Livret du citoyen 2026.</p>
    </header>
    <div class="stats">
      <div class="stat"><b>${seen}</b><span>vues sur ${QS.length}</span></div>
      <div class="stat"><b style="color:var(--ok)">${good}</b><span>réussies</span></div>
      <div class="stat"><b style="color:var(--ko)">${bad}</b><span>à revoir</span></div>
    </div>
    <div class="row">
      <button class="btn" id="exam">Examen blanc · 40 questions</button>
      <button class="btn ghost" id="errs" ${bad ? "" : "disabled"}>Revoir mes erreurs (${bad})</button>
    </div>
    <section style="display:flex;flex-direction:column;gap:10px">
      <h2>S'entraîner par thème</h2>
      <div class="themes">${rows}</div>
      <div class="legend"><span style="--c:var(--ok)">Dernière réponse juste</span><span style="--c:var(--ko)">Dernière réponse fausse</span></div>
    </section>
    <p class="note">L'examen réel comporte aussi 12 mises en situation qui ne sont pas publiques ; l'examen blanc ici tire 40 questions de connaissance au hasard. Seuil de réussite : 32/40 (80 %), en 45 minutes.</p>
    <div class="row">
      <button class="link" id="reset">Effacer ma progression</button>
    </div>
    <div id="confirmBox"></div>`;
  app.querySelectorAll("[data-theme-i]").forEach(b => b.onclick = () => start("theme", shuffle(QS.filter(q => q.ti === +b.dataset.themeI)), DATA[+b.dataset.themeI].theme));
  app.querySelector("#exam").onclick = () => start("exam", shuffle(QS).slice(0, 40), "Examen blanc");
  app.querySelector("#errs").onclick = () => start("theme", shuffle(QS.filter(q => store[q.id] === 0)), "Mes erreurs");
  app.querySelector("#reset").onclick = () => {
    app.querySelector("#confirmBox").innerHTML = `<div class="confirm"><p>Effacer toutes les réponses enregistrées sur cet appareil ?</p>
      <div class="row"><button class="btn" id="yes">Effacer</button><button class="btn ghost" id="no">Annuler</button></div></div>`;
    app.querySelector("#yes").onclick = () => { store = {}; save(); home(); };
    app.querySelector("#no").onclick = () => app.querySelector("#confirmBox").innerHTML = "";
  };
  window.scrollTo(0, 0);
}

function start(mode, list, label) {
  session = { mode, label, items: list.map(prep), i: 0, end: mode === "exam" ? Date.now() + 45 * 60000 : null };
  if (mode === "exam") { clearInterval(timer); timer = setInterval(tick, 1000); }
  show();
}

function tick() {
  const el = document.getElementById("clock"); if (!session || !el) return;
  const s = Math.max(0, Math.round((session.end - Date.now()) / 1000));
  el.textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  el.classList.toggle("warn", s < 300);
  if (s === 0) finish();
}

function show() {
  const S = session, it = S.items[S.i], q = it.q, n = S.items.length, exam = S.mode === "exam";
  const answered = it.chosen !== null;
  const opts = it.order.map((oi, k) => {
    let cls = "opt";
    if (answered && !exam) { if (oi === q.answer) cls += " good"; else if (oi === it.chosen) cls += " bad"; }
    else if (answered && exam && oi === it.chosen) cls += " chosen";
    return `<button class="${cls}" data-o="${oi}" ${answered && !exam ? "disabled" : ""}><span class="k">${L[k]}</span><span>${esc(q.options[oi])}</span></button>`;
  }).join("");
  let fb = "";
  if (answered && !exam) {
    const ok = it.chosen === q.answer;
    fb = `<div class="feedback" style="--c:var(${ok ? "--ok" : "--ko"})"><span class="verdict">${ok ? "Bonne réponse" : "Réponse : " + esc(q.options[q.answer])}</span>
      <p>${esc(q.explication)}</p>${!q.source ? "" : /^https?:/.test(q.source) ? `<a href="${esc(q.source)}" target="_blank" rel="noopener">Source</a>` : `<span class="note">Source : ${esc(q.source)}</span>`}</div>`;
  }
  const last = S.i === n - 1;
  app.innerHTML = `
    <div class="top"><button class="link" id="quit">← Accueil</button>
      ${exam ? `<span class="meta" id="clock">45:00</span>` : ""}<span class="meta">${S.i + 1} / ${n}</span></div>
    <div class="progress"><i style="width:${(S.i + (answered ? 1 : 0)) / n * 100}%"></i></div>
    <article class="card">
      <p class="eyebrow">${esc(S.label === q.theme ? q.theme : q.theme)}</p>
      <h2>${esc(q.q)}</h2>
      <div class="opts">${opts}</div>
      ${fb}
    </article>
    <div class="row">
      ${S.i > 0 && exam ? `<button class="btn ghost" id="prev">Précédente</button>` : ""}
      <button class="btn" id="next" ${answered ? "" : "disabled"}>${last ? (exam ? "Terminer l'examen" : "Voir le bilan") : "Question suivante"}</button>
    </div>
    <div id="confirmBox"></div>`;
  if (exam) tick();
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    if (it.chosen !== null && !exam) return;
    it.chosen = +b.dataset.o;
    if (!exam) rec(q.id, it.chosen === q.answer);
    show();
  });
  app.querySelector("#next").onclick = () => { if (last) finish(); else { S.i++; show(); window.scrollTo(0, 0); } };
  const prev = app.querySelector("#prev"); if (prev) prev.onclick = () => { S.i--; show(); };
  app.querySelector("#quit").onclick = () => {
    app.querySelector("#confirmBox").innerHTML = `<div class="confirm"><p>Quitter cette série ? Les réponses déjà données ${exam ? "à l'examen blanc ne seront pas comptées" : "restent enregistrées"}.</p>
      <div class="row"><button class="btn" id="yes">Quitter</button><button class="btn ghost" id="no">Continuer</button></div></div>`;
    app.querySelector("#yes").onclick = home;
    app.querySelector("#no").onclick = () => app.querySelector("#confirmBox").innerHTML = "";
  };
}

function finish() {
  clearInterval(timer);
  const S = session, exam = S.mode === "exam";
  if (exam) S.items.forEach(it => { if (it.chosen !== null) rec(it.q.id, it.chosen === it.q.answer); });
  const done = S.items.filter(it => it.chosen !== null);
  const good = done.filter(it => it.chosen === it.q.answer).length, n = S.items.length;
  const pass = exam ? good >= 32 : good / Math.max(1, n) >= 0.8;
  const wrong = S.items.filter(it => it.chosen !== it.q.answer);
  const review = wrong.map(it => `<div class="ritem" style="--c:var(--ko)"><span class="q">${esc(it.q.q)}</span>
      <span class="a">${it.chosen === null ? "Sans réponse" : "Ta réponse : " + esc(it.q.options[it.chosen])}</span>
      <span class="a"><b>Bonne réponse : ${esc(it.q.options[it.q.answer])}</b></span>
      <span class="note">${esc(it.q.explication)}</span></div>`).join("");
  app.innerHTML = `
    <p class="eyebrow">${esc(S.label)}</p>
    <div style="display:flex;align-items:end;gap:14px;flex-wrap:wrap"><span class="score">${good}<small> / ${n}</small></span>
      <span class="pill" style="--c:var(${pass ? "--ok" : "--ko"});--c-soft:var(${pass ? "--ok-soft" : "--ko-soft"})">${exam ? (pass ? "Réussi (32 minimum)" : "Non réussi (32 minimum)") : (pass ? "Au-dessus de 80 %" : "Sous les 80 %")}</span></div>
    <div class="row"><button class="btn" id="home">Accueil</button>${wrong.length ? `<button class="btn ghost" id="again">Refaire les ${wrong.length} erreurs</button>` : ""}</div>
    ${wrong.length ? `<h2>À revoir</h2><div class="review">${review}</div>` : `<p class="lede">Aucune erreur sur cette série.</p>`}`;
  app.querySelector("#home").onclick = home;
  const ag = app.querySelector("#again"); if (ag) ag.onclick = () => start("theme", shuffle(wrong.map(it => it.q)), "Mes erreurs");
  window.scrollTo(0, 0);
}

home();
</script>

</body>
</html>
